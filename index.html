<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Дневник тренировок</title>
<style>
:root {
  color-scheme: light;
  --bg: #f4f4f2;
  --surface: #fcfcfb;
  --surface-2: #efefec;
  --border: #dddcd7;
  --text: #0b0b0b;
  --text-2: #52514e;
  --muted: #8a8984;
  --accent: #2a78d6;
  --accent-ink: #ffffff;
  --accent-soft: #e3eefb;
  --good: #1f7a3a;
  --good-soft: #e2f3e6;
  --warn: #9a6400;
  --warn-soft: #fbf0d9;
  --bad: #c03a39;
  --bad-soft: #fbe5e5;
  --skip: #7a7974;
  --skip-soft: #ececea;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #121211;
    --surface: #1a1a19;
    --surface-2: #242423;
    --border: #34342f;
    --text: #ffffff;
    --text-2: #c3c2b7;
    --muted: #8f8e86;
    --accent: #3987e5;
    --accent-ink: #ffffff;
    --accent-soft: #1d2d42;
    --good: #5cc27a;
    --good-soft: #1b3123;
    --warn: #e0a83a;
    --warn-soft: #3a2f17;
    --bad: #e66767;
    --bad-soft: #3d1f1f;
    --skip: #a3a29a;
    --skip-soft: #2a2a28;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #121211; --surface: #1a1a19; --surface-2: #242423; --border: #34342f;
  --text: #ffffff; --text-2: #c3c2b7; --muted: #8f8e86;
  --accent: #3987e5; --accent-ink: #ffffff; --accent-soft: #1d2d42;
  --good: #5cc27a; --good-soft: #1b3123; --warn: #e0a83a; --warn-soft: #3a2f17;
  --bad: #e66767; --bad-soft: #3d1f1f; --skip: #a3a29a; --skip-soft: #2a2a28;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--text);
  font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
header.top {
  position: sticky; top: 0; z-index: 10;
  background: var(--surface); border-bottom: 1px solid var(--border);
}
.top-inner { max-width: 920px; margin: 0 auto; padding: 10px 16px 0; }
.brand { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.brand h1 { font-size: 18px; margin: 0; }
.brand .sub { color: var(--muted); font-size: 13px; }
nav.tabs { display: flex; gap: 2px; overflow-x: auto; margin-top: 8px; scrollbar-width: none; }
nav.tabs button {
  border: 0; background: none; color: var(--text-2); font: inherit;
  padding: 8px 12px; border-bottom: 2px solid transparent; cursor: pointer; white-space: nowrap;
}
nav.tabs button.active { color: var(--text); border-bottom-color: var(--accent); font-weight: 600; }
main { max-width: 920px; margin: 0 auto; padding: 16px; }
h2 { font-size: 20px; margin: 4px 0 12px; }
h3 { font-size: 16px; margin: 0 0 8px; }
.card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 14px 16px; margin-bottom: 12px;
}
.card.soft { background: var(--surface-2); }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.grow { flex: 1; }
.btn {
  border: 1px solid var(--border); background: var(--surface); color: var(--text);
  font: inherit; padding: 8px 14px; border-radius: 8px; cursor: pointer;
}
.btn:hover { border-color: var(--text-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.danger { color: var(--bad); }
.btn.sm { padding: 4px 10px; font-size: 13px; }
.btn.icon { padding: 4px 9px; }
input, textarea, select {
  font: inherit; color: var(--text); background: var(--surface);
  border: 1px solid var(--border); border-radius: 8px; padding: 7px 9px; width: 100%;
}
textarea { min-height: 70px; resize: vertical; }
input:focus, textarea:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
label.f { display: block; font-size: 13px; color: var(--text-2); margin-bottom: 10px; }
label.f > input, label.f > textarea, label.f > select { margin-top: 4px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 0 12px; }
.badge {
  display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 999px;
  background: var(--surface-2); color: var(--text-2); white-space: nowrap;
}
.badge.good { background: var(--good-soft); color: var(--good); }
.badge.warn { background: var(--warn-soft); color: var(--warn); }
.badge.skip { background: var(--skip-soft); color: var(--skip); }
.badge.accent { background: var(--accent-soft); color: var(--accent); }
.badge.bad { background: var(--bad-soft); color: var(--bad); }
.callout.warn { border-color: var(--warn); background: var(--warn-soft); }
.wish { padding: 8px 0; border-top: 1px solid var(--border); }
.wish:first-of-type { border-top: 0; }
.chk-line { display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--text-2); margin: -4px 0 10px; }
.chk-line input { width: 18px; height: 18px; }
.ex-card { display: grid; grid-template-columns: 34px 1fr; gap: 10px; padding: 12px 0; border-top: 1px solid var(--border); }
.ex-card:first-child { border-top: 0; }
.ex-num {
  width: 30px; height: 30px; border-radius: 50%; background: var(--accent-soft); color: var(--accent);
  display: grid; place-items: center; font-weight: 700; font-size: 14px;
}
.ex-name { font-weight: 600; font-size: 16px; flex: 1 1 200px; }
.ex-scheme { font-size: 22px; font-weight: 700; letter-spacing: -0.3px; margin: 2px 0; }
.ex-scheme .unit { font-size: 14px; font-weight: 500; color: var(--text-2); }
.badge.time { background: none; border: 1px solid var(--border); color: var(--text-2); margin-left: 6px; }
.grp { margin-top: 6px; }
.grp-h { font-size: 11.5px; font-weight: 600; letter-spacing: .4px; text-transform: uppercase; color: var(--muted); }
.grp-h .rest { text-transform: none; letter-spacing: 0; font-weight: 500; color: var(--text-2); }
.last { font-size: 13px; color: var(--text-2); background: var(--surface-2); border-radius: 8px; padding: 5px 8px; margin: 6px 0 4px; }
.ss-part .last { background: var(--surface); }
.last-h { color: var(--muted); font-weight: 600; }
.last.done { background: var(--good-soft); }
.plan-switch { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 6px; margin: 0 0 14px; }
.plan-switch button { display: flex; flex-direction: column; align-items: center; gap: 1px; padding: 7px 2px 6px; font: inherit; cursor: pointer;
  background: var(--surface); color: var(--text-2); border: 1px solid var(--border); border-radius: 10px; }
.plan-switch .wd { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
.plan-switch .dt { font-size: 15px; font-weight: 600; color: var(--text); white-space: nowrap; }
.plan-switch .st { font-size: 11px; color: var(--muted); }
.plan-switch .st.good { color: var(--good); }
.plan-switch .st.next { color: var(--accent); font-weight: 600; }
.plan-switch button.on { background: var(--accent-soft); border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.plan-switch button.on .wd, .plan-switch button.on .dt { color: var(--accent); }
.last-note { color: var(--muted); margin-top: 2px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.grp-warm { font-size: 14px; color: var(--text-2); margin-top: 1px; }
.rest-after { margin-top: 8px; padding: 6px 10px; border-radius: 8px; background: var(--surface-2); font-size: 13px; color: var(--text-2); }
.rest-after b { color: var(--text); }
.ss-head { font-size: 13px; color: var(--text-2); margin: 2px 0 4px; }
.ss-part { display: grid; grid-template-columns: 28px 1fr; gap: 8px; background: var(--surface-2); border-left: 3px solid var(--accent); border-radius: 0 8px 8px 0; padding: 8px 10px; margin-top: 6px; }
.ss-label { width: 26px; height: 26px; border-radius: 6px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-weight: 700; font-size: 13px; }
.ss-part .ex-name { font-size: 15px; }
.ss-part .ex-scheme { font-size: 19px; }
.ss-link { font-size: 12.5px; color: var(--accent); padding: 4px 0 0 46px; }
.ss-tag { display: inline-block; font-size: 12px; font-weight: 600; color: var(--accent); margin-bottom: 4px; }
.set-dots { display: flex; gap: 4px; margin: 4px 0; }
.set-dots span { width: 22px; height: 6px; border-radius: 3px; background: var(--accent); opacity: .85; }
.callout { border-left: 3px solid var(--accent); padding: 8px 12px; background: var(--accent-soft); border-radius: 0 8px 8px 0; margin-bottom: 10px; }
.callout.good { border-color: var(--good); background: var(--good-soft); }
.callout h4 { margin: 0 0 4px; font-size: 13px; text-transform: uppercase; letter-spacing: .4px; color: var(--text-2); }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; flex-wrap: wrap; }
.seg button { border: 0; background: var(--surface); color: var(--text-2); font: inherit; padding: 8px 12px; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--border); }
.seg button.on { background: var(--accent); color: var(--accent-ink); }
.sets-table { width: 100%; border-collapse: collapse; margin-top: 6px; }
.sets-table th { font-size: 12px; font-weight: 500; color: var(--muted); text-align: left; padding: 2px 4px; }
.sets-table td { padding: 3px 4px; }
.sets-table td:first-child { width: 28px; color: var(--muted); font-size: 13px; }
.sets-table input { padding: 5px 7px; }
.sets-table td.chk { width: 32px; text-align: center; }
.sets-table input[type=checkbox] { width: 18px; height: 18px; }
.log-ex { border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; margin-bottom: 10px; background: var(--surface); }
.scale { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 4px; }
.scale button {
  min-width: 36px; padding: 6px 8px; border: 1px solid var(--border); background: var(--surface);
  border-radius: 6px; cursor: pointer; color: var(--text-2); font: inherit;
}
.scale button.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.hist-item { display: flex; gap: 12px; align-items: flex-start; }
.hist-date { min-width: 64px; text-align: center; }
.hist-date .d { font-size: 22px; font-weight: 700; line-height: 1; }
.hist-date .m { font-size: 12px; color: var(--muted); }
details summary { cursor: pointer; color: var(--text-2); font-size: 13px; }
pre.prompt {
  white-space: pre-wrap; word-break: break-word; background: var(--surface-2); border: 1px solid var(--border);
  border-radius: 8px; padding: 12px; max-height: 360px; overflow: auto; font-size: 12.5px;
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
.toast {
  position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%);
  background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 8px;
  font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 50; max-width: calc(100% - 32px);
}
.toast.show { opacity: 1; }
.empty { text-align: center; padding: 30px 16px; }
.empty p { color: var(--text-2); }
/* attendance */
.att { display: grid; grid-template-columns: 70px repeat(7, 1fr); gap: 4px; font-size: 12px; align-items: center; }
.att .h { color: var(--muted); text-align: center; }
.att .wk { color: var(--muted); }
.att .c {
  height: 30px; border-radius: 6px; background: var(--surface-2); display: grid; place-items: center;
  font-weight: 700; font-size: 13px; color: transparent;
}
.att .c.done { background: var(--good-soft); color: var(--good); }
.att .c.skipped { background: var(--skip-soft); color: var(--skip); }
.att .c.sick { background: var(--warn-soft); color: var(--warn); }
.att .c.today { outline: 2px solid var(--accent); outline-offset: -2px; }
.att .c.future { opacity: .4; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--text-2); margin-top: 10px; }
.legend i { display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: 4px; font-style: normal; font-weight: 700; font-size: 11px; margin-right: 5px; vertical-align: -3px; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 12px; }
.stat { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 14px; }
.stat .v { font-size: 24px; font-weight: 700; }
.stat .l { font-size: 12px; color: var(--muted); }
/* chart */
.chart-wrap { position: relative; }
.chart-wrap svg { width: 100%; height: auto; display: block; }
.chart-wrap .grid line { stroke: var(--border); stroke-width: 1; }
.chart-wrap .axis text { fill: var(--muted); font-size: 11px; }
.chart-wrap .line { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.chart-wrap .pt { fill: var(--accent); stroke: var(--surface); stroke-width: 2; }
.chart-wrap .cross { stroke: var(--text-2); stroke-width: 1; stroke-dasharray: 3 3; }
.tip {
  position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--border);
  border-radius: 8px; padding: 6px 10px; font-size: 12.5px; box-shadow: 0 4px 14px rgba(0,0,0,.12);
  white-space: nowrap; display: none; z-index: 5;
}
table.data { width: 100%; border-collapse: collapse; font-size: 13px; }
table.data th, table.data td { text-align: left; padding: 5px 6px; border-bottom: 1px solid var(--border); }
table.data th { color: var(--muted); font-weight: 500; }
@media print {
  :root { color-scheme: light; --bg: #fff; --surface: #fff; --surface-2: #f4f4f2; --text: #000; --text-2: #333; --muted: #666; --border: #ccc; }
  header.top, .no-print, .toast { display: none !important; }
  body { background: #fff; font-size: 12.5px; }
  main { max-width: none; padding: 0; }
  .card { border-color: #ccc; padding: 10px 12px; margin-bottom: 8px; }
  .card.soft, .callout { break-inside: avoid; }
  .ex-card { break-inside: avoid; padding: 8px 0; }
  .ex-scheme { font-size: 18px; }
  .callout { background: none !important; }
  .badge { border: 1px solid #ccc; background: none !important; }
}
@media (max-width: 560px) {
  .ex-scheme { font-size: 19px; }
  .hist-date { min-width: 48px; }
  .att { grid-template-columns: 52px repeat(7, 1fr); }
}
</style>
</head>
<body>
<header class="top">
  <div class="top-inner">
    <div class="brand">
      <h1>Дневник тренировок</h1>
      <span class="sub" id="brandSub"></span>
    </div>
    <nav class="tabs" id="tabs">
      <button data-tab="today">План</button>
      <button data-tab="history">История</button>
      <button data-tab="progress">Прогресс</button>
      <button data-tab="claude">Тренер</button>
      <button data-tab="settings">Данные</button>
    </nav>
  </div>
</header>
<main id="app"></main>
<div class="toast" id="toast"></div>
<input type="file" id="fileInput" accept=".json,application/json" hidden>

<script>
'use strict';
/* =====================================================================
   Хранилище: localStorage (ключ STORE_KEY) + ручной бэкап в JSON-файл + автобэкап в GitHub (GH_KEY).
   ===================================================================== */
const STORE_KEY = 'workoutApp.v1';
const DRAFT_KEY = 'workoutApp.draft.v1';
const UI_KEY = 'workoutApp.ui.v1';
const UNDO_KEY = 'workoutApp.undo.v1';   // снимок данных до последней загрузки ответа тренера
const GH_KEY = 'workoutApp.github.v1';   // настройки автобэкапа в GitHub (токен хранится только здесь, в бэкап не попадает)

// Базовый профиль (приложение однопользовательское — меняется прямо здесь).
// Поля из PROFILE_FIELDS тренер (Claude) может обновлять через profile_update в ответе, а я — вручную на вкладке «Данные».
const PROFILE = {
  sex: 'мужчина',
  birthDate: '1994-01-04',
  height: 179,
  startWeight: 76,
  daysPerWeek: 2,
  sessionMinutes: 70,
  goal: 'Набор мышечной массы и рост силы равномерно по всему телу. Акценты на отдельные мышцы (например, трапецию) — только по моим пожеланиям к конкретной тренировке, а не главная цель.',
  experience: 'Не новичок: есть опыт тренировок, после перерыва вернулся и занимаюсь около полугода, 2 раза в неделю.',
  schedule: '2 тренировки в неделю, обычно вторник и пятница (изредка дни сдвигаются). Возможно, позже перейду на 3 тренировки в неделю.',
  duration: 'Около 70 мин вместе с разминкой и заминкой. По расчёту приложения план не дольше ориентира больше чем на 5 минут.',
  maxSupersets: 2,
  rest: 'Сколько отдыхать, не знаю — отдых между подходами и упражнениями подбирает тренер под каждое упражнение.',
  equipment: 'Тренажёрный зал: штанга, гантели, турник, брусья, блочные тренажёры, гак-машина.',
  limitations: 'Боли в пояснице. Пока отказ от приседаний и становой тяги.',
  recommendations: '',
  avoid: 'Икры (достаточно развиты), тяга каната к лицу, разведения гантелей лёжа, сгибания ног лёжа; в разминке — эллипс и упражнения на полу («кошка-корова»).',
  likes: ''
};
// Что тренер может менять. Длительность в минутах (session_minutes) и лимит суперсетов (max_supersets) — отдельные числа:
// по ним приложение проверяет план при загрузке.
const PROFILE_FIELDS = [
  ['goal', 'Цель'], ['experience', 'Опыт'], ['schedule', 'Расписание'], ['duration', 'Длительность'],
  ['rest', 'Отдых'], ['equipment', 'Оборудование'], ['limitations', 'Ограничения'],
  ['avoid', 'Не предлагать'], ['likes', 'Что нравится'], ['recommendations', 'Рекомендации тренера']
];
const PROFILE_NUMBERS = { sessionMinutes: ['session_minutes', 20, 240], maxSupersets: ['max_supersets', 0, 6] };
const PROFILE_LABELS = { ...Object.fromEntries(PROFILE_FIELDS), sessionMinutes: 'Ориентир по времени, мин', maxSupersets: 'Лимит суперсетов' };
// Допуск по времени: план дольше ориентира больше чем на столько минут — ошибка плана.
const TIME_SLACK_MIN = 5;

function emptyState() {
  return { version: 2, plans: [], history: [], requests: [], profileEdits: {}, profileLog: [] };
}

function safeGet(key) { try { return localStorage.getItem(key); } catch (e) { return null; } }
function safeSet(key, val) {
  try { localStorage.setItem(key, val); return true; }
  catch (e) { toast('Не удалось сохранить в localStorage — сделайте бэкап в файл'); return false; }
}
function safeDel(key) { try { localStorage.removeItem(key); } catch (e) {} }

function loadState() {
  const raw = safeGet(STORE_KEY);
  if (!raw) return null;
  try {
    const s = JSON.parse(raw);
    delete s.profile;
    return { ...emptyState(), ...s };
  } catch (e) { return null; }
}

let state = loadState(); // null при первом запуске — заполняется стартовыми данными перед render()
function save() { safeSet(STORE_KEY, JSON.stringify(state)); ghSchedule(); }

let ui = { tab: 'today', promptCount: 6, progressEx: '' };
try { Object.assign(ui, JSON.parse(safeGet(UI_KEY) || '{}')); } catch (e) {}
function saveUi() { safeSet(UI_KEY, JSON.stringify(ui)); }

let draft = null;
try { draft = JSON.parse(safeGet(DRAFT_KEY) || 'null'); } catch (e) { draft = null; }
function saveDraft() { draft ? safeSet(DRAFT_KEY, JSON.stringify(draft)) : safeDel(DRAFT_KEY); }

// Откат последней загрузки: перед импортом сохраняем данные и текст описания целиком, кнопка возвращает их.
function getUndo() { try { return JSON.parse(safeGet(UNDO_KEY) || 'null'); } catch (e) { return null; } }
function undoHtml() {
  const u = getUndo();
  if (!u) return '';
  const t = new Date(u.at);
  return `<div class="callout no-print" style="margin-bottom:12px"><div class="row"><span class="grow small">Загружен ответ тренера${u.what ? `: ${esc(u.what)}` : ''} · ${t.getDate()} ${MONTHS[t.getMonth()]}, ${String(t.getHours()).padStart(2, '0')}:${String(t.getMinutes()).padStart(2, '0')}. Проверьте; если что-то не так — откатите.</span>
    <button class="btn sm" data-act="undo-import">↶ Откатить загрузку</button></div></div>`;
}
function undoImport() {
  const u = getUndo();
  if (!u) return;

function metaLine(h) {

  if (h.duration) parts.push(`${h.duration} мин`);

function setsLine(ex) {
  const u = ex.unit === 'sec' ? 'с' : '';
  const one = (s) => `${s.weight ? `${+s.weight}кг×` : ''}${s.reps ?? '?'}${u}${s.warmup ? ' (разм.)' : ''}${s.done === false ? ' (не вып.)' : ''}`;
  const out = [];
  for (const s of ex.sets) {
    const t = one(s), last = out[out.length - 1];
    if (last && last.t === t) last.n++; else out.push({ t, n: 1 });

  const t = parseIso(today);
  const mondayOffset = (t.getDay() + 6) % 7;
  const thisMonday = addDays(today, -mondayOffset);
  let html = `<div class="att"><div></div>${['пн', 'вт', 'ср', 'чт', 'пт', 'сб', 'вс'].map(d => `<div class="h">${d}</div>`).join('')}`;
  for (let w = weeks - 1; w >= 0; w--) {
    const mon = addDays(thisMonday, -7 * w);
    const md = parseIso(mon);
    html += `<div class="wk">${md.getDate()} ${MONTHS[md.getMonth()]}</div>`;
    for (let i = 0; i < 7; i++) {
      const day = addDays(mon, i);
      const st = byDate[day];
      const cls = ['c', st || '', day === today ? 'today' : '', day > today ? 'future' : ''].join(' ');
      html += `<div class="${cls}" title="${fmtDate(day)}${st ? ' — ' + STATUS[st].label : ''}">${st ? STATUS[st].glyph : ''}</div>`;
    }
  }
  return html + `</div>`;
}

function mountChart() {
  const sel = $('#exSelect');
  if (sel) sel.onchange = () => { ui.progressEx = sel.value; saveUi(); render(); };
  const el = $('#chart'); if (!el) return;
  const data = seriesFor(ui.progressEx);
  if (data.length < 2) { el.innerHTML = `<p class="small muted">Для графика нужно минимум две записи${ui.progressEx === BODYWEIGHT ? ' с весом тела' : ' с этим упражнением'}.</p>`; return; }
  const W = Math.max(300, Math.round(el.clientWidth || 640)), H = Math.round(Math.min(260, Math.max(200, W * 0.45))), m = { l: 40, r: 14, t: 12, b: 26 };
  const t0 = parseIso(data[0].date).getTime(), t1 = parseIso(data[data.length - 1].date).getTime();
  const vals = data.map(d => d.value);
  let lo = Math.min(...vals), hi = Math.max(...vals);
  const padV = Math.max((hi - lo) * 0.15, 1); lo = Math.max(0, lo - padV); hi = hi + padV;
  const x = (d) => m.l + (t1 === t0 ? 0.5 : (parseIso(d).getTime() - t0) / (t1 - t0)) * (W - m.l - m.r);
  const y = (v) => m.t + (1 - (v - lo) / (hi - lo)) * (H - m.t - m.b);
  const ticks = niceTicks(lo, hi, 4);
  const pts = data.map(d => [x(d.date), y(d.value)]);
  const xIdx = data.length <= 6 ? data.map((_, i) => i) : [0, Math.floor(data.length / 3), Math.floor(2 * data.length / 3), data.length - 1];
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="График: ${esc(ui.progressEx)}">
    <g class="grid">${ticks.map(t => `<line x1="${m.l}" x2="${W - m.r}" y1="${y(t)}" y2="${y(t)}"/>`).join('')}</g>
    <g class="axis">${ticks.map(t => `<text x="${m.l - 6}" y="${y(t) + 4}" text-anchor="end">${+t.toFixed(1)}</text>`).join('')}
      ${xIdx.map(i => { const d = parseIso(data[i].date); return `<text x="${x(data[i].date)}" y="${H - 6}" text-anchor="middle">${d.getDate()} ${MONTHS[d.getMonth()]}</text>`; }).join('')}</g>
    <path class="line" d="${pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ')}"/>
    <line class="cross" id="cross" y1="${m.t}" y2="${H - m.b}" style="display:none"/>
    ${pts.map(p => `<circle class="pt" cx="${p[0]}" cy="${p[1]}" r="4.5"/>`).join('')}
    <rect id="hit" x="${m.l}" y="0" width="${W - m.l - m.r}" height="${H}" fill="transparent"/>
  </svg><div class="tip" id="tip"></div>`;
  const svg = el.querySelector('svg'), tip = $('#tip'), cross = $('#cross');
  const move = (clientX) => {
    const r = svg.getBoundingClientRect();
    const sx = (clientX - r.left) * (W / r.width);
    let bi = 0; pts.forEach((p, i) => { if (Math.abs(p[0] - sx) < Math.abs(pts[bi][0] - sx)) bi = i; });
    const p = pts[bi], d = data[bi];
    cross.setAttribute('x1', p[0]); cross.setAttribute('x2', p[0]); cross.style.display = '';
    tip.innerHTML = `<b>${fmtDate(d.date)}</b><br>${+d.value} ${d.metric}<br><span class="muted">${esc(d.detail)}</span>`;
    tip.style.display = 'block';
    const px = p[0] * r.width / W, py = p[1] * r.height / H;
    const tw = tip.offsetWidth;
    tip.style.left = Math.min(Math.max(0, px - tw / 2), r.width - tw) + 'px';
    tip.style.top = Math.max(0, py - tip.offsetHeight - 12) + 'px';
  };
  const hit = $('#hit');
  hit.addEventListener('mousemove', e => move(e.clientX));
  hit.addEventListener('touchstart', e => move(e.touches[0].clientX), { passive: true });
  hit.addEventListener('touchmove', e => move(e.touches[0].clientX), { passive: true });
  hit.addEventListener('mouseleave', () => { tip.style.display = 'none'; cross.style.display = 'none'; });
}
function niceTicks(lo, hi, n) {
  const span = hi - lo, raw = span / n, mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 2.5, 5, 10].map(s => s * mag).find(s => span / s <= n) || mag * 10;
  const out = []; for (let v = Math.ceil(lo / step) * step; v <= hi + 1e-9; v += step) out.push(v);
  return out;
}

/* =====================================================================
   Вкладка «Тренер» — промпт тренера и импорт итогового JSON
   ===================================================================== */
function planLine(ex) {
  if (isStage(ex)) return `${num(ex.duration_min) || 5} мин${ex.notes ? `: ${ex.notes}` : ''}`;
  if (isSuperset(ex)) return `${supersetHead(ex)}; ${ex.parts.map((p, j) => `${SS_LABELS[j]}) ${p.name}: ${planLine({ ...p, sets: ex.sets, rest_sec: null })}`).join('; ')}`;
  const parts = [planText(ex)];
  if (ex.rest_sec) parts.push(`отдых ${fmtRest(ex.rest_sec)}`);
  if (ex.rpe) parts.push(`RPE ${fmtRpe(ex.rpe)}`);
  return parts.join(', ');
}

  L.push(`5. **Упражнения в слоты.** Приоритет: то, что я уже делаю (есть в истории и сводке, прогресс читается) → «Что нравится» → новое. Каждое упражнение сверяй с «Не предлагать», «Ограничения» и «Оборудование». Новых упражнений в плане — не больше двух; остальные замены — в следующие тренировки. Не переноси упражнения механически: для каждого ответь себе, зачем оно, какую мышцу закрывает и нет ли варианта лучше. Если я пишу, что не уверен в упражнении, не чувствую мышцу или делаю его «просто так», — реши: оставить (и объяснить, как делать), заменить или убрать. Без дублей: одно и то же упражнение (или близкий вариант того же движения) — один раз в плане, в том числе в разминке, заминке и суперсетах; разминка (№1) — только общая, без упражнений основной части; повторы и подходы в разминке бери из моих комментариев о том, как я её фактически делаю (например, приседания 2 × 20), а не придумывай свои; перед тем как писать разминку, прочитай в истории (комментарии, уточнения, мой текст), что я фактически делаю в разминке: если там упражнение из основной части (например, гиперэкстензия), не ставь его второй раз — вынеси его отдельным пунктом сразу после разминки (№2, разминочный подход в sets_detail), а в описании разминки перечисли только то, что в ней делать, и это упражнение не называй даже с «не делать» (приложение сочтёт упоминание дублем); разминка и заминка не повторяют друг друга (например, вис — только в одной из них). Разминочные подходы — в sets_detail самого упражнения (warmup: true), а не в разминку. Разминочный подход нужен первому упражнению на каждую крупную группу в тренировке (первый жим, первая тяга, первое упражнение на ноги), а не только жиму лёжа и гаку.`);

    warnings: ['Риск или важное замечание, если есть (иначе пустой массив)'],

    ],
    next_workout: {
      date: 'YYYY-MM-DD',
      title: 'Название, например «Вторник — грудь»',
      focus: 'Фокус тренировки',

        { name: 'Упражнение с разными подходами', sets: 4, reps: 6, unit: 'reps', weight: 77.5, rest_sec: 150, rpe: 90, change: '+2.5 кг',

очими подходами, rest_between_exercises_sec (или rest_after_sec упражнения) между упражнениями, переход между частями суперсета 15 сек, плюс разминка и заминка. По этому расчёту тренировка не дольше ${P.sessionMinutes + TIME_SLACK_MIN} мин. wishes_review — по одному пункту на каждое пожелание из моего текста; из обсуждения — только решения, которые меняют план, близкие объединяй; reason — одна-две фразы (пустой массив, если пожеланий нет); decision — строго одно из четырёх значений. «Принято по настоянию» в wishes_review и insist: true у этого пожелания в completed_workout.wishes должны совпадать.${report ? ' answers — мои вопросы из текста и твои итоговые ответы с учётом обсуждения (пустой массив, если вопросов не было): приложение сохранит их рядом с планом.' : ''} Приложение проверяет план при загрузке: одно упражнение дважды (в том числе в разминке или заминке и в основной части), упражнение из «Не предлагать», суперсетов больше лимита, время больше ${P.sessionMinutes + TIME_SLACK_MIN} мин — ошибка, я увижу предупреждение и верну план тебе.`);
  L.push(`Правила для profile_update: это твои правки в разделе «Обо мне» — ты мой тренер и ведёшь эти данные. Поля: ${PROFILE_FIELDS.map(([k, l]) => `${k} (${l.toLowerCase()})`).join(', ')}, а также числа session_minutes (ориентир длительности, мин) и max_supersets (лимит суперсетов в плане). Значение текстового поля — полный новый текст, он заменит старый целиком, поэтому сохрани из старого всё, что остаётся верным. avoid — упражнения и приёмы, которые мне не предлагать (я отказался, не делаю, не нравится), с причиной в скобках, если она есть; likes — что мне нравится и что я хочу оставить; дописывай в них, ничего не теряя. recommendations — твои постоянные рекомендации, которые должны действовать во всех следующих тренировках (отдых, техника, восстановление, питание); то, что касается только следующей тренировки, пиши в recommendation. Включай только поля, по которым в этом чате появился новый факт, — обычно одно-два; когда менять нечего — не включай profile_update вообще. Меняй, когда для этого есть причина: я сообщил о новой боли или травме, ограничение снято, сменились расписание или цель, я отказался от упражнения, ты выработал правило по отдыху. reason — коротко, почему меняешь.`);
  if (report) L.push(`Правила для completed_workout: это запись о тренировке из моего текста, приложение сохранит её в историю без ручной правки, поэтому ничего не выдумывай. date — дата тренировки: если я её не назвал и она не очевидна, спроси на этапе 1; если так и не выяснили — сегодня и пометка в assumptions. status: "done" — тренировка была (хотя бы частично), "skipped" — пропуск, "sick" — болезнь; для skipped/sick причина в reason, exercises пустой. В exercises — каждое упражнение плана по номеру tag ("2", "5А"; у суперсета — каждая часть отдельно), название и план приложение подставит само по номеру. Разминку и заминку (первый и последний номера) в exercises не включай; если я про них что-то написал (пропустил, сократил), отметь это в общих notes записи. as_planned: true — сделано как в плане (и если я про упражнение ничего не сказал — тоже as_planned, но отметь это в assumptions). Если что-то отличалось — sets: полный список фактически сделанных подходов {weight, reps, warmup?, done?} с фактическим весом каждого подхода (разный вес по подходам — разные подходы, а не одна цифра и пояснение в notes); подходы, которые я не сделал, не включай. skipped: true — упражнение не делал. Упражнение не из плана — tag null и name (то же название, что в истории, если оно там есть). rpe — тяжесть упражнения в процентах, только если я её назвал или явно описал (например, «до отказа» = 100). wellbeing — самочувствие 1–5, effort — общая тяжесть тренировки в %, duration — минуты, sleep — часы сна; чего нет в тексте — null. bodyweight — только утренний вес натощак (по нему строится динамика); вес после тренировки, вечером или «примерно» — bodyweight null, а цифру с пояснением — в notes. wishes — список пожеланий к следующей тренировке только из моего текста «Как прошла тренировка», каждое отдельно: { "text": "...", "insist": true|false }, insist — по каждому пожеланию отдельно (см. «Мои пожелания»). То, о чём мы договорились в обсуждении, в wishes не добавляй: решения — в wishes_review и в план, постоянные отказы и предпочтения — в profile_update (avoid, likes). Если в тексте нет описания тренировки, а есть только пожелания, — не включай completed_workout, а пожелания верни отдельным полем верхнего уровня request: { "text": "...", "insist": true|false }. assumptions — всё, что пришлось додумать или что могло быть понято двояко (пустой массив, если всё ясно).`);
  return L.join('\n');
}

function extractJson(text) {
  const fences = [...text.matchAll(/```(?:json)?\s*([\s\S]*?)```/gi)].map(m => m[1]);
  const candidates = [...fences.reverse()];
  const a = text.indexOf('{'), b = text.lastIndexOf('}');
  if (a >= 0 && b > a) candidates.push(text.slice(a, b + 1));
  for (const c of candidates) {
    try { const o = JSON.parse(c.trim()); if (o && typeof o === 'object') return o; } catch (e) {}
  }
  return null;
}
function normalizePlan(o) {
  const nw = o.next_workout || o.nextWorkout || o.workout || (o.exercises ? o : null);
  if (!nw || !Array.isArray(nw.exercises) || !nw.exercises.length) throw new Error('В JSON нет next_workout.exercises');
  const weightOrNull = (v) => (v === null || v === undefined || v === '') ? null : num(v);
  return {
    id: uid(),
    createdAt: new Date().toISOString(),
    date: /^\d{4}-\d{2}-\d{2}$/.test(nw.date || '') ? nw.date : todayIso(),
    title: String(nw.title || 'Тренировка'),
    focus: nw.focus ? String(nw.focus) : '',
    duration_min: num(nw.duration_min),
    rest_between_exercises_sec: num(nw.rest_between_exercises_sec),
    summary: o.summary ? String(o.summary) : '',
    recommendation: o.recommendation ? String(o.recommendation) : '',
    warnings: Array.isArray(o.warnings) ? o.warnings.filter(Boolean).map(String) : (o.warnings ? [String(o.warnings)] : []),
    answers: Array.isArray(o.answers) ? o.answers.filter(x => x && x.question && x.answer).map(x => ({ question: String(x.question), answer: String(x.answer) })) : [],

// completed_workout из ответа Claude → запись истории. Упражнения плана находятся по номеру (tag),

function normalizeLog(c, plan) {
  const status = STATUS[c.status] ? c.status : 'done';
  const byTag = Object.fromEntries((plan ? flatExercises(plan) : []).map(f => [f.tag, f]));
  const tagKey = (t) => String(t ?? '').trim().toUpperCase().replace(/^(\d+)\s*/, '$1')
    .replace(/A/g, 'А').replace(/B/g, 'Б').replace(/V/g, 'В').replace(/G/g, 'Г');

  const toSet = (x, done = true) => ({ reps: firstNum(x.reps), weight: num(x.weight) ?? 0, done: done && x.done !== false, ...(x.warmup ? { warmup: true } : {}) });
  // Номер целого суперсета («4») разворачиваем в его части (4А, 4Б) с теми же данными.
  const items = (Array.isArray(c.exercises) ? c.exercises : []).flatMap(e => {
    const k = tagKey(e.tag);
    if (!k || byTag[k] || !byTag[k + SS_LABELS[0]]) return [e];
    return SS_LABELS.filter(l => byTag[k + l]).map(l => ({ ...e, tag: k + l, sets: null }));
  });
  const lost = [];   // номера, которых нет в плане, — не теряем молча
  const exercises = status !== 'done' ? [] : items.map(e => {
    const base = byTag[tagKey(e.tag)] || null;
    if (base && base.stage) return null;   // разминка/заминка — без подходов, в историю не пишем
    const name = String((base && base.ex.name) || e.name || '').trim();
    if (!name) { if (tagKey(e.tag)) lost.push(tagKey(e.tag)); return null; }
    const own = Array.isArray(e.sets) && e.sets.length ? e.sets : null;
    const sets = e.skipped ? (base ? plannedSets(base.ex).map(x => toSet(x, false)) : [])
      : own ? own.map(x => toSet(x)) : base ? plannedSets(base.ex).map(x => toSet(x)) : [];
    if (!sets.length) return null;
    return {
      name, unit: e.unit === 'sec' || (base && base.ex.unit === 'sec') ? 'sec' : 'reps',
      planned: base ? { text: planText(base.ex), rpe: base.ex.rpe ?? null } : null,
      ...(base && base.ss ? { superset: base.tag } : {}),
      rpe: normRpe(e.rpe), sets, notes: [e.skipped ? 'не выполнял' : '', e.notes ? String(e.notes).trim() : ''].filter(Boolean).join('; ')

  const wishList = (Array.isArray(c.wishes) ? c.wishes : c.wishes ? [{ text: c.wishes, insist: c.insist }] : [])
    .map(w => typeof w === 'string' ? { text: w.trim(), insist: false } : { text: String((w && (w.text ?? w.wish)) || '').trim(), insist: !!(w && w.insist) })
    .filter(w => w.text);

  return {
    id: uid(), createdAt: new Date().toISOString(),
    date: /^\d{4}-\d{2}-\d{2}$/.test(c.date || '') ? c.date : todayIso(),
    status, planId: plan ? plan.id : null, title: String(c.title || (plan && plan.title) || 'Тренировка'),
    wellbeing: wellbeing >= 1 && wellbeing <= 5 ? Math.round(wellbeing) : null,
    notes: c.notes ? String(c.notes).trim() : '', bodyweight: num(c.bodyweight), extras: c.extras ? String(c.extras).trim() : '',
    wishes, insist: wishList.some(w => w.insist), ...(wishList.length > 1 ? { wishList } : {}),
    ...(status === 'done'
      ? { exercises, effort: normRpe(c.effort), duration: num(c.duration), sleep: num(c.sleep) }
      : { reason: c.reason ? String(c.reason).trim() : '' }),
    report: (ui.report || '').trim(),
    assumptions: [...(Array.isArray(c.assumptions) ? c.assumptions : []), ...(Array.isArray(c.questions) ? c.questions : []),

// Проверка плана от тренера: одно упражнение дважды (в том числе в разминке/заминке и в основной части),
// упражнения из «Не предлагать», лимит суперсетов и время сверх ориентира.
const nameKey = (t) => String(t || '').toLowerCase().replace(/ё/g, 'е').replace(/\([^)]*\)/g, ' ').replace(/[^a-zа-я0-9]+/g, ' ').trim();
// Название «упомянуто» в тексте, если в нём есть основы всех значимых слов: «гиперэкстензия» ~ «гиперэкстензию».
function mentions(text, name) {
  const words = nameKey(name).split(' ').filter(w => w.length >= 3);
  const t = nameKey(text);
  return words.length > 0 && words.every(w => t.includes(w.length <= 5 ? w.slice(0, -1) : w.slice(0, -2)));
}
function planIssues(plan) {
  const flat = flatExercises(plan);
  const work = flat.filter(f => !f.stage);
  const issues = [];
  if (!work.length) issues.push('В плане нет ни одного упражнения, кроме разминки и заминки.');
  const byName = {};
  work.forEach(f => { const k = nameKey(f.ex.name); if (k) (byName[k] = byName[k] || []).push(f); });
  Object.values(byName).filter(l => l.length > 1)
    .forEach(l => issues.push(`«${l[0].ex.name}» в плане ${l.length} раза: ${l.map(f => `№${f.tag}`).join(', ')}.`));
  flat.filter(f => f.stage).forEach(st => work.filter(f => mentions(`${st.ex.name || ''} ${st.ex.notes || ''}`, f.ex.name))
    .forEach(f => issues.push(`«${f.ex.name}» (№${f.tag}) уже есть в ${st.ex.kind === 'warmup' ? 'разминке' : 'заминке'} (№${st.tag}).`)));
  const P = profile();
  // «Не предлагать»: пункты через запятую или точку с запятой; совпадение — все значимые слова одного в другом.
  const avoid = String(P.avoid || '').split(/[,;\n]/).map(x => x.trim()).filter(x => nameKey(x));
  work.forEach(f => {
    const hit = avoid.find(a => mentions(f.ex.name, a) || mentions(a, f.ex.name));
    if (hit) issues.push(`«${f.ex.name}» (№${f.tag}) — в списке «Не предлагать» («${hit}»).`);
  });
  planList(plan).filter(isSuperset).forEach(ss => ss.parts.forEach(pt => {
    if (Array.isArray(pt.sets_detail) && pt.sets_detail.length && workSets(pt).length !== (ss.sets || 1))
      issues.push(`В суперсете «${ss.name || pt.name}» у «${pt.name}» ${setsCount(workSets(pt).length)} в sets_detail, а кругов ${ss.sets || 1}.`);
  }));
  // Отдых — только целые или половинные минуты: 75 или 105 сек на экране превращаются в «1.3 мин» и «1.8 мин».
  const odd = (v) => v !== null && v !== undefined && v !== '' && Number(v) % 30 !== 0;
  if (odd(plan.rest_between_exercises_sec)) issues.push(`Отдых между упражнениями ${plan.rest_between_exercises_sec} сек — не целые и не половинные минуты.`);
  work.filter(f => !f.ss).forEach(f => { if (odd(f.ex.rest_sec)) issues.push(`«${f.ex.name}» (№${f.tag}): отдых ${f.ex.rest_sec} сек — не целые и не половинные минуты.`); });
  planList(plan).forEach((ex, i) => { if (odd(ex.rest_after_sec)) issues.push(`№${i + 1}: отдых после упражнения ${ex.rest_after_sec} сек — не целые и не половинные минуты.`); });
  planList(plan).filter(isSuperset).forEach(ss => { if (odd(ss.rest_sec)) issues.push(`Суперсет «${ss.name || ''}»: отдых ${ss.rest_sec} сек между кругами — не целые и не половинные минуты.`); });
  const ssCount = planList(plan).filter(isSuperset).length;
  if (ssCount > P.maxSupersets) issues.push(`Суперсетов ${ssCount}, а лимит в «Обо мне» — ${P.maxSupersets}.`);
  const mins = fmtMin(planItems(plan).total);
  if (mins > P.sessionMinutes + TIME_SLACK_MIN) issues.push(`По расчёту приложения план идёт ~${mins} мин: это больше ориентира ${P.sessionMinutes} мин + ${TIME_SLACK_MIN}.`);
  return issues;
}
// Что в ответе тренера: запись о тренировке, новый план, правки «Обо мне», пожелания без тренировки, замечания проверки.
function parseCoachAnswer(o) {

  const c = o.completed_workout || o.completedWorkout;
  const entry = c ? normalizeLog(c, currentPlan()) : null;
  const upd = o.profile_update || o.profileUpdate || null;
  const plan = o.next_workout || o.nextWorkout || o.workout || o.exercises || (!entry && !upd) ? normalizePlan(o) : null;
  const request = !entry && o.request && o.request.text ? { text: String(o.request.text).trim(), insist: !!o.request.insist } : null;

// Применяет разобранный ответ. inbox — sha файла coach-answer.json, если ответ пришёл из GitHub.
// Возвращает текст для уведомления и вкладку, на которую перейти.
function applyCoachAnswer({ entry, upd, plan, request, issues }, inbox = '') {
  if (issues.length) plan.warnings = [...plan.warnings, ...issues.map(x => `Проверка приложения: ${x}`)];
  const undo = { at: new Date().toISOString(), state: JSON.stringify(state), report: ui.report || '',
    what: [entry && 'тренировка', plan && 'план', upd && 'данные «Обо мне»'].filter(Boolean).join(', ') + (inbox ? ' (из GitHub)' : '') };
  if (entry || plan) ui.report = '';
  if (entry) state.history.push(entry);
  saveUi();
  safeSet(UNDO_KEY, JSON.stringify(undo));
  const changes = applyProfileUpdate(upd, 'coach');
  if (inbox) {
    // Метка источника: по ней исправленный ответ из того же чата («correction») заменяет этот.
    if (entry) entry.inbox = inbox;
    if (plan) plan.inbox = inbox;
    if (changes.length) state.profileLog.slice(-changes.length).forEach(x => { x.inbox = inbox; });
    state.coachInbox = { sha: inbox, at: new Date().toISOString(), changes: changes.map(({ field, from, to }) => ({ field, from, to })) };
  }
  const updMsg = changes.length ? `, данные «Обо мне» обновлены (${changes.length})` : '';
  if (!plan) {
    save();
    return { msg: (entry ? 'Тренировка записана в историю' : changes.length ? 'Данные «Обо мне» обновлены' : 'Тренер ничего не изменил') + (entry ? updMsg : ''),
      tab: entry ? 'history' : 'settings' };
  }
  if (changes.length) plan.profile_changes = changes;
  // Пожелания без описания тренировки Claude возвращает отдельно в request.
  if (request) {
    plan.request = request;
    state.requests = [...(state.requests || []), { date: todayIso(), ...request, ...(inbox ? { inbox } : {}) }];
  }
  state.plans.push(plan); save();
  if (draft && !draft.id) { draft = null; saveDraft(); }
  return { msg: (entry ? 'Тренировка записана, новый план загружен' : 'План загружен') + updMsg,
    tab: entry && entry.assumptions.length ? 'history' : 'today' };
}

/* =====================================================================
   Ответ тренера из отдельного проекта Claude: тренер коммитит финальный JSON в coach-answer.json
   репозитория бэкапа, приложение при открытии загружает его так же, как вставленный на шаге 3.

// Убирает из данных всё, что внёс прошлый ответ из GitHub. false — убрать нельзя: по его плану уже есть тренировка.
function rollbackInbox(prev) {
  const sha = prev.sha;
  const plan = state.plans.find(p => p.inbox === sha);
  if (plan && state.history.some(h => h.planId === plan.id)) return false;
  state.history = state.history.filter(h => h.inbox !== sha);
  state.plans = state.plans.filter(p => p.inbox !== sha);
  state.requests = (state.requests || []).filter(r => r.inbox !== sha);
  state.profileLog = (state.profileLog || []).filter(x => x.inbox !== sha);
  const edits = { ...(state.profileEdits || {}) };
  for (const c of prev.changes || []) {
    if (profile()[c.field] !== c.to) continue; // поле уже поменяли после этого ответа
    if (c.from === PROFILE[c.field]) delete edits[c.field]; else edits[c.field] = c.from;
  }
  state.profileEdits = edits;
  return true;
}
// Загружает coach-answer.json ({ sha, text }). Ошибки проверки плана не блокируют: они попадут в «⚠ Важно».
function applyInbox(file) {
  const o = extractJson(file.text);
  if (!o) throw new Error(`в ${GH_INBOX_PATH} нет корректного JSON`);
  const before = JSON.stringify(state);
  try {
    const prev = state.coachInbox;
    let note = '';
    if (o.correction && prev && prev.sha) note = rollbackInbox(prev) ? ' (исправление заменило прошлый ответ)' : '. Прошлый ответ уже не заменить — проверьте «Историю» на дубли';
    const r = applyCoachAnswer(parseCoachAnswer(o), file.sha);
    return { ...r, msg: `Тренер прислал ответ через GitHub: ${r.msg[0].toLowerCase()}${r.msg.slice(1)}${note}` };
  } catch (e) {
    state = JSON.parse(before); safeSet(STORE_KEY, before);
    throw e;
  }
}

    let y = PAD;
    const inner = W - PAD * 2;
    const text = (str, size, weight, color, x, maxW, lh = 1.35) => {
      const lines = wrap(str, size, weight, maxW);
      if (draw) { ctx.font = font(size, weight); ctx.fillStyle = color; ctx.textBaseline = 'top'; lines.forEach((l, i) => ctx.fillText(l, x, y + i * size * lh)); }
      y += lines.length * size * lh;
    };
    // Заголовок
    text(plan.title || 'Тренировка', 54, 700, C.text, PAD, inner, 1.2);
    y += 8;
    const meta = [plan.date ? fmtDate(plan.date) : '', `~${fmtMin(timeline.total)} мин`,
      plan.rest_between_exercises_sec ? `${fmtRest(plan.rest_between_exercises_sec)} между упражнениями` : ''].filter(Boolean).join('  ·  ');
    if (meta) text(meta, 28, 500, C.accent, PAD, inner);
    if (plan.focus) { y += 4; text(plan.focus, 26, 400, C.text2, PAD, inner); }
    y += 28;
    // Блоки-подсказки
    const callout = (title, body, soft, line) => {
      const pad = 24, w = inner - pad * 2 - 8;
      const h = pad * 2 + 30 + wrap(body, 27, 400, w).length * 27 * 1.4;
      if (draw) { roundRect(PAD, y, inner, h, 18, soft); ctx.fillStyle = line; ctx.fillRect(PAD, y + 12, 6, h - 24); }
      const y0 = y; y += pad;
      text(title.toUpperCase(), 20, 700, C.text2, PAD + pad + 8, w);
      y += 6;
      text(body, 27, 400, C.text, PAD + pad + 8, w, 1.4);
      y = y0 + h + 18;
    };
    if (plan.recommendation) callout('Рекомендация', plan.recommendation, C.accentSoft, C.accent);
    if (plan.warnings && plan.warnings.length) callout('⚠ Важно', plan.warnings.map(w => `• ${w}`).join('\n'), C.warnSoft, C.warn);
    // «Перо»: рисует (d=true) или только меряет (d=false) блоки, начиная с высоты startY.
    const pen = (d, startY) => {
      const P = { y: startY };
      P.T = (str, size, weight, color, tx, maxW, lh = 1.35) => {
        const lines = wrap(str, size, weight, maxW);
        if (d) { ctx.font = font(size, weight); ctx.fillStyle = color; ctx.textBaseline = 'top'; lines.forEach((l, k) => ctx.fillText(l, tx, P.y + k * size * lh)); }
        P.y += lines.length * size * lh;
      };
      P.badge = (change, right) => {
        if (!change) return 0;
        ctx.font = font(22, 600); const bw = ctx.measureText(change).width + 32;
        if (d) { const [bg, fg] = badgeColors(change); roundRect(right - bw, P.y, bw, 38, 19, bg); ctx.font = font(22, 600); ctx.fillStyle = fg; ctx.textBaseline = 'middle'; ctx.fillText(change, right - bw + 16, P.y + 20); }
        return bw;
      };
      P.scheme = (e, tx, maxW, withRest = true) => {
        const warm = warmupLine(e), wr = withRest ? workRest(e) : 0;
        const head = (label, sec) => {
          if (d) {
            ctx.textBaseline = 'top'; ctx.font = font(19, 700); ctx.fillStyle = C.muted; ctx.fillText(label, tx, P.y + 3);
            if (sec) { const lw = ctx.measureText(label).width; ctx.font = font(22, 500); ctx.fillStyle = C.text2; ctx.fillText(` · отдых ${fmtRest(sec)}`, tx + lw, P.y); }
          }
          P.y += 32;
        };
        const wc = workCount(e), cnt = (n) => n ? ` · ${setsCount(n).toUpperCase()}` : '';
        if (warm) { head('РАЗМИНКА' + cnt(warmupSets(e).length), WARMUP_SET_REST); P.T(warm, 25, 500, C.text2, tx, maxW); P.y += 8; }
        if (warm || wr || wc) head('РАБОЧИЕ' + cnt(wc), wr);
        groupSets(workSets(e)).forEach((g, gi) => {
          const big = gi === 0;
          const main = `${big ? '' : '+ '}${g.n} × ${g.reps}`, unit = ` ${unitLabel(e.unit)} · `, wt = fmtW(g.weight);
          if (d) {
            ctx.textBaseline = 'top'; let cx = tx;
            ctx.font = font(big ? 40 : 28, 700); ctx.fillStyle = C.text; ctx.fillText(main, cx, P.y); cx += ctx.measureText(main).width;
            ctx.font = font(big ? 25 : 22, 500); ctx.fillStyle = C.text2; ctx.fillText(unit, cx, P.y + (big ? 11 : 4)); cx += ctx.measureText(unit).width;
            ctx.font = font(big ? 40 : 28, 700); ctx.fillStyle = C.text; ctx.fillText(wt, cx, P.y);
          }
          P.y += big ? 48 : 36;
        });
      };
      // Плашка «Отдых N мин» после последнего подхода/круга.
      P.rest = (it, tx, maxW) => {
        const sec = restAfter(it);
        if (!sec) return;
        P.y += 12;
        if (d) {
          roundRect(tx, P.y, maxW, 48, 12, '#efefec');
          ctx.textBaseline = 'middle'; ctx.font = font(24, 500); ctx.fillStyle = C.text2; const lbl = '⏸ Отдых ';
          ctx.fillText(lbl, tx + 16, P.y + 25); const lw = ctx.measureText(lbl).width;
          ctx.font = font(24, 700); ctx.fillStyle = C.text; ctx.fillText(fmtRest(sec), tx + 16 + lw, P.y + 25);
        }
        P.y += 48;
      };
      // Плашка «Прошлый раз» под схемой подходов, как на экране: заголовок, подходы и заметка.
      P.last = (name, tx, maxW, bg = '#efefec') => {
        const last = lastTime(name, plan);
        if (!last) return;
        const pad = 16, iw = maxW - pad * 2, head = `↩ ПРОШЛЫЙ РАЗ, ${shortDate(last.date).toUpperCase()}`, body = lastLine(last), note = last.ex.notes || '';
        const noteAll = note ? wrap(note, 21, 400, iw) : [], noteLines = noteAll.slice(0, 2), more = noteAll.length > 2;
        const h = pad * 2 + 19 * 1.35 + 6 + wrap(body, 24, 600, iw).length * 24 * 1.35 + (noteLines.length ? 6 + noteLines.length * 21 * 1.35 : 0);
        P.y += 12;
        const y0 = P.y;
        if (d) roundRect(tx, y0, maxW, h, 12, bg);
        P.y += pad;
        P.T(head, 19, 700, C.muted, tx + pad, iw); P.y += 6;
        P.T(body, 24, 600, C.text, tx + pad, iw);
        if (noteLines.length) {
          P.y += 6;
          // Заметка — не больше двух строк, как на экране.
          if (d) { ctx.font = font(21, 400); ctx.fillStyle = C.text2; ctx.textBaseline = 'top'; }
          noteLines.forEach((l, k) => { if (d) ctx.fillText(more && k === noteLines.length - 1 ? `${l}…` : l, tx + pad, P.y + k * 21 * 1.35); });
          P.y += noteLines.length * 21 * 1.35;
        }
        P.y = y0 + h + 4;
      };
      P.meta = (str, tx) => {
        if (!str) return;
        if (d) { ctx.font = font(23, 500); ctx.fillStyle = C.muted; ctx.textBaseline = 'top'; ctx.fillText(str, tx, P.y + 2); }
        P.y += 34;
      };
      return P;
    };
    // Упражнения
    timeline.items.forEach((it) => {
      const ex = it.ex;
      const pad = 28, x = PAD + pad + 70, w = inner - pad * 2 - 70, right = PAD + inner - pad;
      const y0 = y;
      const when = `⏱ ${fmtMin(it.start)}–${fmtMin(it.end)} мин`;
      const card = (d) => {
        const P = pen(d, y0 + pad);
        if (isStage(ex)) {
          P.T(`${ex.kind === 'warmup' ? '🔥' : '🧘'} ${stageName(ex)} · ${num(ex.duration_min) || 5} мин`, 34, 700, C.text, x, w, 1.25); P.y += 4;
          P.T(when, 23, 600, C.accent, x, w); P.y += 6;
          if (ex.notes) P.T(ex.notes, 24, 400, C.text2, x, w, 1.4);
          return P.y + pad;
        }
        if (!isSuperset(ex)) {
          const bw = P.badge(ex.change, right);
          P.T(ex.name, 34, 700, C.text, x, w - bw - 12, 1.25); P.y += 4;
          P.T(when + (ex.rpe ? `  ·  RPE ${fmtRpe(ex.rpe)}` : ''), 23, 600, C.accent, x, w); P.y += 8;
          P.scheme(ex, x, w);
          P.last(ex.name, x, w);
          if (ex.notes) { P.y += 8; P.T(ex.notes, 24, 400, C.text2, x, w, 1.4); }
          P.rest(it, x, w);
          return P.y + pad;
        }
        const bw = P.badge(ex.change, right);
        P.T(`Суперсет${ex.name ? `: ${ex.name}` : ''}`, 34, 700, C.text, x, w - bw - 12, 1.25); P.y += 4;
        P.T(when, 23, 600, C.accent, x, w); P.y += 4;
        P.T(`↻ ${supersetHead(ex)}`, 23, 600, C.accent, x, w); P.y += 10;
        ex.parts.forEach((part, j) => {
          if (j) { P.y += 4; P.T('↓ сразу, без отдыха', 22, 600, C.accent, x + 14, w); P.y += 4; }
          const px = x + 66, pw = w - 66 - 18;
          const partBox = (dd, sy) => {
            const Q = pen(dd, sy + 18);
            const pbw = Q.badge(part.change, x + w - 18);
            Q.T(part.name, 29, 700, C.text, px, pw - pbw - 10, 1.25); Q.y += 6;
            Q.scheme({ ...part, sets: ex.sets }, px, pw, false);
            Q.last(part.name, px, pw, C.card);
            Q.meta(part.rpe ? `RPE ${fmtRpe(part.rpe)}` : '', px);
            if (part.notes) { Q.y += 4; Q.T(part.notes, 23, 400, C.text2, px, pw, 1.4); }
            return Q.y + 18;
          };
          const sy = P.y, end = partBox(false, sy);
          if (d) {
            roundRect(x, sy, w, end - sy, 14, '#efefec');
            ctx.fillStyle = C.accent; ctx.fillRect(x, sy + 10, 6, end - sy - 20);
            roundRect(x + 18, sy + 18, 34, 34, 8, C.accent);
            ctx.font = font(22, 700); ctx.fillStyle = '#ffffff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText(SS_LABELS[j], x + 35, sy + 36); ctx.textAlign = 'left';
            partBox(true, sy);
          }
          P.y = end;
        });
        if (ex.notes) { P.y += 8; P.T(ex.notes, 24, 400, C.text2, x, w, 1.4); }
        P.rest(it, x, w);
        return P.y + pad;
      };
      const h = card(false) - y0;
      if (draw) {
        roundRect(PAD, y0, inner, h, 20, C.card, C.border);
        ctx.beginPath(); ctx.arc(PAD + pad + 26, y0 + pad + 24, 26, 0, Math.PI * 2); ctx.fillStyle = C.accentSoft; ctx.fill();
        ctx.font = font(26, 700); ctx.fillStyle = C.accent; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(String(it.num), PAD + pad + 26, y0 + pad + 25); ctx.textAlign = 'left';
        card(true);
      }
      y = y0 + h + 16;
    });
    y += 6;
    if (plan.notes) callout('Заметки', plan.notes, '#efefec', C.muted);
    text(`Дневник тренировок · ${todayIso()}`, 20, 400, C.muted, PAD, inner);
    return y + PAD;
  };

  canvas.width = W; canvas.height = 100;
  const H = Math.ceil(layout(false));
  canvas.width = W * SCALE; canvas.height = H * SCALE;
  ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);
  layout(true);
  return new Promise(res => canvas.toBlob(res, 'image/png'));
}

/* =====================================================================
   Обработчики событий (делегирование)
   ===================================================================== */
document.addEventListener('click', async (e) => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act;
  const i = b.dataset.ex !== undefined ? +b.dataset.ex : null;
  const j = b.dataset.set !== undefined ? +b.dataset.set : null;
  switch (act) {
    case 'goto': setTab(b.dataset.tab); break;
    case 'set-status':
      draft.status = b.dataset.status;
      if (draft.status === 'done' && !draft.exercises.length) {
        const fresh = newDraftFromPlan('done'); draft.exercises = fresh.exercises;
      }
      saveDraft(); render(); break;
    case 'scale': { const v = +b.dataset.v; draft[b.dataset.f] = draft[b.dataset.f] === v ? null : v; saveDraft(); render(); break; }
    case 'add-ex': draft.exercises.push({ name: '', unit: 'reps', planned: null, sets: [{ reps: null, weight: 0, done: true }], notes: '' }); saveDraft(); render(); break;
    case 'del-ex': draft.exercises.splice(i, 1); saveDraft(); render(); break;
    case 'add-set': { const s = draft.exercises[i].sets; const last = s[s.length - 1] || { reps: null, weight: 0 }; s.push({ reps: last.reps, weight: last.weight, done: true, warmup: false }); saveDraft(); render(); break; }
    case 'del-set': draft.exercises[i].sets.splice(j, 1); if (!draft.exercises[i].sets.length) draft.exercises.splice(i, 1); saveDraft(); render(); break;
    case 'save-log': saveLog(); break;
    case 'reset-draft':
      draft = null; saveDraft(); setTab('history'); break;
    case 'edit-entry': {
      const h = state.history.find(x => x.id === b.dataset.id); if (!h) break;
      draft = JSON.parse(JSON.stringify({ exercises: [], wellbeing: null, effort: null, duration: '', sleep: '', bodyweight: '', notes: '', extras: '', wishes: '', insist: false, reason: '', ...h }));
      saveDraft(); setTab('log'); break;
    }
    case 'del-entry':
      if (confirm('Удалить запись?')) { state.history = state.history.filter(x => x.id !== b.dataset.id); save(); render(); }
      break;
    case 'copy-prompt': toast(await copyText(buildPrompt(ui.promptCount)) ? 'Промпт тренера скопирован — вставьте его в чат Claude' : 'Не удалось скопировать — выделите текст вручную'); break;
    case 'dl-prompt': download(`workout-prompt-${todayIso()}.md`, buildPrompt(ui.promptCount), 'text/markdown'); break;
    case 'import-plan': importPlan(); break;
    case 'undo-import': undoImport(); break;
    case 'cancel-insist': {
      if (b.dataset.kind === 'entry') {
        const [id, i] = b.dataset.id.split(':');
        const h = state.history.find(x => x.id === id);
        if (h && Array.isArray(h.wishList) && h.wishList[+i]) { h.wishList[+i].insist = false; h.insist = h.wishList.some(w => w.insist); }
        else if (h) h.insist = false;
      }
      else { const r = (state.requests || [])[+b.dataset.id]; if (r) r.insist = false; }
      save(); toast('Требование отменено'); render(); break;
    }
    case 'edit-profile': {
      const f = b.dataset.field, cur = profile()[f];
      const v = prompt(`${PROFILE_LABELS[f]}:`, cur ?? '');
      if (v === null) break;
      const done = applyProfileUpdate({ [PROFILE_NUMBERS[f] ? PROFILE_NUMBERS[f][0] : f]: v }, 'me', '');
      if (done.length) { save(); toast('Сохранено'); render(); }
      break;
    }
    case 'reset-profile': {
      const f = b.dataset.field;
      if (!confirm(`Вернуть исходное значение поля «${PROFILE_LABELS[f]}»?`)) break;
      const from = profile()[f];
      const { [f]: _, ...rest } = state.profileEdits || {};
      state.profileEdits = rest;
      state.profileLog = [...(state.profileLog || []), { field: f, from, to: PROFILE[f], at: new Date().toISOString(), date: todayIso(), by: 'me', reason: 'возврат к исходному' }];
      save(); toast('Возвращено исходное значение'); render(); break;
    }
    case 'show-plan': shown = { id: b.dataset.id, current: currentPlan()?.id }; render(); break;
    case 'plan-png': {
      const blob = await planImageBlob(shownPlan());
      download(planFileName('png'), blob); toast('Картинка сохранена'); break;
    }
    case 'plan-pdf': {
      const prevTitle = document.title; document.title = planFileName('').replace(/\.$/, '');
      window.print(); document.title = prevTitle; break;
    }
    case 'plan-text': toast(await copyText(planAsText(shownPlan())) ? 'План скопирован текстом' : 'Не удалось скопировать'); break;
    case 'plan-share': {
      const blob = await planImageBlob(shownPlan());
      const file = new File([blob], planFileName('png'), { type: 'image/png' });
      try { await navigator.share({ files: [file], title: shownPlan().title, text: planAsText(shownPlan()) }); } catch (err) {}
      break;
    }
    case 'export-json': download(`workout-backup-${todayIso()}.json`, JSON.stringify(state, null, 2), 'application/json'); break;
    case 'import-json': $('#fileInput').click(); break;
    case 'gh-connect': b.disabled = true; await ghConnect(); break;
    case 'gh-push': b.disabled = true; toast(await ghPush(true) ? 'Бэкап отправлен в GitHub' : gh.lastError); break;
    case 'gh-restore': await ghRestore(); break;
    case 'gh-sync': b.disabled = true; await ghSync(); if (!gh.lastError) toast('Проверил GitHub'); break;
    case 'gh-off':
      if (confirm('Отключить автобэкап в GitHub? Токен удалится из этого браузера, файл в репозитории останется.')) {
        gh = { repo: gh.repo, token: '', path: gh.path, sha: '', pushedHash: '', promptSha: '', promptHash: '', inboxFailed: '', dirty: false, lastOk: '', lastError: '' }; saveGh(); render();
      }
      break;
    case 'load-seed':
      if (state.history.length && !confirm('Стартовые данные заменят текущие. Продолжить? (Сначала можно скачать бэкап.)')) break;
      state = { ...buildSeed(), profileEdits: state.profileEdits || {}, profileLog: state.profileLog || [] }; save(); safeDel(UNDO_KEY); draft = null; saveDraft(); toast('Стартовые данные загружены'); setTab('today'); break;
    case 'wipe':
      if (confirm('Удалить все тренировки, планы и профиль? Это нельзя отменить.')) { state = emptyState(); save(); safeDel(UNDO_KEY); draft = null; saveDraft(); setTab('today'); }
      break;
  }
});

document.addEventListener('input', (e) => {
  const el = e.target;
  if (el.id === 'reportText') {
    ui.report = el.value; saveUi();
    const pr = buildPrompt(ui.promptCount);
    $('#promptText').textContent = pr; $('#promptSize').textContent = `~${Math.round(pr.length / 100) / 10}k символов`;
    return;
  }
  if (!draft || ui.tab !== 'log') return;
  if (el.dataset.f) { draft[el.dataset.f] = el.type === 'checkbox' ? el.checked : el.value; saveDraft(); return; }
  if (el.dataset.ex !== undefined) {
    const ex = draft.exercises[+el.dataset.ex]; if (!ex) return;
    const k = el.dataset.k;
    if (el.dataset.set !== undefined) {
      const s = ex.sets[+el.dataset.set];
      s[k] = (k === 'done' || k === 'warmup') ? el.checked : (el.value === '' ? null : num(el.value));
    } else ex[k] = el.value;
    saveDraft();
  }
});
document.addEventListener('change', (e) => {
  const el = e.target;
  if (el.id === 'promptCount') { ui.promptCount = +el.value; saveUi(); render(); }
  if (ui.tab === 'log' && (el.dataset.k === 'unit' || el.dataset.k === 'warmup')) render();
});

$('#fileInput').addEventListener('change', async (e) => {
  const file = e.target.files[0]; e.target.value = '';
  if (!file) return;
  try {
    const data = JSON.parse(await file.text());
    if (!Array.isArray(data.history) || !Array.isArray(data.plans)) throw new Error();
    if (!confirm(`Восстановить ${data.history.length} записей и ${data.plans.length} планов? Текущие данные будут заменены.`)) return;
    delete data.profile;
    state = { ...emptyState(), ...data };
    save(); safeDel(UNDO_KEY); toast('Данные восстановлены'); render();
  } catch (err) { toast('Файл не похож на бэкап этого приложения'); }
});

let resizeT; window.addEventListener('resize', () => { clearTimeout(resizeT); resizeT = setTimeout(() => { if (ui.tab === 'progress') mountChart(); }, 150); });
// При первом запуске подставляем стартовые данные (текущая программа + первый план).
if (!state) { state = buildSeed(); save(); } else migrateSeedPlan();
render();
// Забираем изменения из GitHub (другое устройство, ответ тренера) и досылаем то, что не ушло (не было сети, закрыли вкладку).
ghSync();
window.addEventListener('online', () => { if (ghOn() && gh.dirty) ghPush(); });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && Date.now() - ghSyncedAt > GH_RESYNC_MS) ghSync(); });
</script>
