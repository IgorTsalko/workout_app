<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Дневник тренировок</title>
<style>
:root {
  color-scheme: light;
  --bg: #f4f4f2;
  --surface: #fcfcfb;
  --surface-2: #efefec;
  --border: #dddcd7;
  --text: #0b0b0b;
  --text-2: #52514e;
  --muted: #8a8984;
  --accent: #2a78d6;
  --accent-ink: #ffffff;
  --accent-soft: #e3eefb;
  --good: #1f7a3a;
  --good-soft: #e2f3e6;
  --warn: #9a6400;
  --warn-soft: #fbf0d9;
  --bad: #c03a39;
  --bad-soft: #fbe5e5;
  --skip: #7a7974;
  --skip-soft: #ececea;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #121211;
    --surface: #1a1a19;
    --surface-2: #242423;
    --border: #34342f;
    --text: #ffffff;
    --text-2: #c3c2b7;
    --muted: #8f8e86;
    --accent: #3987e5;
    --accent-ink: #ffffff;
    --accent-soft: #1d2d42;
    --good: #5cc27a;
    --good-soft: #1b3123;
    --warn: #e0a83a;
    --warn-soft: #3a2f17;
    --bad: #e66767;
    --bad-soft: #3d1f1f;
    --skip: #a3a29a;
    --skip-soft: #2a2a28;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #121211; --surface: #1a1a19; --surface-2: #242423; --border: #34342f;
  --text: #ffffff; --text-2: #c3c2b7; --muted: #8f8e86;
  --accent: #3987e5; --accent-ink: #ffffff; --accent-soft: #1d2d42;
  --good: #5cc27a; --good-soft: #1b3123; --warn: #e0a83a; --warn-soft: #3a2f17;
  --bad: #e66767; --bad-soft: #3d1f1f; --skip: #a3a29a; --skip-soft: #2a2a28;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--text);
  font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
header.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10;
  background: var(--surface); border-bottom: 1px solid var(--border);
}
.top-inner { max-width: 920px; margin: 0 auto; padding: 10px 16px 0; }
.brand { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.brand h1 { font-size: 18px; margin: 0; }
.brand .sub { color: var(--muted); font-size: 13px; }
nav.tabs { display: flex; gap: 2px; overflow-x: auto; margin-top: 8px; scrollbar-width: none; }
nav.tabs button {
  border: 0; background: none; color: var(--text-2); font: inherit;
  padding: 8px 12px; border-bottom: 2px solid transparent; cursor: pointer; white-space: nowrap;
}
nav.tabs button.active { color: var(--text); border-bottom-color: var(--accent); font-weight: 600; }
main { max-width: 920px; margin: 0 auto; padding: 16px; }
h2 { font-size: 20px; margin: 4px 0 12px; }
h3 { font-size: 16px; margin: 0 0 8px; }
.card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 14px 16px; margin-bottom: 12px;
}
.card.soft { background: var(--surface-2); }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.grow { flex: 1; }
.btn {
  border: 1px solid var(--border); background: var(--surface); color: var(--text);
  font: inherit; padding: 8px 14px; border-radius: 8px; cursor: pointer;
}
.btn:hover { border-color: var(--text-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.danger { color: var(--bad); }
.btn.sm { padding: 4px 10px; font-size: 13px; }
.btn.icon { padding: 4px 9px; }
input, textarea, select {
  font: inherit; color: var(--text); background: var(--surface);
  border: 1px solid var(--border); border-radius: 8px; padding: 7px 9px; width: 100%;
}
textarea { min-height: 70px; resize: vertical; }
input:focus, textarea:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
label.f { display: block; font-size: 13px; color: var(--text-2); margin-bottom: 10px; }
label.f > input, label.f > textarea, label.f > select { margin-top: 4px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 0 12px; }
.badge {
  display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 999px;
  background: var(--surface-2); color: var(--text-2); white-space: nowrap;
}
.badge.good { background: var(--good-soft); color: var(--good); }
.badge.warn { background: var(--warn-soft); color: var(--warn); }
.badge.skip { background: var(--skip-soft); color: var(--skip); }
.badge.accent { background: var(--accent-soft); color: var(--accent); }
.badge.bad { background: var(--bad-soft); color: var(--bad); }
.callout.warn { border-color: var(--warn); background: var(--warn-soft); }
.wish { padding: 8px 0; border-top: 1px solid var(--border); }
.wish:first-of-type { border-top: 0; }
.chk-line { display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--text-2); margin: -4px 0 10px; }
.chk-line input { width: 18px; height: 18px; }
.ex-card { display: grid; grid-template-columns: 34px 1fr; gap: 10px; padding: 12px 0; border-top: 1px solid var(--border); }
.ex-card:first-child { border-top: 0; }
.ex-num {
  width: 30px; height: 30px; border-radius: 50%; background: var(--accent-soft); color: var(--accent);
  display: grid; place-items: center; font-weight: 700; font-size: 14px;
}
.ex-name { font-weight: 600; font-size: 16px; flex: 1 1 200px; }
.ex-scheme { font-size: 22px; font-weight: 700; letter-spacing: -0.3px; margin: 2px 0; }
.ex-scheme .unit { font-size: 14px; font-weight: 500; color: var(--text-2); }
.badge.time { background: none; border: 1px solid var(--border); color: var(--text-2); margin-left: 6px; }
.grp { margin-top: 6px; }
.grp-h { font-size: 11.5px; font-weight: 600; letter-spacing: .4px; text-transform: uppercase; color: var(--muted); }
.grp-h .rest { text-transform: none; letter-spacing: 0; font-weight: 500; color: var(--text-2); }
.grp-warm { font-size: 14px; color: var(--text-2); margin-top: 1px; }
.rest-after { margin-top: 8px; padding: 6px 10px; border-radius: 8px; background: var(--surface-2); font-size: 13px; color: var(--text-2); }
.rest-after b { color: var(--text); }
.ss-head { font-size: 13px; color: var(--text-2); margin: 2px 0 4px; }
.ss-part { display: grid; grid-template-columns: 28px 1fr; gap: 8px; background: var(--surface-2); border-left: 3px solid var(--accent); border-radius: 0 8px 8px 0; padding: 8px 10px; margin-top: 6px; }
.ss-label { width: 26px; height: 26px; border-radius: 6px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-weight: 700; font-size: 13px; }
.ss-part .ex-name { font-size: 15px; }
.ss-part .ex-scheme { font-size: 19px; }
.ss-link { font-size: 12.5px; color: var(--accent); padding: 4px 0 0 46px; }
.ss-tag { display: inline-block; font-size: 12px; font-weight: 600; color: var(--accent); margin-bottom: 4px; }
.set-dots { display: flex; gap: 4px; margin: 4px 0; }
.set-dots span { width: 22px; height: 6px; border-radius: 3px; background: var(--accent); opacity: .85; }
.callout { border-left: 3px solid var(--accent); padding: 8px 12px; background: var(--accent-soft); border-radius: 0 8px 8px 0; margin-bottom: 10px; }
.callout.good { border-color: var(--good); background: var(--good-soft); }
.callout h4 { margin: 0 0 4px; font-size: 13px; text-transform: uppercase; letter-spacing: .4px; color: var(--text-2); }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; flex-wrap: wrap; }
.seg button { border: 0; background: var(--surface); color: var(--text-2); font: inherit; padding: 8px 12px; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--border); }
.seg button.on { background: var(--accent); color: var(--accent-ink); }
.sets-table { width: 100%; border-collapse: collapse; margin-top: 6px; }
.sets-table th { font-size: 12px; font-weight: 500; color: var(--muted); text-align: left; padding: 2px 4px; }
.sets-table td { padding: 3px 4px; }
.sets-table td:first-child { width: 28px; color: var(--muted); font-size: 13px; }
.sets-table input { padding: 5px 7px; }
.sets-table td.chk { width: 32px; text-align: center; }
.sets-table input[type=checkbox] { width: 18px; height: 18px; }
.log-ex { border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; margin-bottom: 10px; background: var(--surface); }
.scale { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 4px; }
.scale button {
  min-width: 36px; padding: 6px 8px; border: 1px solid var(--border); background: var(--surface);
  border-radius: 6px; cursor: pointer; color: var(--text-2); font: inherit;
}
.scale button.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.hist-item { display: flex; gap: 12px; align-items: flex-start; }
.hist-date { min-width: 64px; text-align: center; }
.hist-date .d { font-size: 22px; font-weight: 700; line-height: 1; }
.hist-date .m { font-size: 12px; color: var(--muted); }
details summary { cursor: pointer; color: var(--text-2); font-size: 13px; }
pre.prompt {
  white-space: pre-wrap; word-break: break-word; background: var(--surface-2); border: 1px solid var(--border);
  border-radius: 8px; padding: 12px; max-height: 360px; overflow: auto; font-size: 12.5px;
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
.toast {
  position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%);
  background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 8px;
  font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 50; max-width: calc(100% - 32px);
}
.toast.show { opacity: 1; }
/* Тренер: чат слева, черновик плана и проверки справа; на телефоне — друг под другом */
.coach { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 14px; align-items: start; }
.coach-main { min-width: 0; display: flex; flex-direction: column; gap: 10px; }
.coach-panel { min-width: 0; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 96px); max-height: calc(100vh - 110px); overflow: auto; }
.chat-log { display: flex; flex-direction: column; gap: 10px; }
.chat-empty { background: var(--surface); border: 1px dashed var(--border); border-radius: var(--radius); padding: 14px 16px; }
.chat-empty p { margin: 0 0 8px; }
.msg { display: flex; flex-direction: column; gap: 4px; max-width: 100%; }
.msg .bubble { padding: 9px 12px; border-radius: 12px; white-space: pre-wrap; overflow-wrap: anywhere; }
.msg.user { flex-direction: row; justify-content: flex-end; align-items: flex-start; gap: 6px; }
.msg.user .bubble { background: var(--accent-soft); color: var(--text); border-bottom-right-radius: 4px; max-width: 88%; }
.msg.coach-msg .bubble { background: var(--surface); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
.msg.app { align-self: center; font-size: 12.5px; color: var(--text-2); background: var(--surface-2); padding: 5px 10px; border-radius: 8px; white-space: pre-wrap; text-align: center; }
.msg.app.auto { text-align: left; align-self: stretch; }
.msg.app.auto summary { cursor: pointer; }
.mini-link { color: var(--text-2); }
.msg.app.bad { color: var(--bad); background: var(--bad-soft); }
.msg .flag { border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 15px; padding: 6px 2px; }
.msg .flag:hover, .msg .flag:focus-visible { color: var(--warn); }
.notes { margin: 0; padding: 6px 10px 6px 26px; font-size: 12.5px; color: var(--text-2); background: var(--surface-2); border-radius: 8px; font-variant-numeric: tabular-nums; }
.notes li { margin: 1px 0; overflow-wrap: anywhere; }
.composer { position: sticky; bottom: env(safe-area-inset-bottom, 0px); background: var(--bg); padding-block: 6px; display: flex; flex-direction: column; gap: 6px; }
.composer textarea { min-height: 84px; }
.chk { font-size: 13px; padding: 3px 0; }
.chk.bad { color: var(--bad); } .chk.warn { color: var(--warn); } .chk.good { color: var(--good); }
table.bal td, table.bal th { font-variant-numeric: tabular-nums; }
table.bal tr.low td { color: var(--bad); }
table.bal tr.skip td { color: var(--muted); }
table.bal tr.tradeoff td:first-child { color: var(--warn); }
.btn:disabled { opacity: .5; cursor: default; }
.btn:focus-visible, .flag:focus-visible, nav.tabs button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (max-width: 820px) {
  .coach { grid-template-columns: minmax(0, 1fr); }
  .coach-panel { position: static; max-height: none; overflow: visible; }
}
.modal { position: fixed; inset: 0; z-index: 60; background: color-mix(in srgb, var(--text) 35%, transparent); display: grid; place-items: center; padding: 16px; }
.modal-box { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; width: min(520px, 100%); max-height: 90vh; overflow: auto; }
.modal-msg { white-space: pre-wrap; }
.empty { text-align: center; padding: 30px 16px; }
.empty p { color: var(--text-2); }
/* attendance */
.att { display: grid; grid-template-columns: 70px repeat(7, 1fr); gap: 4px; font-size: 12px; align-items: center; }
.att .h { color: var(--muted); text-align: center; }
.att .wk { color: var(--muted); }
.att .c {
  height: 30px; border-radius: 6px; background: var(--surface-2); display: grid; place-items: center;
  font-weight: 700; font-size: 13px; color: transparent;
}
.att .c.done { background: var(--good-soft); color: var(--good); }
.att .c.skipped { background: var(--skip-soft); color: var(--skip); }
.att .c.sick { background: var(--warn-soft); color: var(--warn); }
.att .c.today { outline: 2px solid var(--accent); outline-offset: -2px; }
.att .c.future { opacity: .4; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--text-2); margin-top: 10px; }
.legend i { display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: 4px; font-style: normal; font-weight: 700; font-size: 11px; margin-right: 5px; vertical-align: -3px; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 12px; }
.stat { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 14px; }
.stat .v { font-size: 24px; font-weight: 700; }
.stat .l { font-size: 12px; color: var(--muted); }
/* chart */
.chart-wrap { position: relative; }
.chart-wrap svg { width: 100%; height: auto; display: block; }
.chart-wrap .grid line { stroke: var(--border); stroke-width: 1; }
.chart-wrap .axis text { fill: var(--muted); font-size: 11px; }
.chart-wrap .line { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.chart-wrap .pt { fill: var(--accent); stroke: var(--surface); stroke-width: 2; }
.chart-wrap .cross { stroke: var(--text-2); stroke-width: 1; stroke-dasharray: 3 3; }
.tip {
  position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--border);
  border-radius: 8px; padding: 6px 10px; font-size: 12.5px; box-shadow: 0 4px 14px rgba(0,0,0,.12);
  white-space: nowrap; display: none; z-index: 5;
}
table.data { width: 100%; border-collapse: collapse; font-size: 13px; }
table.data th, table.data td { text-align: left; padding: 5px 6px; border-bottom: 1px solid var(--border); }
table.data th { color: var(--muted); font-weight: 500; }
@media print {
  :root { color-scheme: light; --bg: #fff; --surface: #fff; --surface-2: #f4f4f2; --text: #000; --text-2: #333; --muted: #666; --border: #ccc; }
  header.top, .no-print, .toast { display: none !important; }
  body { background: #fff; font-size: 12.5px; }
  main { max-width: none; padding: 0; }
  .card { border-color: #ccc; padding: 10px 12px; margin-bottom: 8px; }
  .card.soft, .callout { break-inside: avoid; }
  .ex-card { break-inside: avoid; padding: 8px 0; }
  .ex-scheme { font-size: 18px; }
  .callout { background: none !important; }
  .badge { border: 1px solid #ccc; background: none !important; }
}
@media (max-width: 560px) {
  .ex-scheme { font-size: 19px; }
  .hist-date { min-width: 48px; }
  .att { grid-template-columns: 52px repeat(7, 1fr); }
}
</style>
</head>
<body>
<header class="top">
  <div class="top-inner">
    <div class="brand">
      <h1>Дневник тренировок</h1>
      <span class="sub" id="brandSub"></span>
    </div>
    <nav class="tabs" id="tabs">
      <button data-tab="today">Сегодня</button>
      <button data-tab="history">История</button>
      <button data-tab="progress">Прогресс</button>
      <button data-tab="claude">Тренер</button>
      <button data-tab="settings">Данные</button>
    </nav>
  </div>
</header>
<main id="app"></main>
<div class="toast" id="toast"></div>
<input type="file" id="fileInput" accept=".json,application/json" hidden>

<script>
'use strict';
/* =====================================================================
   Хранилище: localStorage (ключ STORE_KEY) + ручной бэкап в JSON-файл + автобэкап в GitHub (GH_KEY).
   ===================================================================== */
const STORE_KEY = 'workoutApp.v1';
const DRAFT_KEY = 'workoutApp.draft.v1';
const UI_KEY = 'workoutApp.ui.v1';
const UNDO_KEY = 'workoutApp.undo.v1';   // снимок данных до последней загрузки ответа тренера
const GH_KEY = 'workoutApp.github.v1';   // настройки автобэкапа в GitHub (токен хранится только здесь, в бэкап не попадает)

// Базовый профиль (приложение однопользовательское — меняется прямо здесь).
// Поля из PROFILE_FIELDS тренер (Claude) может обновлять через profile_update в ответе, а я — вручную на вкладке «Данные».
const PROFILE = {
  sex: 'мужчина',
  birthDate: '1994-01-04',
  height: 179,
  startWeight: 76,
  daysPerWeek: 2,
  sessionMinutes: 70,
  goal: 'Набор мышечной массы и рост силы равномерно по всему телу. Акценты на отдельные мышцы (например, трапецию) — только по моим пожеланиям к конкретной тренировке, а не главная цель.',
  experience: 'Не новичок: есть опыт тренировок, после перерыва вернулся и занимаюсь около полугода, 2 раза в неделю.',
  schedule: '2 тренировки в неделю, обычно вторник и пятница (изредка дни сдвигаются). Возможно, позже перейду на 3 тренировки в неделю.',
  duration: 'Около 70 мин вместе с разминкой и заминкой. По расчёту приложения план не дольше ориентира больше чем на 5 минут.',
  maxSupersets: 2,
  rest: 'Сколько отдыхать, не знаю — отдых между подходами и упражнениями подбирает тренер под каждое упражнение.',
  equipment: 'Тренажёрный зал: штанга, гантели, турник, брусья, блочные тренажёры, гак-машина.',
  limitations: 'Боли в пояснице. Пока отказ от приседаний и становой тяги.',
  recommendations: '',
  avoid: 'Икры (достаточно развиты), тяга каната к лицу, разведения гантелей лёжа, сгибания ног лёжа; в разминке — эллипс и упражнения на полу («кошка-корова»).',
  likes: ''
};
// Что тренер может менять. Длительность в минутах (session_minutes) и лимит суперсетов (max_supersets) — отдельные числа:
// по ним приложение проверяет план при загрузке.
const PROFILE_FIELDS = [
  ['goal', 'Цель'], ['experience', 'Опыт'], ['schedule', 'Расписание'], ['duration', 'Длительность'],
  ['rest', 'Отдых'], ['equipment', 'Оборудование'], ['limitations', 'Ограничения'],
  ['avoid', 'Не предлагать'], ['likes', 'Что нравится'], ['recommendations', 'Рекомендации тренера']
];
const PROFILE_NUMBERS = { sessionMinutes: ['session_minutes', 20, 240], maxSupersets: ['max_supersets', 0, 6] };
const PROFILE_LABELS = { ...Object.fromEntries(PROFILE_FIELDS), sessionMinutes: 'Ориентир по времени, мин', maxSupersets: 'Лимит суперсетов' };
// Допуск по времени: план дольше ориентира больше чем на столько минут — ошибка плана.
const TIME_SLACK_MIN = 5;

function emptyState() {
  return { version: 2, plans: [], history: [], requests: [], profileEdits: {}, profileLog: [], rules: [], muscleMap: {}, coach: null };
}

function safeGet(key) { try { return localStorage.getItem(key); } catch (e) { return null; } }
function safeSet(key, val) {
  try { localStorage.setItem(key, val); return true; }
  catch (e) { toast('Не удалось сохранить в localStorage — сделайте бэкап в файл'); return false; }
}
function safeDel(key) { try { localStorage.removeItem(key); } catch (e) {} }

function loadState() {

/* =====================================================================
   Страница на claude.ai: данные в хранилище claude.ai (капабилити db), тренер — через капабилити sample.
   Тот же файл, открытый локально, работает как раньше: localStorage и копирование промпта.
   ===================================================================== */
const IN_CLAUDE = !!(window.claude && typeof window.claude.use === 'function');
const capCache = {};
function capability(name) {
  if (!IN_CLAUDE) return Promise.resolve(null);
  return capCache[name] || (capCache[name] = window.claude.use(name).catch(() => null));
}
// Раскладка по документам: app/meta — профиль, правила, разметка мышц; history/<id>, plans/<id> — по записи на документ;
// coach/session — текущий разговор с тренером. Документ не больше 256 КБ, поэтому историю и планы не складываем в один.
const cloud = { db: null, status: IN_CLAUDE ? 'loading' : 'local', synced: {}, timer: null, busy: false, again: false, error: '' };
function cloudDocs(st) {
  const docs = {
    'app/meta': { version: st.version || 2, requests: st.requests || [], profileEdits: st.profileEdits || {},
      profileLog: (st.profileLog || []).slice(-300), rules: st.rules || [], muscleMap: st.muscleMap || {} }
  };
  for (const h of st.history || []) docs[`history/${h.id}`] = h;
  for (const p of st.plans || []) docs[`plans/${p.id}`] = p;
  if (st.coach) docs['coach/session'] = { ...st.coach, messages: (st.coach.messages || []).slice(-80) };
  return docs;
}
function cloudSchedule() {
  if (cloud.status !== 'ready') return;
  clearTimeout(cloud.timer); cloud.timer = setTimeout(cloudSync, 600);
}
async function cloudSync() {
  if (cloud.status !== 'ready') return;
  if (cloud.busy) { cloud.again = true; return; }
  cloud.busy = true;
  try {
    const docs = cloudDocs(state);
    for (const [path, body] of Object.entries(docs)) {
      const json = JSON.stringify(body);
      if (cloud.synced[path] === json) continue;
      await cloud.db.doc(path).set(JSON.parse(json));
      cloud.synced[path] = json;
    }
    for (const path of Object.keys(cloud.synced)) {
      if (docs[path]) continue;
      await cloud.db.doc(path).delete();
      delete cloud.synced[path];
    }
    cloud.error = '';
  } catch (e) {
    cloud.error = e && e.code === 'quota_exceeded' ? 'Хранилище claude.ai заполнено' : 'Не удалось сохранить на claude.ai';
    toast(`${cloud.error} — данные остались в этом браузере, попробуем при следующем сохранении`);
  } finally {
    cloud.busy = false;
    if (cloud.again) { cloud.again = false; cloudSchedule(); }
  }
}
async function cloudLoad() {
  const db = await capability('db');
  if (!db) { cloud.status = 'off'; return null; }
  cloud.db = db;
  const [meta, hist, plans, coach] = await Promise.all([
    db.doc('app/meta').get(), db.collection('history').limit(1000).get(), db.collection('plans').limit(1000).get(), db.doc('coach/session').get()
  ]);
  const body = (d) => JSON.parse(JSON.stringify(d.data()));
  const remote = {
    ...emptyState(),
    ...(meta.exists ? body(meta) : {}),
    history: hist.docs.map(body), plans: plans.docs.map(body).sort((a, b) => (a.createdAt || '').localeCompare(b.createdAt || '')),
    coach: coach.exists ? body(coach) : null
  };
  // Что уже лежит на claude.ai, повторно не пишем.
  if (meta.exists) cloud.synced['app/meta'] = JSON.stringify(cloudDocs(remote)['app/meta']);
  for (const d of hist.docs) cloud.synced[`history/${d.id}`] = JSON.stringify(body(d));
  for (const d of plans.docs) cloud.synced[`plans/${d.id}`] = JSON.stringify(body(d));
  if (coach.exists) cloud.synced['coach/session'] = JSON.stringify(cloudDocs(remote)['coach/session']);
  cloud.status = 'ready';
  return meta.exists || hist.size || plans.size ? remote : null;
}

/* =====================================================================
   Автобэкап в GitHub: после каждого сохранения данных (тренировка, ответ тренера, правка, откат)
   приложение коммитит JSON-снимок в один файл репозитория через GitHub API. История версий — это git log файла.

const GH_DEFAULT_PATH = 'workout-backup.json';
const GH_DELAY_MS = 3000;  // несколько сохранений подряд уходят одним коммитом
let gh = { repo: '', token: '', path: GH_DEFAULT_PATH, sha: '', pushedHash: '', dirty: false, lastOk: '', lastError: '' };

function saveGh() { safeSet(GH_KEY, JSON.stringify(gh)); }
const ghOn = () => !!(gh.repo && gh.token);
let ghTimer = null, ghBusy = false;

function hashStr(str) { let h = 5381; for (let i = 0; i < str.length; i++) h = (h * 33 ^ str.charCodeAt(i)) >>> 0; return `${str.length}:${h}`; }

  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin);
}
function backupJson() { return JSON.stringify(state, null, 2); }
function ghUrl() { return `https://api.github.com/repos/${gh.repo}/contents/${gh.path.split('/').map(encodeURIComponent).join('/')}`; }
async function ghFetch(url, opts = {}, accept = 'application/vnd.github+json') {

  if (r.status === 401) throw new Error('GitHub не принял токен (401) — проверьте или создайте заново');
  if (r.status === 403) throw new Error('Нет доступа (403): токену нужно право Contents: Read and write на этот репозиторий');
  return r;
}
// Текущий sha файла в репозитории ('' — файла ещё нет).
async function ghRemoteSha() {
  const r = await ghFetch(ghUrl());
  if (r.status === 404) return '';
  if (!r.ok) throw new Error(`GitHub ответил ${r.status}`);
  return (await r.json()).sha || '';
}
// Содержимое бэкапа в репозитории (null — файла нет).
async function ghReadRemote() {
  const r = await ghFetch(ghUrl(), {}, 'application/vnd.github.raw+json');
  if (r.status === 404) return null;
  if (!r.ok) throw new Error(`GitHub ответил ${r.status}`);
  return JSON.parse(await r.text());
}
function ghSchedule() {
  if (!ghOn()) return;
  gh.dirty = true; saveGh();
  clearTimeout(ghTimer); ghTimer = setTimeout(ghPush, GH_DELAY_MS);
}
async function ghPush(force = false) {
  if (!ghOn()) return false;
  if (ghBusy) { clearTimeout(ghTimer); ghTimer = setTimeout(ghPush, GH_DELAY_MS); return false; }
  const body = backupJson(), hash = hashStr(body);
  if (!force && hash === gh.pushedHash) { gh.dirty = false; saveGh(); return true; }
  ghBusy = true;
  try {
    const last = state.history.map(h => h.date).sort().pop();
    const message = `Бэкап: ${state.history.length} ${plural(state.history.length, 'запись', 'записи', 'записей')}${last ? `, последняя ${last}` : ''}`;
    const put = (sha) => ghFetch(ghUrl(), { method: 'PUT', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message, content: utf8ToB64(body), ...(sha ? { sha } : {}) }) });
    let r = await put(gh.sha);
    // sha устарел (файл меняли с другого устройства или вручную) — берём актуальный и пишем поверх; прошлая версия остаётся в истории git.
    if (r.status === 409 || r.status === 422) r = await put(await ghRemoteSha());
    if (!r.ok) throw new Error(r.status === 404 ? 'Репозиторий не найден (404): проверьте имя и доступ токена' : `GitHub ответил ${r.status}`);
    gh.sha = (await r.json()).content.sha;
    Object.assign(gh, { pushedHash: hash, dirty: hashStr(backupJson()) !== hash, lastOk: new Date().toISOString(), lastError: '' });
    saveGh();
    if (gh.dirty) ghSchedule();
    return true;
  } catch (e) {
    gh.lastError = e.message === 'Failed to fetch' ? 'Нет связи с GitHub — отправлю при следующем сохранении или открытии' : e.message;
    saveGh();

}
function ghStatusHtml() {
  if (!ghOn()) return '<span class="muted">Не подключено</span>';
  const t = gh.lastOk ? new Date(gh.lastOk) : null;
  const when = t ? `${t.getDate()} ${MONTHS[t.getMonth()]}, ${pad(t.getHours())}:${pad(t.getMinutes())}` : '';
  if (gh.lastError) return `<span style="color:var(--bad)">⚠ ${esc(gh.lastError)}</span>${when ? `<br><span class="muted">Последний успешный бэкап: ${when}</span>` : ''}`;
  if (gh.dirty) return '<span class="muted">Отправляю…</span>';
  return when ? `<span style="color:var(--good)">✓ Бэкап актуален</span> <span class="muted">· ${when}</span>` : '<span class="muted">Ещё не отправлялся</span>';

// Подключение: проверяем доступ; если в репозитории уже есть бэкап (другое устройство), предлагаем восстановить из него, а не затирать.
async function ghConnect() {
  const repo = $('#ghRepo').value.trim().replace(/^https?:\/\/github\.com\//, '').replace(/\.git$/, '').replace(/\/+$/, '');
  const token = $('#ghToken').value.trim() || gh.token;
  const path = $('#ghPath').value.trim().replace(/^\/+/, '') || GH_DEFAULT_PATH;
  if (!/^[\w.-]+\/[\w.-]+$/.test(repo)) { toast('Репозиторий в виде владелец/имя, например IgorTsalko/workout-backup'); return; }
  if (!token) { toast('Вставьте токен'); return; }
  Object.assign(gh, { repo, token, path, sha: '', pushedHash: '', lastError: '' });
  try {
    const r = await ghFetch(`https://api.github.com/repos/${repo}`);
    if (r.status === 404) throw new Error('Репозиторий не найден (404): проверьте имя и что токен выдан на этот репозиторий');
    if (!r.ok) throw new Error(`GitHub ответил ${r.status}`);
    const remote = await ghReadRemote();
    gh.sha = remote ? await ghRemoteSha() : '';
    saveGh();
    if (remote && Array.isArray(remote.history) && hashStr(JSON.stringify(remote, null, 2)) !== hashStr(backupJson())) {
      if (await ask(`В репозитории уже есть бэкап: ${remote.history.length} записей, ${remote.plans?.length ?? 0} планов (здесь: ${state.history.length} и ${state.plans.length}).\n\n«ОК» — взять данные из GitHub.\n«Отмена» — оставить данные этого браузера и записать их в GitHub (прошлая версия останется в истории репозитория).`)) {
        ghApplyRemote(remote); return;
      }
    }
    await ghPush(true);
    toast(gh.lastError ? gh.lastError : 'GitHub подключён, бэкап отправлен');
  } catch (e) {
    gh.lastError = e.message === 'Failed to fetch' ? 'Нет связи с GitHub' : e.message; saveGh(); toast(gh.lastError);
  }
  render();
}
function ghApplyRemote(remote) {
  delete remote.profile;
  state = { ...emptyState(), ...remote };
  safeSet(STORE_KEY, JSON.stringify(state)); safeDel(UNDO_KEY);
  Object.assign(gh, { pushedHash: hashStr(backupJson()), dirty: false, lastOk: new Date().toISOString(), lastError: '' }); saveGh();
  toast(`Восстановлено из GitHub: ${state.history.length} записей`); render();
}
async function ghRestore() {
  try {
    const remote = await ghReadRemote();
    if (!remote || !Array.isArray(remote.history) || !Array.isArray(remote.plans)) { toast('В репозитории нет бэкапа этого приложения'); return; }
    if (!await ask(`Восстановить из GitHub ${remote.history.length} записей и ${remote.plans.length} планов? Текущие данные будут заменены.`)) return;
    gh.sha = await ghRemoteSha();
    ghApplyRemote(remote);
  } catch (e) { toast(e.message === 'Failed to fetch' ? 'Нет связи с GitHub' : e.message); }
}

function profile() {

// Изменения профиля из ответа Claude (profile_update) или ручной правки. Возвращает список применённых изменений.
function applyProfileUpdate(upd, by, reason) {
  if (!upd || typeof upd !== 'object') return [];
  const cur = profile();
  const changes = [];
  const set = (field, value) => {
    if (value === cur[field]) return;

    changes.push({ field, from: cur[field], to: value });

// Подтверждение и ввод текста — своим окном: на claude.ai confirm() и prompt() не работают.
function modal(bodyHtml, buttons) {
  return new Promise(resolve => {
    const wrap = document.createElement('div');
    wrap.className = 'modal';
    wrap.innerHTML = `<div class="modal-box" role="dialog" aria-modal="true">${bodyHtml}
      <div class="row" style="justify-content:flex-end;margin-top:12px">${buttons.map((b, k) =>
        `<button class="btn ${b.cls || ''}" data-k="${k}">${esc(b.label)}</button>`).join('')}</div></div>`;
    const done = (v) => { wrap.remove(); document.removeEventListener('keydown', onKey); resolve(v); };
    const onKey = (e) => { if (e.key === 'Escape') done(null); };

      const b = e.target.closest('button[data-k]');
      if (b) done(buttons[+b.dataset.k].value(wrap));
      else if (e.target === wrap) done(null);

    document.addEventListener('keydown', onKey);

  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 0);

// Группирует подряд идущие одинаковые подходы: [{w:75,r:8},{w:75,r:8}] → [{w:75,r:8,n:2}]
function groupSets(list) {
  const out = [];
  for (const x of list) {
    const last = out[out.length - 1];
    if (last && last.weight === x.weight && String(last.reps) === String(x.reps)) last.n++;
    else out.push({ weight: x.weight, reps: x.reps, n: 1 });

}
const workSets = (ex) => Array.isArray(ex.sets_detail) && ex.sets_detail.length
  ? ex.sets_detail.filter(x => !x.warmup)
  : Array.from({ length: Math.max(1, Number(ex.sets) || 1) }, () => ({ weight: ex.weight, reps: ex.reps }));
const warmupSets = (ex) => Array.isArray(ex.sets_detail) ? ex.sets_detail.filter(x => x.warmup) : [];
// Суперсет — один пункт плана из нескольких частей (А, Б…), выполняемых подряд без отдыха.
const SS_LABELS = ['А', 'Б', 'В', 'Г'];
const isSuperset = (ex) => Array.isArray(ex.parts) && ex.parts.length > 0;
const supersetHead = (ex) => `${ex.sets || 1} ${plural(ex.sets || 1, 'круг', 'круга', 'кругов')}: ${ex.parts.map((_, j) => SS_LABELS[j]).join(' → ')} без отдыха${ex.rest_sec ? `, отдых ${fmtRest(ex.rest_sec)} между кругами` : ''}`;
function plural(n, one, few, many) { const m10 = n % 10, m100 = n % 100; return m10 === 1 && m100 !== 11 ? one : m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14) ? few : many; }
// Разминка и заминка — отдельные пункты плана с длительностью (kind: warmup / cooldown).
const isStage = (ex) => ex.kind === 'warmup' || ex.kind === 'cooldown';
const WARMUP_SET_REST = 60;   // отдых после разминочного подхода, сек
const SS_SWITCH = 15;         // переход между частями суперсета, сек
// Оценка времени одного подхода: ~3 сек на повтор + подготовка.
const workSec = (e, reps) => e.unit === 'sec' ? (firstNum(reps) || 30) + 10 : Math.min(90, Math.max(30, (firstNum(reps) || 10) * 3 + 10));

const stageName = (ex) => ex.name || (ex.kind === 'warmup' ? 'Разминка' : 'Заминка');
// Все пункты плана по порядку. Разминка и заминка — такие же пункты: разминка №1, заминка последняя.
function planList(plan) {
  const list = [...(plan.exercises || [])];
  if (!list.some(e => e.kind === 'warmup') && plan.warmup) list.unshift({ kind: 'warmup', name: 'Разминка', duration_min: 5, notes: plan.warmup });
  if (!list.some(e => e.kind === 'cooldown') && plan.cooldown) list.push({ kind: 'cooldown', name: 'Заминка', duration_min: 5, notes: plan.cooldown });
  return list;
}
// Пункты плана по порядку с таймингом: start/end в секундах от начала тренировки и шаги (подходы/круги) с отдыхом.
function planItems(plan) {
  const list = planList(plan);
  const transition = plan.rest_between_exercises_sec ?? 180;
  const strength = list.map((e, i) => isStage(e) ? -1 : i).filter(i => i >= 0);
  const lastStrength = strength[strength.length - 1];
  let t = 0;
  const items = list.map((ex, i) => {
    const start = t, n = i + 1;
    if (isStage(ex)) { t += (num(ex.duration_min) || 5) * 60; return { ex, num: n, start, end: t, steps: [] }; }
    const after = i === lastStrength ? 0 : transition;
    const steps = [];
    let end = t;
    if (isSuperset(ex)) {
      const rounds = ex.sets || 1;
      // Разминочные подходы частей (sets_detail с warmup) — до первого круга, каждая часть отдельно.
      ex.parts.forEach(p => warmupSets(p).forEach(x => { t += workSec(p, x.reps) + WARMUP_SET_REST; }));
      // В круге r каждая часть делает свой r-й рабочий подход (вес и повторы по кругам могут различаться).
      const roundSec = (r) => ex.parts.reduce((sum, p) => {
        const ws = workSets({ ...p, sets: rounds });
        return sum + workSec(p, (ws[r] || ws[ws.length - 1]).reps);

      }
    } else {
      const sets = [...warmupSets(ex).map(x => ({ ...x, warmup: true })), ...workSets(ex)];
      sets.forEach((x, k) => {
        const last = k === sets.length - 1, rest = last ? after : x.warmup ? WARMUP_SET_REST : (ex.rest_sec ?? 90);

const loadText = (e, x) => e.unit === 'sec' ? `${x.reps} сек${x.weight ? ` · ${+x.weight} кг` : ''}`

const restAfter = (it) => it.steps.length ? it.steps[it.steps.length - 1].rest : 0;

// Отдых между рабочими подходами — только если рабочих подходов больше одного.
const workRest = (ex) => ex.rest_sec && workSets(ex).length > 1 ? ex.rest_sec : 0;
// «5 подходов» — число подходов в группе. У рабочих пишем, только когда они разные (3 × 8 + 2 × 6):
// иначе число и так видно из «3 × 8», а сумма с первого взгляда не читается.
const setsCount = (n) => `${n} ${plural(n, 'подход', 'подхода', 'подходов')}`;

// Плоский список пунктов плана с номерами, как на экране: части суперсетов разворачиваются в «5А», «5Б»,
// у разминки и заминки stage: true (подходов у них нет).
function flatExercises(plan) {
  const out = [];

    else out.push({ ex, tag: String(i + 1), ss: null });

function saveLog() {
  const d = draft;
  if (!d.date) return toast('Укажите дату');
  const entry = {
    id: d.id || uid(),
    createdAt: d.createdAt || new Date().toISOString(),
    date: d.date, status: d.status, planId: d.planId, title: d.title,
    wellbeing: d.wellbeing, notes: (d.notes || '').trim(),
    bodyweight: num(d.bodyweight), extras: (d.extras || '').trim(),
    wishes: (d.wishes || '').trim(), insist: !!(d.insist && (d.wishes || '').trim())
  };
  // Пожелания по пунктам от тренера сохраняем, пока текст не правили вручную.
  if (Array.isArray(d.wishList) && d.wishList.map(w => w.text).join('; ') === entry.wishes) {
    // Снятая галочка «Настаиваю» снимает его со всех пунктов.
    entry.wishList = entry.insist ? d.wishList : d.wishList.map(w => ({ ...w, insist: false }));
    entry.insist = entry.wishList.some(w => w.insist);
  }
  if (d.status === 'done') {
    entry.exercises = d.exercises.filter(ex => ex.name.trim()).map(ex => ({
      name: ex.name.trim(), unit: ex.unit || 'reps', planned: ex.planned || null,
      ...(ex.superset ? { superset: ex.superset } : {}),
      rpe: normRpe(ex.rpe),
      sets: ex.sets.map(s => ({ reps: num(s.reps), weight: num(s.weight) ?? 0, done: s.done !== false, ...(s.warmup ? { warmup: true } : {}) })),
      notes: (ex.notes || '').trim()
    }));
    if (!entry.exercises.length) return toast('Добавьте хотя бы одно упражнение');
    entry.effort = normRpe(d.effort); entry.duration = num(d.duration); entry.sleep = num(d.sleep);
  } else {
    entry.reason = (d.reason || '').trim();
  }
  const idx = state.history.findIndex(h => h.id === entry.id);
  if (idx >= 0) state.history[idx] = entry; else state.history.push(entry);
  save();
  draft = null; saveDraft();
  toast('Запись сохранена');
  setTab('history');
}

function metaLine(h) {
  const parts = [];
  if (h.wellbeing) parts.push(`самочувствие ${h.wellbeing}/5`);
  if (h.effort) parts.push(`RPE ${fmtRpe(h.effort)}`);
  if (h.duration) parts.push(`${h.duration} мин`);
  if (h.sleep) parts.push(`сон ${h.sleep} ч`);
  if (h.bodyweight) parts.push(`вес тела ${h.bodyweight} кг`);
  if (h.status === 'done') parts.push(`рабочий объём ${Math.round(volume(h))} кг`);
  return parts.join(' · ');
}
// «20кг×20 (разм.), 40кг×10 (разм.), 75кг×8 ×3» — одинаковые подряд подходы сворачиваются.
function setsLine(ex) {
  const u = ex.unit === 'sec' ? 'с' : '';
  const one = (s) => `${s.weight ? `${+s.weight}кг×` : ''}${s.reps ?? '?'}${u}${s.warmup ? ' (разм.)' : ''}${s.done === false ? ' (не вып.)' : ''}`;
  const out = [];
  for (const s of ex.sets) {
    const t = one(s), last = out[out.length - 1];
    if (last && last.t === t) last.n++; else out.push({ t, n: 1 });
  }
  return out.map(x => x.n > 1 ? `${x.t} ×${x.n}` : x.t).join(', ');
}
const isWork = (x) => x.done !== false && !x.warmup;
const volume = (h) => (h.exercises || []).reduce((sum, ex) => ex.unit === 'sec' ? sum :
  sum + ex.sets.reduce((s, x) => s + (isWork(x) ? (x.reps || 0) * (x.weight || 0) : 0), 0), 0);

function exerciseSeries(name) {
  return [...state.history].filter(h => h.status === 'done').sort((a, b) => a.date.localeCompare(b.date))
    .map(h => {
      const ex = (h.exercises || []).find(e => e.name === name); if (!ex) return null;
      const done = ex.sets.filter(isWork);
      if (!done.length) return null;
      const isSec = ex.unit === 'sec';
      const top = done.reduce((a, b) => ((b.weight || 0) > (a.weight || 0) || ((b.weight || 0) === (a.weight || 0) && (b.reps || 0) > (a.reps || 0))) ? b : a);
      const bw = !done.some(s => s.weight);
      return {
        date: h.date,
        value: (isSec || bw) ? Math.max(...done.map(s => s.reps || 0)) : top.weight,
        metric: isSec ? 'сек' : bw ? 'повт.' : 'кг',
        detail: setsLine(ex)
      };
    }).filter(Boolean);
}
const BODYWEIGHT = '⚖ Вес тела';
function bodyweightSeries() {
  return [...state.history].filter(h => num(h.bodyweight)).sort((a, b) => a.date.localeCompare(b.date))

const seriesFor = (name) => name === BODYWEIGHT ? bodyweightSeries() : exerciseSeries(name);

function attendanceHtml(weeks) {
  const byDate = {};
  for (const h of state.history) byDate[h.date] = byDate[h.date] && byDate[h.date] === 'done' ? 'done' : h.status;
  const today = todayIso();
  const t = parseIso(today);
  const mondayOffset = (t.getDay() + 6) % 7;
  const thisMonday = addDays(today, -mondayOffset);
  let html = `<div class="att"><div></div>${['пн', 'вт', 'ср', 'чт', 'пт', 'сб', 'вс'].map(d => `<div class="h">${d}</div>`).join('')}`;
  for (let w = weeks - 1; w >= 0; w--) {
    const mon = addDays(thisMonday, -7 * w);
    const md = parseIso(mon);
    html += `<div class="wk">${md.getDate()} ${MONTHS[md.getMonth()]}</div>`;
    for (let i = 0; i < 7; i++) {
      const day = addDays(mon, i);
      const st = byDate[day];
      const cls = ['c', st || '', day === today ? 'today' : '', day > today ? 'future' : ''].join(' ');
      html += `<div class="${cls}" title="${fmtDate(day)}${st ? ' — ' + STATUS[st].label : ''}">${st ? STATUS[st].glyph : ''}</div>`;
    }
  }
  return html + `</div>`;
}

  const xIdx = data.length <= 6 ? data.map((_, i) => i) : [0, Math.floor(data.length / 3), Math.floor(2 * data.length / 3), data.length - 1];

    <g class="grid">${ticks.map(t => `<line x1="${m.l}" x2="${W - m.r}" y1="${y(t)}" y2="${y(t)}"/>`).join('')}</g>
    <g class="axis">${ticks.map(t => `<text x="${m.l - 6}" y="${y(t) + 4}" text-anchor="end">${+t.toFixed(1)}</text>`).join('')}
      ${xIdx.map(i => { const d = parseIso(data[i].date); return `<text x="${x(data[i].date)}" y="${H - 6}" text-anchor="middle">${d.getDate()} ${MONTHS[d.getMonth()]}</text>`; }).join('')}</g>
    <path class="line" d="${pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ')}"/>
    <line class="cross" id="cross" y1="${m.t}" y2="${H - m.b}" style="display:none"/>
    ${pts.map(p => `<circle class="pt" cx="${p[0]}" cy="${p[1]}" r="4.5"/>`).join('')}
    <rect id="hit" x="${m.l}" y="0" width="${W - m.l - m.r}" height="${H}" fill="transparent"/>
  </svg><div class="tip" id="tip"></div>`;

  const move = (clientX) => {
    const r = svg.getBoundingClientRect();
    const sx = (clientX - r.left) * (W / r.width);
    let bi = 0; pts.forEach((p, i) => { if (Math.abs(p[0] - sx) < Math.abs(pts[bi][0] - sx)) bi = i; });
    const p = pts[bi], d = data[bi];

    const px = p[0] * r.width / W, py = p[1] * r.height / H;

function niceTicks(lo, hi, n) {
  const span = hi - lo, raw = span / n, mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 2.5, 5, 10].map(s => s * mag).find(s => span / s <= n) || mag * 10;
  const out = []; for (let v = Math.ceil(lo / step) * step; v <= hi + 1e-9; v += step) out.push(v);
  return out;
}

function planLine(ex) {
  if (isStage(ex)) return `${num(ex.duration_min) || 5} мин${ex.notes ? `: ${ex.notes}` : ''}`;
  if (isSuperset(ex)) return `${supersetHead(ex)}; ${ex.parts.map((p, j) => `${SS_LABELS[j]}) ${p.name}: ${planLine({ ...p, sets: ex.sets, rest_sec: null })}`).join('; ')}`;
  const parts = [planText(ex)];
  if (ex.rest_sec) parts.push(`отдых ${fmtRest(ex.rest_sec)}`);
  if (ex.rpe) parts.push(`RPE ${fmtRpe(ex.rpe)}`);
  return parts.join(', ');
}

}

function extractJson(text) {

  const candidates = [...fences.reverse()];
  const a = text.indexOf('{'), b = text.lastIndexOf('}');
  if (a >= 0 && b > a) candidates.push(text.slice(a, b + 1));
  for (const c of candidates) {
    try { const o = JSON.parse(c.trim()); if (o && typeof o === 'object') return o; } catch (e) {}
  }
  return null;
}

    const k = tagKey(e.tag);

const MUSCLES = [

  if (bal.unknownPrev.length) warnings.push(`Не размечены мышцы у упражнений прошлой тренировки: ${bal.unknownPrev.join(', ')} — укажи их в update_log.muscles, иначе баланс неполный.`);

    if (c.type === 'max_supersets' && ssCount > num(c.n)) violations.push(`${tag}: суперсетов ${ssCount}.`);

  if (fresh.length > maxNew) warnings.push(`Новых упражнений ${fresh.length} (${fresh.join(', ')}), а лучше не больше ${maxNew}.`);

async function importPlan() {
  const text = $('#importText').value.trim();
  const msg = $('#importMsg');
  if (!text) { msg.textContent = 'Поле пустое'; return; }
  const o = extractJson(text);
  if (!o) { msg.textContent = 'Не нашёл корректный JSON в тексте. Попросите Claude вернуть блок ```json.'; return; }
  try {
    // Сначала тренировка: её номера относятся к плану, который был текущим до этого ответа.
    const c = o.completed_workout || o.completedWorkout;
    const entry = c ? normalizeLog(c, currentPlan()) : null;
    const upd = o.profile_update || o.profileUpdate || null;
    const plan = o.next_workout || o.nextWorkout || o.workout || o.exercises || (!entry && !upd) ? normalizePlan(o) : null;
    if (ui.lastImport === text && !await ask('Этот ответ уже загружен. Загрузить ещё раз? (Запись и план продублируются.)')) return;
    const issues = plan ? planIssues(plan) : [];
    if (issues.length && !await ask(`В плане тренера есть ошибки:\n\n${issues.map(x => `• ${x}`).join('\n')}\n\nЛучше вернуть план тренеру: «Вернуть тренеру» скопирует замечания, чтобы вставить их в чат.`, { ok: 'Загрузить как есть', cancel: 'Вернуть тренеру' })) {
      const back = `В плане есть ошибки, исправь и пришли финальный JSON заново:\n${issues.map(x => `- ${x}`).join('\n')}`;
      copyText(back).then(ok => toast(ok ? 'Замечания скопированы — вставьте их в чат с тренером' : 'Не удалось скопировать'));
      msg.textContent = back;
      return;
    }
    if (issues.length) plan.warnings = [...plan.warnings, ...issues.map(x => `Проверка приложения: ${x}`)];
    const undo = { at: new Date().toISOString(), state: JSON.stringify(state), report: ui.report || '',
      what: [entry && 'тренировка', plan && 'план', upd && 'данные «Обо мне»'].filter(Boolean).join(', ') };
    ui.lastImport = text;
    if (entry || plan) ui.report = '';
    if (entry) state.history.push(entry);
    saveUi();
    safeSet(UNDO_KEY, JSON.stringify(undo));
    const changes = applyProfileUpdate(upd, 'coach');
    const updMsg = changes.length ? `, данные «Обо мне» обновлены (${changes.length})` : '';
    if (!plan) {
      save();
      toast((entry ? 'Тренировка записана в историю' : changes.length ? 'Данные «Обо мне» обновлены' : 'Тренер ничего не изменил') + (entry ? updMsg : ''));
      setTab(entry ? 'history' : 'settings');

    // Пожелания без описания тренировки Claude возвращает отдельно в request.
    const req = !entry && o.request && o.request.text ? String(o.request.text).trim() : '';
    if (req) {

      state.requests = [...(state.requests || []), { date: todayIso(), text: req, insist: !!o.request.insist }];

async function coachAction(act, b) {
  const S = session();
  switch (act) {
    case 'coach-send': {
      const t = (ui.coachInput || '').trim(); if (!t) return;
      ui.coachInput = ''; ui.report = ''; saveUi(); coachSend(t); return;
    }
    case 'coach-quick': coachSend(b.dataset.text); return;
    case 'coach-retry': coachSend(null); return;
    case 'coach-stop': coach.ctl?.abort(); return;
    case 'coach-pane': ui.coachPane = b.dataset.pane; saveUi(); refreshCoachPanel(); return;
    case 'coach-accept': coachAccept(); return;
    case 'coach-flag': {
      const m = S.messages.find(x => x.id === b.dataset.id); if (!m) return;
      const text = await askText('Замечание тренеру (тренер обязан исправить и запомнить правило):', m.text.slice(0, 400), { ok: 'Отметить' });
      if (!text || !text.trim()) return;
      S.issues.push({ id: `i${S.issues.length + 1}`, text: text.trim(), status: 'open', source: 'me', at: new Date().toISOString() });
      save(); refreshCoach(); toast('Замечание отмечено — тренер увидит его в следующем ответе'); return;
    }
    case 'coach-new': {
      if (S.messages.length && S.draft && !S.acceptedPlanId && !await ask('Начать новый разговор? Непринятый черновик плана пропадёт. Записанная тренировка и правила останутся.', { ok: 'Начать новый' })) return;
      state.coach = newSession(); safeDel(UNDO_KEY); coach.error = ''; save(); render(); return;
    }
    case 'rule-add': {
      const t = await askText('Новое правило для тренера:', ''); if (!t || !t.trim()) return;
      addRule(t, null, 'me'); save(); render(); return;
    }
    case 'rule-edit': {
      const r = (state.rules || []).find(x => x.id === b.dataset.id); if (!r) return;
      const t = await askText('Правило:', r.text); if (t === null || !t.trim()) return;
      r.text = t.trim(); save(); render(); return;
    }
    case 'rule-toggle': { const r = (state.rules || []).find(x => x.id === b.dataset.id); if (r) { r.active = r.active === false; save(); render(); } return; }
    case 'rule-del': {
      if (!await ask('Удалить правило?', { ok: 'Удалить', danger: true })) return;
      state.rules = (state.rules || []).filter(x => x.id !== b.dataset.id); save(); render(); return;
    }
  }
}

}

/* =====================================================================
   Экспорт плана на сегодня: PNG (canvas), печать/PDF, текст
   ===================================================================== */
const planFileName = (ext) => { const p = currentPlan(); return `workout-${p && p.date ? p.date : todayIso()}.${ext}`; };
function canShareFiles() {
  try { return !!(navigator.canShare && navigator.canShare({ files: [new File([''], 'x.png', { type: 'image/png' })] })); }
  catch (e) { return false; }
}
function planAsText(plan) {
  const { items, total } = planItems(plan);
  const L = [`🏋️ ${plan.title || 'Тренировка'}${plan.date ? ` — ${fmtDate(plan.date)}` : ''}`];
  L.push([plan.focus, `~${fmtMin(total)} мин`].filter(Boolean).join(' · '));
  if (plan.recommendation) L.push('', `💡 ${plan.recommendation}`);
  (plan.warnings || []).forEach((w, k) => { if (!k) L.push(''); L.push(`⚠ ${w}`); });
  for (const it of items) {
    const ex = it.ex, when = `[${fmtMin(it.start)}–${fmtMin(it.end)} мин]`;
    L.push('');
    if (isStage(ex)) {
      L.push(`${it.num}. ${ex.kind === 'warmup' ? '🔥' : '🧘'} ${stageName(ex)} ${when}`);
      if (ex.notes) L.push(`   ${ex.notes}`);
      continue;
    }
    if (isSuperset(ex)) {
      L.push(`${it.num}. Суперсет${ex.name ? `: ${ex.name}` : ''} ${when}${ex.change ? ` [${ex.change}]` : ''}`);
      ex.parts.forEach((p, j) => {
        L.push(`   ${SS_LABELS[j]}) ${p.name}${p.change ? ` [${p.change}]` : ''}${p.rpe ? ` · RPE ${fmtRpe(p.rpe)}` : ''}`);
        // Нагрузка части по кругам: «3 × 26 кг × 12-15» или, если круги разные, «1 × 5 кг × 15, 2 × 10 кг × 15».
        const pe = { ...p, sets: ex.sets }, load = (g) => `${g.n} × ${loadText(pe, g)}`;
        L.push(`      ${warmupSets(pe).length ? `разминка ${groupSets(warmupSets(pe)).map(load).join(', ')}; ` : ''}${groupSets(workSets(pe)).map(load).join(', ')}`);
        if (p.notes) L.push(`      ${p.notes}`);
      });
      L.push(`   ${'☐'.repeat(ex.sets || 1)} ${supersetHead(ex)}`);
    } else {
      L.push(`${it.num}. ${ex.name} ${when}${ex.change ? ` [${ex.change}]` : ''}${ex.rpe ? ` · RPE ${fmtRpe(ex.rpe)}` : ''}`);
    }
    if (!isSuperset(ex)) {
      // Чекбокс на каждый подход, одинаковые подряд подходы — в одной строке: «☐☐☐ 77.5 кг × 6».
      const boxes = (g) => `${'☐'.repeat(g.n)} ${loadText(ex, g)}`;
      if (warmupSets(ex).length) L.push(`   Разминка (${setsCount(warmupSets(ex).length)}, отдых ${fmtRest(WARMUP_SET_REST)}): ${groupSets(warmupSets(ex)).map(boxes).join(', ')}`);
      const wr = workRest(ex), wc = workCount(ex), meta = [wc ? setsCount(wc) : '', wr ? `отдых ${fmtRest(wr)}` : ''].filter(Boolean).join(', ');
      L.push(`   ${warmupSets(ex).length || meta ? `Рабочие${meta ? ` (${meta})` : ''}: ` : ''}${groupSets(workSets(ex)).map(boxes).join(', ')}`);
    }
    if (ex.notes) L.push(`   ${ex.notes}`);
    if (restAfter(it)) L.push(`   ⏸ Отдых ${fmtRest(restAfter(it))}`);
  }
  if (plan.notes) L.push('', `📝 ${plan.notes}`);
  return L.join('\n');
}

// Рисуем план на canvas вручную — без внешних библиотек, работает офлайн.
function planImageBlob(plan) {
  const timeline = planItems(plan);
  const W = 1080, PAD = 56, SCALE = 1;
  const C = { bg: '#f4f4f2', card: '#ffffff', border: '#dddcd7', text: '#0b0b0b', text2: '#52514e', muted: '#8a8984',
    accent: '#2a78d6', accentSoft: '#e3eefb', good: '#1f7a3a', goodSoft: '#e2f3e6', warn: '#9a6400', warnSoft: '#fbf0d9' };
  const FONT = 'system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d');
  const font = (size, weight = 400) => `${weight} ${size}px ${FONT}`;
  const wrap = (text, size, weight, maxW) => {
    ctx.font = font(size, weight);
    const out = [];
    for (const para of String(text).split('\n')) {
      let line = '';
      for (const word of para.split(/\s+/)) {
        const test = line ? `${line} ${word}` : word;
        if (ctx.measureText(test).width > maxW && line) { out.push(line); line = word; } else line = test;
      }
      out.push(line);
    }
    return out;
  };
  const roundRect = (x, y, w, h, r, fill, stroke) => {
    ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
    if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = 2; ctx.stroke(); }
  };
  const badgeColors = (change) => {
    const c = String(change).toLowerCase();
    if (/^\+|нов|добав|увелич/.test(c)) return [C.goodSoft, C.good];
    if (/^[−-]|сниж|меньш|умень|облегч|разгруз/.test(c)) return [C.warnSoft, C.warn];
    return [C.accentSoft, C.accent];
  };

  // Один проход раскладки: draw=false только считает высоту.
  const layout = (draw) => {
    let y = PAD;
    const inner = W - PAD * 2;
    const text = (str, size, weight, color, x, maxW, lh = 1.35) => {
      const lines = wrap(str, size, weight, maxW);
      if (draw) { ctx.font = font(size, weight); ctx.fillStyle = color; ctx.textBaseline = 'top'; lines.forEach((l, i) => ctx.fillText(l, x, y + i * size * lh)); }
      y += lines.length * size * lh;
    };
    // Заголовок
    text(plan.title || 'Тренировка', 54, 700, C.text, PAD, inner, 1.2);
    y += 8;
    const meta = [plan.date ? fmtDate(plan.date) : '', `~${fmtMin(timeline.total)} мин`,
      plan.rest_between_exercises_sec ? `${fmtRest(plan.rest_between_exercises_sec)} между упражнениями` : ''].filter(Boolean).join('  ·  ');
    if (meta) text(meta, 28, 500, C.accent, PAD, inner);
    if (plan.focus) { y += 4; text(plan.focus, 26, 400, C.text2, PAD, inner); }
    y += 28;
    // Блоки-подсказки
    const callout = (title, body, soft, line) => {
      const pad = 24, w = inner - pad * 2 - 8;
      const h = pad * 2 + 30 + wrap(body, 27, 400, w).length * 27 * 1.4;
      if (draw) { roundRect(PAD, y, inner, h, 18, soft); ctx.fillStyle = line; ctx.fillRect(PAD, y + 12, 6, h - 24); }
      const y0 = y; y += pad;
      text(title.toUpperCase(), 20, 700, C.text2, PAD + pad + 8, w);
      y += 6;
      text(body, 27, 400, C.text, PAD + pad + 8, w, 1.4);
      y = y0 + h + 18;
    };
    if (plan.recommendation) callout('Рекомендация', plan.recommendation, C.accentSoft, C.accent);
    if (plan.warnings && plan.warnings.length) callout('⚠ Важно', plan.warnings.map(w => `• ${w}`).join('\n'), C.warnSoft, C.warn);
    // «Перо»: рисует (d=true) или только меряет (d=false) блоки, начиная с высоты startY.
    const pen = (d, startY) => {
      const P = { y: startY };
      P.T = (str, size, weight, color, tx, maxW, lh = 1.35) => {
        const lines = wrap(str, size, weight, maxW);
        if (d) { ctx.font = font(size, weight); ctx.fillStyle = color; ctx.textBaseline = 'top'; lines.forEach((l, k) => ctx.fillText(l, tx, P.y + k * size * lh)); }
        P.y += lines.length * size * lh;
      };
      P.badge = (change, right) => {
        if (!change) return 0;
        ctx.font = font(22, 600); const bw = ctx.measureText(change).width + 32;
        if (d) { const [bg, fg] = badgeColors(change); roundRect(right - bw, P.y, bw, 38, 19, bg); ctx.font = font(22, 600); ctx.fillStyle = fg; ctx.textBaseline = 'middle'; ctx.fillText(change, right - bw + 16, P.y + 20); }
        return bw;
      };
      P.scheme = (e, tx, maxW, withRest = true) => {
        const warm = warmupLine(e), wr = withRest ? workRest(e) : 0;
        const head = (label, sec) => {
          if (d) {
            ctx.textBaseline = 'top'; ctx.font = font(19, 700); ctx.fillStyle = C.muted; ctx.fillText(label, tx, P.y + 3);
            if (sec) { const lw = ctx.measureText(label).width; ctx.font = font(22, 500); ctx.fillStyle = C.text2; ctx.fillText(` · отдых ${fmtRest(sec)}`, tx + lw, P.y); }
          }
          P.y += 32;
        };
        const wc = workCount(e), cnt = (n) => n ? ` · ${setsCount(n).toUpperCase()}` : '';
        if (warm) { head('РАЗМИНКА' + cnt(warmupSets(e).length), WARMUP_SET_REST); P.T(warm, 25, 500, C.text2, tx, maxW); P.y += 8; }
        if (warm || wr || wc) head('РАБОЧИЕ' + cnt(wc), wr);
        groupSets(workSets(e)).forEach((g, gi) => {
          const big = gi === 0;
          const main = `${big ? '' : '+ '}${g.n} × ${g.reps}`, unit = ` ${unitLabel(e.unit)} · `, wt = fmtW(g.weight);
          if (d) {
            ctx.textBaseline = 'top'; let cx = tx;
            ctx.font = font(big ? 40 : 28, 700); ctx.fillStyle = C.text; ctx.fillText(main, cx, P.y); cx += ctx.measureText(main).width;
            ctx.font = font(big ? 25 : 22, 500); ctx.fillStyle = C.text2; ctx.fillText(unit, cx, P.y + (big ? 11 : 4)); cx += ctx.measureText(unit).width;
            ctx.font = font(big ? 40 : 28, 700); ctx.fillStyle = C.text; ctx.fillText(wt, cx, P.y);
          }
          P.y += big ? 48 : 36;
        });
      };
      // Плашка «Отдых N мин» после последнего подхода/круга.
      P.rest = (it, tx, maxW) => {
        const sec = restAfter(it);
        if (!sec) return;
        P.y += 12;
        if (d) {
          roundRect(tx, P.y, maxW, 48, 12, '#efefec');
          ctx.textBaseline = 'middle'; ctx.font = font(24, 500); ctx.fillStyle = C.text2; const lbl = '⏸ Отдых ';
          ctx.fillText(lbl, tx + 16, P.y + 25); const lw = ctx.measureText(lbl).width;
          ctx.font = font(24, 700); ctx.fillStyle = C.text; ctx.fillText(fmtRest(sec), tx + 16 + lw, P.y + 25);
        }
        P.y += 48;
      };
      P.meta = (str, tx) => {
        if (!str) return;
        if (d) { ctx.font = font(23, 500); ctx.fillStyle = C.muted; ctx.textBaseline = 'top'; ctx.fillText(str, tx, P.y + 2); }
        P.y += 34;
      };
      return P;
    };
    // Упражнения
    timeline.items.forEach((it) => {
      const ex = it.ex;
      const pad = 28, x = PAD + pad + 70, w = inner - pad * 2 - 70, right = PAD + inner - pad;
      const y0 = y;
      const when = `⏱ ${fmtMin(it.start)}–${fmtMin(it.end)} мин`;
      const card = (d) => {
        const P = pen(d, y0 + pad);
        if (isStage(ex)) {
          P.T(`${ex.kind === 'warmup' ? '🔥' : '🧘'} ${stageName(ex)} · ${num(ex.duration_min) || 5} мин`, 34, 700, C.text, x, w, 1.25); P.y += 4;
          P.T(when, 23, 600, C.accent, x, w); P.y += 6;
          if (ex.notes) P.T(ex.notes, 24, 400, C.text2, x, w, 1.4);
          return P.y + pad;
        }
        if (!isSuperset(ex)) {
          const bw = P.badge(ex.change, right);
          P.T(ex.name, 34, 700, C.text, x, w - bw - 12, 1.25); P.y += 4;
          P.T(when + (ex.rpe ? `  ·  RPE ${fmtRpe(ex.rpe)}` : ''), 23, 600, C.accent, x, w); P.y += 8;
          P.scheme(ex, x, w);
          if (ex.notes) { P.y += 8; P.T(ex.notes, 24, 400, C.text2, x, w, 1.4); }
          P.rest(it, x, w);
          return P.y + pad;
        }
        const bw = P.badge(ex.change, right);
        P.T(`Суперсет${ex.name ? `: ${ex.name}` : ''}`, 34, 700, C.text, x, w - bw - 12, 1.25); P.y += 4;
        P.T(when, 23, 600, C.accent, x, w); P.y += 4;
        P.T(`↻ ${supersetHead(ex)}`, 23, 600, C.accent, x, w); P.y += 10;
        ex.parts.forEach((part, j) => {
          if (j) { P.y += 4; P.T('↓ сразу, без отдыха', 22, 600, C.accent, x + 14, w); P.y += 4; }
          const px = x + 66, pw = w - 66 - 18;
          const partBox = (dd, sy) => {
            const Q = pen(dd, sy + 18);
            const pbw = Q.badge(part.change, x + w - 18);
            Q.T(part.name, 29, 700, C.text, px, pw - pbw - 10, 1.25); Q.y += 6;
            Q.scheme({ ...part, sets: ex.sets }, px, pw, false);
            Q.meta(part.rpe ? `RPE ${fmtRpe(part.rpe)}` : '', px);
            if (part.notes) { Q.y += 4; Q.T(part.notes, 23, 400, C.text2, px, pw, 1.4); }
            return Q.y + 18;
          };
          const sy = P.y, end = partBox(false, sy);
          if (d) {
            roundRect(x, sy, w, end - sy, 14, '#efefec');
            ctx.fillStyle = C.accent; ctx.fillRect(x, sy + 10, 6, end - sy - 20);
            roundRect(x + 18, sy + 18, 34, 34, 8, C.accent);
            ctx.font = font(22, 700); ctx.fillStyle = '#ffffff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText(SS_LABELS[j], x + 35, sy + 36); ctx.textAlign = 'left';
            partBox(true, sy);
          }
          P.y = end;
        });
        if (ex.notes) { P.y += 8; P.T(ex.notes, 24, 400, C.text2, x, w, 1.4); }
        P.rest(it, x, w);
        return P.y + pad;
      };
      const h = card(false) - y0;
      if (draw) {
        roundRect(PAD, y0, inner, h, 20, C.card, C.border);
        ctx.beginPath(); ctx.arc(PAD + pad + 26, y0 + pad + 24, 26, 0, Math.PI * 2); ctx.fillStyle = C.accentSoft; ctx.fill();
        ctx.font = font(26, 700); ctx.fillStyle = C.accent; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(String(it.num), PAD + pad + 26, y0 + pad + 25); ctx.textAlign = 'left';
        card(true);
      }
      y = y0 + h + 16;
    });
    y += 6;
    if (plan.notes) callout('Заметки', plan.notes, '#efefec', C.muted);
    text(`Дневник тренировок · ${todayIso()}`, 20, 400, C.muted, PAD, inner);
    return y + PAD;
  };

  canvas.width = W; canvas.height = 100;
  const H = Math.ceil(layout(false));
  canvas.width = W * SCALE; canvas.height = H * SCALE;
  ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);
  layout(true);
  return new Promise(res => canvas.toBlob(res, 'image/png'));
}

/* =====================================================================
   Обработчики событий (делегирование)
   ===================================================================== */
document.addEventListener('click', async (e) => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act;
  const i = b.dataset.ex !== undefined ? +b.dataset.ex : null;
  const j = b.dataset.set !== undefined ? +b.dataset.set : null;
  if (/^(coach|rule)-/.test(act)) return coachAction(act, b);
  switch (act) {
    case 'goto': setTab(b.dataset.tab); break;
    case 'set-status':
      draft.status = b.dataset.status;
      if (draft.status === 'done' && !draft.exercises.length) {
        const fresh = newDraftFromPlan('done'); draft.exercises = fresh.exercises;
      }
      saveDraft(); render(); break;
    case 'scale': { const v = +b.dataset.v; draft[b.dataset.f] = draft[b.dataset.f] === v ? null : v; saveDraft(); render(); break; }
    case 'add-ex': draft.exercises.push({ name: '', unit: 'reps', planned: null, sets: [{ reps: null, weight: 0, done: true }], notes: '' }); saveDraft(); render(); break;
    case 'del-ex': draft.exercises.splice(i, 1); saveDraft(); render(); break;
    case 'add-set': { const s = draft.exercises[i].sets; const last = s[s.length - 1] || { reps: null, weight: 0 }; s.push({ reps: last.reps, weight: last.weight, done: true, warmup: false }); saveDraft(); render(); break; }
    case 'del-set': draft.exercises[i].sets.splice(j, 1); if (!draft.exercises[i].sets.length) draft.exercises.splice(i, 1); saveDraft(); render(); break;
    case 'save-log': saveLog(); break;
    case 'reset-draft':
      draft = null; saveDraft(); setTab('history'); break;
    case 'edit-entry': {
      const h = state.history.find(x => x.id === b.dataset.id); if (!h) break;
      draft = JSON.parse(JSON.stringify({ exercises: [], wellbeing: null, effort: null, duration: '', sleep: '', bodyweight: '', notes: '', extras: '', wishes: '', insist: false, reason: '', ...h }));
      saveDraft(); setTab('log'); break;
    }
    case 'del-entry':
      if (await ask('Удалить запись?', { ok: 'Удалить', danger: true })) { state.history = state.history.filter(x => x.id !== b.dataset.id); save(); render(); }
      break;
    case 'copy-prompt': toast(await copyText(buildPrompt(ui.promptCount)) ? 'Промпт тренера скопирован — вставьте его в чат Claude' : 'Не удалось скопировать — выделите текст вручную'); break;
    case 'dl-prompt': download(`workout-prompt-${todayIso()}.md`, buildPrompt(ui.promptCount), 'text/markdown'); break;
    case 'import-plan': importPlan(); break;
    case 'undo-import': undoImport(); break;
    case 'cancel-insist': {
      if (b.dataset.kind === 'entry') {
        const [id, i] = b.dataset.id.split(':');
        const h = state.history.find(x => x.id === id);
        if (h && Array.isArray(h.wishList) && h.wishList[+i]) { h.wishList[+i].insist = false; h.insist = h.wishList.some(w => w.insist); }
        else if (h) h.insist = false;
      }
      else { const r = (state.requests || [])[+b.dataset.id]; if (r) r.insist = false; }
      save(); toast('Требование отменено'); render(); break;
    }
    case 'edit-profile': {
      const f = b.dataset.field, cur = profile()[f];
      const v = await askText(`${PROFILE_LABELS[f]}:`, cur ?? '');
      if (v === null) break;
      const done = applyProfileUpdate({ [PROFILE_NUMBERS[f] ? PROFILE_NUMBERS[f][0] : f]: v }, 'me', '');
      if (done.length) { save(); toast('Сохранено'); render(); }
      break;
    }
    case 'reset-profile': {
      const f = b.dataset.field;
      if (!await ask(`Вернуть исходное значение поля «${PROFILE_LABELS[f]}»?`)) break;
      const from = profile()[f];
      const { [f]: _, ...rest } = state.profileEdits || {};
      state.profileEdits = rest;
      state.profileLog = [...(state.profileLog || []), { field: f, from, to: PROFILE[f], at: new Date().toISOString(), date: todayIso(), by: 'me', reason: 'возврат к исходному' }];
      save(); toast('Возвращено исходное значение'); render(); break;
    }
    case 'plan-png': {
      const blob = await planImageBlob(currentPlan());
      download(planFileName('png'), blob); toast('Картинка сохранена'); break;
    }
    case 'plan-pdf': {
      const prevTitle = document.title; document.title = planFileName('').replace(/\.$/, '');
      window.print(); document.title = prevTitle; break;
    }
    case 'plan-text': toast(await copyText(planAsText(currentPlan())) ? 'План скопирован текстом' : 'Не удалось скопировать'); break;
    case 'plan-share': {
      const blob = await planImageBlob(currentPlan());
      const file = new File([blob], planFileName('png'), { type: 'image/png' });
      try { await navigator.share({ files: [file], title: currentPlan().title, text: planAsText(currentPlan()) }); } catch (err) {}
      break;
    }
    case 'export-json': download(`workout-backup-${todayIso()}.json`, JSON.stringify(state, null, 2), 'application/json'); break;
    case 'import-json': $('#fileInput').click(); break;
    case 'gh-connect': b.disabled = true; await ghConnect(); break;
    case 'gh-push': b.disabled = true; toast(await ghPush(true) ? 'Бэкап отправлен в GitHub' : gh.lastError); break;
    case 'gh-restore': await ghRestore(); break;
    case 'gh-off':
      if (await ask('Отключить автобэкап в GitHub? Токен удалится из этого браузера, файл в репозитории останется.')) {
        gh = { repo: gh.repo, token: '', path: gh.path, sha: '', pushedHash: '', dirty: false, lastOk: '', lastError: '' }; saveGh(); render();
      }
      break;
    case 'load-seed':
      if (state.history.length && !await ask('Стартовые данные заменят текущие. Продолжить? (Сначала можно скачать бэкап.)')) break;
      state = { ...buildSeed(), profileEdits: state.profileEdits || {}, profileLog: state.profileLog || [] }; save(); safeDel(UNDO_KEY); draft = null; saveDraft(); toast('Стартовые данные загружены'); setTab('today'); break;
    case 'wipe':
      if (await ask('Удалить все тренировки, планы и профиль? Это нельзя отменить.', { ok: 'Удалить всё', danger: true })) { state = emptyState(); save(); safeDel(UNDO_KEY); draft = null; saveDraft(); setTab('today'); }
      break;
  }
});

document.addEventListener('input', (e) => {
  const el = e.target;
  if (el.id === 'coachInput') { ui.coachInput = el.value; saveUi(); return; }
  if (el.id === 'reportText') {
    ui.report = el.value; saveUi();
    const pr = buildPrompt(ui.promptCount);
    $('#promptText').textContent = pr; $('#promptSize').textContent = `~${Math.round(pr.length / 100) / 10}k символов`;
    return;
  }
  if (!draft || ui.tab !== 'log') return;
  if (el.dataset.f) { draft[el.dataset.f] = el.type === 'checkbox' ? el.checked : el.value; saveDraft(); return; }
  if (el.dataset.ex !== undefined) {
    const ex = draft.exercises[+el.dataset.ex]; if (!ex) return;
    const k = el.dataset.k;
    if (el.dataset.set !== undefined) {
      const s = ex.sets[+el.dataset.set];
      s[k] = (k === 'done' || k === 'warmup') ? el.checked : (el.value === '' ? null : num(el.value));
    } else ex[k] = el.value;
    saveDraft();
  }
});
document.addEventListener('change', (e) => {
  const el = e.target;
  if (el.id === 'promptCount') { ui.promptCount = +el.value; saveUi(); render(); }
  if (el.id === 'coachTier') { ui.coachTier = el.value; saveUi(); }
  if (ui.tab === 'log' && (el.dataset.k === 'unit' || el.dataset.k === 'warmup')) render();
});

document.addEventListener('keydown', (e) => {
  if (e.target.id === 'coachInput' && e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); coachAction('coach-send'); }
});
$('#fileInput').addEventListener('change', async (e) => {
  const file = e.target.files[0]; e.target.value = '';
  if (!file) return;
  try {
    const data = JSON.parse(await file.text());
    if (!Array.isArray(data.history) || !Array.isArray(data.plans)) throw new Error();
    if (!await ask(`Восстановить ${data.history.length} записей и ${data.plans.length} планов? Текущие данные будут заменены.`)) return;
    delete data.profile;
    state = { ...emptyState(), ...data };
    save(); safeDel(UNDO_KEY); toast('Данные восстановлены'); render();
  } catch (err) { toast('Файл не похож на бэкап этого приложения'); }
});

let resizeT; window.addEventListener('resize', () => { clearTimeout(resizeT); resizeT = setTimeout(() => { if (ui.tab === 'progress') mountChart(); }, 150); });
// При первом запуске подставляем стартовые данные (текущая программа + первый план).
// На claude.ai сначала читаем хранилище: данные там главнее копии в браузере.
async function boot() {
  if (IN_CLAUDE) {
    if (state) render(); else $('#app').innerHTML = '<div class="card empty"><p>Загружаю данные…</p></div>';
    let remote = null;
    try { remote = await cloudLoad(); } catch (e) { cloud.status = 'off'; }
    if (remote) { state = remote; safeSet(STORE_KEY, JSON.stringify(state)); }
    else if (cloud.status === 'ready' && state) cloudSchedule();   // хранилище пустое — переносим данные этого браузера
  }
  if (!state) { state = buildSeed(); save(); } else migrateSeedPlan();
  render();
  coachInit();
}
boot();
// Если прошлый автобэкап не дошёл (не было сети, закрыли вкладку) — досылаем.
if (ghOn() && gh.dirty) ghPush();
window.addEventListener('online', () => { if (ghOn() && gh.dirty) ghPush(); });
</script>
