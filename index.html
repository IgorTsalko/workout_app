<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Дневник тренировок</title>
<style>
:root {
  color-scheme: light;
  --bg: #f4f4f2;
  --surface: #fcfcfb;
  --surface-2: #efefec;
  --border: #dddcd7;
  --text: #0b0b0b;
  --text-2: #52514e;
  --muted: #8a8984;
  --accent: #2a78d6;
  --accent-ink: #ffffff;
  --accent-soft: #e3eefb;
  --good: #1f7a3a;
  --good-soft: #e2f3e6;
  --warn: #9a6400;
  --warn-soft: #fbf0d9;
  --bad: #c03a39;
  --bad-soft: #fbe5e5;
  --skip: #7a7974;
  --skip-soft: #ececea;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #121211;
    --surface: #1a1a19;
    --surface-2: #242423;
    --border: #34342f;
    --text: #ffffff;
    --text-2: #c3c2b7;
    --muted: #8f8e86;
    --accent: #3987e5;
    --accent-ink: #ffffff;
    --accent-soft: #1d2d42;
    --good: #5cc27a;
    --good-soft: #1b3123;
    --warn: #e0a83a;
    --warn-soft: #3a2f17;
    --bad: #e66767;
    --bad-soft: #3d1f1f;
    --skip: #a3a29a;
    --skip-soft: #2a2a28;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #121211; --surface: #1a1a19; --surface-2: #242423; --border: #34342f;
  --text: #ffffff; --text-2: #c3c2b7; --muted: #8f8e86;
  --accent: #3987e5; --accent-ink: #ffffff; --accent-soft: #1d2d42;
  --good: #5cc27a; --good-soft: #1b3123; --warn: #e0a83a; --warn-soft: #3a2f17;
  --bad: #e66767; --bad-soft: #3d1f1f; --skip: #a3a29a; --skip-soft: #2a2a28;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--text);
  font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
header.top {
  position: sticky; top: 0; z-index: 10;
  background: var(--surface); border-bottom: 1px solid var(--border);
}
.top-inner { max-width: 920px; margin: 0 auto; padding: 10px 16px 0; }
.brand { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.brand h1 { font-size: 18px; margin: 0; }
.brand .sub { color: var(--muted); font-size: 13px; }
nav.tabs { display: flex; gap: 2px; overflow-x: auto; margin-top: 8px; scrollbar-width: none; }
nav.tabs button {
  border: 0; background: none; color: var(--text-2); font: inherit;
  padding: 8px 12px; border-bottom: 2px solid transparent; cursor: pointer; white-space: nowrap;
}
nav.tabs button.active { color: var(--text); border-bottom-color: var(--accent); font-weight: 600; }
main { max-width: 920px; margin: 0 auto; padding: 16px; }
h2 { font-size: 20px; margin: 4px 0 12px; }
h3 { font-size: 16px; margin: 0 0 8px; }
.card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 14px 16px; margin-bottom: 12px;
}
.card.soft { background: var(--surface-2); }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.grow { flex: 1; }
.btn {
  border: 1px solid var(--border); background: var(--surface); color: var(--text);
  font: inherit; padding: 8px 14px; border-radius: 8px; cursor: pointer;
}
.btn:hover { border-color: var(--text-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.danger { color: var(--bad); }
.btn.sm { padding: 4px 10px; font-size: 13px; }
.btn.icon { padding: 4px 9px; }
input, textarea, select {
  font: inherit; color: var(--text); background: var(--surface);
  border: 1px solid var(--border); border-radius: 8px; padding: 7px 9px; width: 100%;
}
textarea { min-height: 70px; resize: vertical; }
input:focus, textarea:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
label.f { display: block; font-size: 13px; color: var(--text-2); margin-bottom: 10px; }
label.f > input, label.f > textarea, label.f > select { margin-top: 4px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 0 12px; }
.badge {
  display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 999px;
  background: var(--surface-2); color: var(--text-2); white-space: nowrap;
}
.badge.good { background: var(--good-soft); color: var(--good); }
.badge.warn { background: var(--warn-soft); color: var(--warn); }
.badge.skip { background: var(--skip-soft); color: var(--skip); }
.badge.accent { background: var(--accent-soft); color: var(--accent); }
.badge.bad { background: var(--bad-soft); color: var(--bad); }
.callout.warn { border-color: var(--warn); background: var(--warn-soft); }
.wish { padding: 8px 0; border-top: 1px solid var(--border); }
.wish:first-of-type { border-top: 0; }
.chk-line { display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--text-2); margin: -4px 0 10px; }
.chk-line input { width: 18px; height: 18px; }
.ex-card { display: grid; grid-template-columns: 34px 1fr; gap: 10px; padding: 12px 0; border-top: 1px solid var(--border); }
.ex-card:first-child { border-top: 0; }
.ex-num {
  width: 30px; height: 30px; border-radius: 50%; background: var(--accent-soft); color: var(--accent);
  display: grid; place-items: center; font-weight: 700; font-size: 14px;
}
.ex-name { font-weight: 600; font-size: 16px; flex: 1 1 200px; }
.ex-scheme { font-size: 22px; font-weight: 700; letter-spacing: -0.3px; margin: 2px 0; }
.ex-scheme .unit { font-size: 14px; font-weight: 500; color: var(--text-2); }
.badge.time { background: none; border: 1px solid var(--border); color: var(--text-2); margin-left: 6px; }
.ex-num.stage { background: var(--surface-2); font-size: 15px; }
.grp { margin-top: 6px; }
.grp-h { font-size: 11.5px; font-weight: 600; letter-spacing: .4px; text-transform: uppercase; color: var(--muted); }
.grp-h .rest { text-transform: none; letter-spacing: 0; font-weight: 500; color: var(--text-2); }
.grp-warm { font-size: 14px; color: var(--text-2); margin-top: 1px; }
.rest-after { margin-top: 8px; padding: 6px 10px; border-radius: 8px; background: var(--surface-2); font-size: 13px; color: var(--text-2); }
.rest-after b { color: var(--text); }
.ss-head { font-size: 13px; color: var(--text-2); margin: 2px 0 4px; }
.ss-part { display: grid; grid-template-columns: 28px 1fr; gap: 8px; background: var(--surface-2); border-left: 3px solid var(--accent); border-radius: 0 8px 8px 0; padding: 8px 10px; margin-top: 6px; }
.ss-label { width: 26px; height: 26px; border-radius: 6px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-weight: 700; font-size: 13px; }
.ss-part .ex-name { font-size: 15px; }
.ss-part .ex-scheme { font-size: 19px; }
.ss-link { font-size: 12.5px; color: var(--accent); padding: 4px 0 0 46px; }
.ss-tag { display: inline-block; font-size: 12px; font-weight: 600; color: var(--accent); margin-bottom: 4px; }
.set-dots { display: flex; gap: 4px; margin: 4px 0; }
.set-dots span { width: 22px; height: 6px; border-radius: 3px; background: var(--accent); opacity: .85; }
.callout { border-left: 3px solid var(--accent); padding: 8px 12px; background: var(--accent-soft); border-radius: 0 8px 8px 0; margin-bottom: 10px; }
.callout.good { border-color: var(--good); background: var(--good-soft); }
.callout h4 { margin: 0 0 4px; font-size: 13px; text-transform: uppercase; letter-spacing: .4px; color: var(--text-2); }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; flex-wrap: wrap; }
.seg button { border: 0; background: var(--surface); color: var(--text-2); font: inherit; padding: 8px 12px; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--border); }
.seg button.on { background: var(--accent); color: var(--accent-ink); }
.sets-table { width: 100%; border-collapse: collapse; margin-top: 6px; }
.sets-table th { font-size: 12px; font-weight: 500; color: var(--muted); text-align: left; padding: 2px 4px; }
.sets-table td { padding: 3px 4px; }
.sets-table td:first-child { width: 28px; color: var(--muted); font-size: 13px; }
.sets-table input { padding: 5px 7px; }
.sets-table td.chk { width: 32px; text-align: center; }
.sets-table input[type=checkbox] { width: 18px; height: 18px; }
.log-ex { border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; margin-bottom: 10px; background: var(--surface); }
.scale { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 4px; }
.scale button {
  min-width: 36px; padding: 6px 8px; border: 1px solid var(--border); background: var(--surface);
  border-radius: 6px; cursor: pointer; color: var(--text-2); font: inherit;
}
.scale button.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.hist-item { display: flex; gap: 12px; align-items: flex-start; }
.hist-date { min-width: 64px; text-align: center; }
.hist-date .d { font-size: 22px; font-weight: 700; line-height: 1; }
.hist-date .m { font-size: 12px; color: var(--muted); }
details summary { cursor: pointer; color: var(--text-2); font-size: 13px; }
pre.prompt {
  white-space: pre-wrap; word-break: break-word; background: var(--surface-2); border: 1px solid var(--border);
  border-radius: 8px; padding: 12px; max-height: 360px; overflow: auto; font-size: 12.5px;
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
.toast {
  position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%);
  background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 8px;
  font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 50; max-width: calc(100% - 32px);
}
.toast.show { opacity: 1; }
.empty { text-align: center; padding: 30px 16px; }
.empty p { color: var(--text-2); }
/* attendance */
.att { display: grid; grid-template-columns: 70px repeat(7, 1fr); gap: 4px; font-size: 12px; align-items: center; }
.att .h { color: var(--muted); text-align: center; }
.att .wk { color: var(--muted); }
.att .c {
  height: 30px; border-radius: 6px; background: var(--surface-2); display: grid; place-items: center;
  font-weight: 700; font-size: 13px; color: transparent;
}
.att .c.done { background: var(--good-soft); color: var(--good); }
.att .c.skipped { background: var(--skip-soft); color: var(--skip); }
.att .c.sick { background: var(--warn-soft); color: var(--warn); }
.att .c.today { outline: 2px solid var(--accent); outline-offset: -2px; }
.att .c.future { opacity: .4; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--text-2); margin-top: 10px; }
.legend i { display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: 4px; font-style: normal; font-weight: 700; font-size: 11px; margin-right: 5px; vertical-align: -3px; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 12px; }
.stat { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 14px; }
.stat .v { font-size: 24px; font-weight: 700; }
.stat .l { font-size: 12px; color: var(--muted); }
/* chart */
.chart-wrap { position: relative; }
.chart-wrap svg { width: 100%; height: auto; display: block; }
.chart-wrap .grid line { stroke: var(--border); stroke-width: 1; }
.chart-wrap .axis text { fill: var(--muted); font-size: 11px; }
.chart-wrap .line { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.chart-wrap .pt { fill: var(--accent); stroke: var(--surface); stroke-width: 2; }
.chart-wrap .cross { stroke: var(--text-2); stroke-width: 1; stroke-dasharray: 3 3; }
.tip {
  position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--border);
  border-radius: 8px; padding: 6px 10px; font-size: 12.5px; box-shadow: 0 4px 14px rgba(0,0,0,.12);
  white-space: nowrap; display: none; z-index: 5;
}
table.data { width: 100%; border-collapse: collapse; font-size: 13px; }
table.data th, table.data td { text-align: left; padding: 5px 6px; border-bottom: 1px solid var(--border); }
table.data th { color: var(--muted); font-weight: 500; }
@media print {
  :root { color-scheme: light; --bg: #fff; --surface: #fff; --surface-2: #f4f4f2; --text: #000; --text-2: #333; --muted: #666; --border: #ccc; }
  header.top, .no-print, .toast { display: none !important; }
  body { background: #fff; font-size: 12.5px; }
  main { max-width: none; padding: 0; }
  .card { border-color: #ccc; padding: 10px 12px; margin-bottom: 8px; }
  .card.soft, .callout { break-inside: avoid; }
  .ex-card { break-inside: avoid; padding: 8px 0; }
  .ex-scheme { font-size: 18px; }
  .callout { background: none !important; }
  .badge { border: 1px solid #ccc; background: none !important; }
}
@media (max-width: 560px) {
  .ex-scheme { font-size: 19px; }
  .hist-date { min-width: 48px; }
  .att { grid-template-columns: 52px repeat(7, 1fr); }
}
</style>
</head>
<body>
<header class="top">
  <div class="top-inner">
    <div class="brand">
      <h1>Дневник тренировок</h1>
      <span class="sub" id="brandSub"></span>
    </div>
    <nav class="tabs" id="tabs">
      <button data-tab="today">Сегодня</button>
      <button data-tab="history">История</button>
      <button data-tab="progress">Прогресс</button>
      <button data-tab="claude">Claude ⇄</button>
      <button data-tab="settings">Данные</button>
    </nav>
  </div>
</header>
<main id="app"></main>
<div class="toast" id="toast"></div>
<input type="file" id="fileInput" accept=".json,application/json" hidden>

<script>
'use strict';
/* =====================================================================
   Хранилище: localStorage (ключ STORE_KEY) + ручной бэкап в JSON-файл.
   ===================================================================== */
const STORE_KEY = 'workoutApp.v1';
const DRAFT_KEY = 'workoutApp.draft.v1';
const UI_KEY = 'workoutApp.ui.v1';

// Базовый профиль (приложение однопользовательское — меняется прямо здесь).
const PROFILE = {
  sex: 'мужчина',
  age: 32,
  height: 179,
  startWeight: 76,
  goal: 'Набор мышечной массы, дополнительный акцент на трапецию',
  experience: 'Не новичок: есть опыт тренировок, после перерыва вернулся и уже ~6 месяцев занимаюсь 2 раза в неделю. Плато: силовые показатели и вес тела не растут.',
  schedule: '2 тренировки в неделю, обычно вторник и пятница (изредка дни сдвигаются). Возможно, позже перейду на 3 тренировки в неделю.',
  daysPerWeek: 2,
  sessionMaxMinutes: 70,
  rest: 'Отдых между подходами ~2 мин, между упражнениями ~3 мин.',
  equipment: 'Тренажёрный зал: штанга, гантели, турник, брусья, блочные тренажёры, гак-машина.',
  limitations: 'Боли в пояснице. Приседания со штангой и румынскую тягу пока не делаю — заменил жимом в гак-машине. Избегать осевой нагрузки на позвоночник.'
};

function emptyState() {
  return { version: 2, plans: [], history: [], requests: [] };
}

function safeGet(key) { try { return localStorage.getItem(key); } catch (e) { return null; } }
function safeSet(key, val) {
  try { localStorage.setItem(key, val); return true; }
  catch (e) { toast('Не удалось сохранить в localStorage — сделайте бэкап в файл'); return false; }
}
function safeDel(key) { try { localStorage.removeItem(key); } catch (e) {} }

function loadState() {
  const raw = safeGet(STORE_KEY);
  if (!raw) return null;
  try {
    const s = JSON.parse(raw);
    delete s.profile;
    return { ...emptyState(), ...s };
  } catch (e) { return null; }
}

let state = loadState(); // null при первом запуске — заполняется стартовыми данными перед render()
function save() { safeSet(STORE_KEY, JSON.stringify(state)); }

let ui = { tab: 'today', promptCount: 6, progressEx: '' };
try { Object.assign(ui, JSON.parse(safeGet(UI_KEY) || '{}')); } catch (e) {}
function saveUi() { safeSet(UI_KEY, JSON.stringify(ui)); }

let draft = null;
try { draft = JSON.parse(safeGet(DRAFT_KEY) || 'null'); } catch (e) { draft = null; }
function saveDraft() { draft ? safeSet(DRAFT_KEY, JSON.stringify(draft)) : safeDel(DRAFT_KEY); }

/* =====================================================================
   Утилиты
   ===================================================================== */
const $ = (sel, root = document) => root.querySelector(sel);
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const pad = (n) => String(n).padStart(2, '0');
const isoDate = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const todayIso = () => isoDate(new Date());
const parseIso = (s) => { const [y, m, d] = String(s).split('-').map(Number); return new Date(y, (m || 1) - 1, d || 1); };
const addDays = (iso, n) => { const d = parseIso(iso); d.setDate(d.getDate() + n); return isoDate(d); };
const MONTHS = ['янв', 'фев', 'мар', 'апр', 'мая', 'июн', 'июл', 'авг', 'сен', 'окт', 'ноя', 'дек'];
const WEEKDAYS = ['вс', 'пн', 'вт', 'ср', 'чт', 'пт', 'сб'];
const fmtDate = (iso) => { const d = parseIso(iso); return `${d.getDate()} ${MONTHS[d.getMonth()]}, ${WEEKDAYS[d.getDay()]}`; };
const daysBetween = (a, b) => Math.round((parseIso(b) - parseIso(a)) / 86400000);
const num = (v) => { const n = parseFloat(String(v).replace(',', '.')); return Number.isFinite(n) ? n : null; };
const fmtW = (w) => (w === null || w === undefined || w === '') ? 'вес подобрать' : Number(w) === 0 ? 'собств. вес' : `${+Number(w).toFixed(2)} кг`;
// RPE храним в процентах от максимального усилия (100% — отказ).
const RPE_STEPS = [50, 60, 70, 80, 85, 90, 95, 100];
const fmtRpe = (v) => v ? `${v}%` : '';
const normRpe = (v) => { const n = num(v); if (n === null) return null; return n <= 10 ? Math.round(n * 10) : Math.round(n); };
const warmW = (w) => (w === null || w === undefined || w === '') ? 'лёгкий вес' : Number(w) === 0 ? 'б/в' : `${+w}`;
const fmtRest = (sec) => sec >= 60 ? `${Math.round(sec / 60 * 10) / 10} мин` : `${sec} сек`;
const unitLabel = (u) => u === 'sec' ? 'сек' : 'повт.';

const STATUS = {
  done: { label: 'Выполнена', cls: 'good', glyph: '✓' },
  skipped: { label: 'Пропущена', cls: 'skip', glyph: '–' },
  sick: { label: 'Болезнь / плохое самочувствие', cls: 'warn', glyph: '+' }
};

function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2600);
}
const currentPlan = () => state.plans[state.plans.length - 1] || null;
const sortedHistory = () => [...state.history].sort((a, b) => b.date.localeCompare(a.date) || (b.createdAt || '').localeCompare(a.createdAt || ''));

async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; }
  catch (e) {
    const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select();
    let ok = false; try { ok = document.execCommand('copy'); } catch (_) {}
    ta.remove(); return ok;
  }
}
function download(filename, data, type = 'text/plain') {
  const blob = data instanceof Blob ? data : new Blob([data], { type: type + ';charset=utf-8' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 0);
}

/* =====================================================================
   Навигация
   ===================================================================== */
function setTab(tab) { ui.tab = tab; saveUi(); render(); window.scrollTo(0, 0); }
$('#tabs').addEventListener('click', (e) => { const b = e.target.closest('button[data-tab]'); if (b) setTab(b.dataset.tab); });

function render() {
  if (ui.tab === 'log' && !(draft && draft.id)) ui.tab = 'claude';
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('active', b.dataset.tab === ui.tab));
  const active = $('#tabs button.active'); if (active) active.scrollIntoView({ block: 'nearest', inline: 'nearest' });
  const done = state.history.filter(h => h.status === 'done').length;
  const bw = latestBodyweight();
  $('#brandSub').textContent = `${done} трен. выполнено${bw ? ` · вес ${bw.value} кг` : ''}`;
  const views = { today: viewToday, log: viewLog, history: viewHistory, progress: viewProgress, claude: viewClaude, settings: viewSettings };
  $('#app').innerHTML = (views[ui.tab] || viewToday)();
  if (ui.tab === 'progress') mountChart();
}

/* =====================================================================
   Вкладка «Сегодня»
   ===================================================================== */
// Группирует подряд идущие одинаковые подходы: [{w:75,r:8},{w:75,r:8}] → [{w:75,r:8,n:2}]
function groupSets(list) {
  const out = [];
  for (const x of list) {
    const last = out[out.length - 1];
    if (last && last.weight === x.weight && String(last.reps) === String(x.reps)) last.n++;
    else out.push({ weight: x.weight, reps: x.reps, n: 1 });
  }
  return out;
}
const workSets = (ex) => Array.isArray(ex.sets_detail) && ex.sets_detail.length
  ? ex.sets_detail.filter(x => !x.warmup)
  : Array.from({ length: Math.max(1, Number(ex.sets) || 1) }, () => ({ weight: ex.weight, reps: ex.reps }));
const warmupSets = (ex) => Array.isArray(ex.sets_detail) ? ex.sets_detail.filter(x => x.warmup) : [];
// Суперсет — один пункт плана из нескольких частей (А, Б…), выполняемых подряд без отдыха.
const SS_LABELS = ['А', 'Б', 'В', 'Г'];
const isSuperset = (ex) => Array.isArray(ex.parts) && ex.parts.length > 0;
const supersetHead = (ex) => `${ex.sets || 1} ${plural(ex.sets || 1, 'круг', 'круга', 'кругов')}: ${ex.parts.map((_, j) => SS_LABELS[j]).join(' → ')} без отдыха${ex.rest_sec ? `, отдых ${fmtRest(ex.rest_sec)} между кругами` : ''}`;
function plural(n, one, few, many) { const m10 = n % 10, m100 = n % 100; return m10 === 1 && m100 !== 11 ? one : m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14) ? few : many; }
// Разминка и заминка — отдельные пункты плана с длительностью (kind: warmup / cooldown).
const isStage = (ex) => ex.kind === 'warmup' || ex.kind === 'cooldown';
const WARMUP_SET_REST = 60;   // отдых после разминочного подхода, сек
const SS_SWITCH = 15;         // переход между частями суперсета, сек
// Оценка времени одного подхода: ~3 сек на повтор + подготовка.
const workSec = (e, reps) => e.unit === 'sec' ? (firstNum(reps) || 30) + 10 : Math.min(90, Math.max(30, (firstNum(reps) || 10) * 3 + 10));
const fmtMin = (sec) => Math.round(sec / 60);
// Пункты плана по порядку с таймингом: start/end в секундах от начала тренировки и шаги (подходы/круги) с отдыхом.
function planItems(plan) {
  const list = [...(plan.exercises || [])];
  if (!list.some(e => e.kind === 'warmup') && plan.warmup) list.unshift({ kind: 'warmup', name: 'Разминка', duration_min: 5, notes: plan.warmup });
  if (!list.some(e => e.kind === 'cooldown') && plan.cooldown) list.push({ kind: 'cooldown', name: 'Заминка', duration_min: 5, notes: plan.cooldown });
  const transition = plan.rest_between_exercises_sec ?? 180;
  const strength = list.map((e, i) => isStage(e) ? -1 : i).filter(i => i >= 0);
  const lastStrength = strength[strength.length - 1];
  let t = 0, n = 0;
  const items = list.map((ex, i) => {
    const start = t;
    if (isStage(ex)) { t += (num(ex.duration_min) || 5) * 60; return { ex, num: null, start, end: t, steps: [] }; }
    n++;
    const after = i === lastStrength ? 0 : transition;
    const steps = [];
    let end = t;
    if (isSuperset(ex)) {
      const rounds = ex.sets || 1;
      const work = ex.parts.reduce((sum, p) => sum + workSec(p, p.reps), 0) + SS_SWITCH * (ex.parts.length - 1);
      for (let r = 0; r < rounds; r++) {
        const last = r === rounds - 1, rest = last ? after : (ex.rest_sec ?? 90);
        t += work; end = t; steps.push({ round: r + 1, rest, last }); t += rest;
      }
    } else {
      const sets = [...warmupSets(ex).map(x => ({ ...x, warmup: true })), ...workSets(ex)];
      sets.forEach((x, k) => {
        const last = k === sets.length - 1, rest = last ? after : x.warmup ? WARMUP_SET_REST : (ex.rest_sec ?? 90);
        t += workSec(ex, x.reps); end = t; steps.push({ set: x, rest, last }); t += rest;
      });
    }
    return { ex, num: n, start, end, steps };
  });
  items.forEach((it, i) => { it.next = items[i + 1] || null; });
  return { items, total: t };
}
const loadText = (e, x) => e.unit === 'sec' ? `${x.reps} сек${x.weight ? ` · ${+x.weight} кг` : ''}`
  : (x.weight === null || x.weight === undefined || x.weight === '') ? `? кг × ${x.reps}` : Number(x.weight) === 0 ? `${x.reps} повт.` : `${+x.weight} кг × ${x.reps}`;
// Отдых после последнего подхода/круга пункта (0 — дальше заминка или конец).
const restAfter = (it) => it.steps.length ? it.steps[it.steps.length - 1].rest : 0;
// Разминочные подходы одной строкой: «20×15 · 45×6 · 62.5×3».
const warmupLine = (ex) => warmupSets(ex).map(w => {
  const wt = w.weight === null || w.weight === undefined || w.weight === '' ? 'лёгкий вес × ' : Number(w.weight) === 0 ? 'б/в × ' : `${+w.weight}×`;
  return `${wt}${w.reps}${ex.unit === 'sec' ? ' сек' : ''}`;
}).join(' · ');
// Отдых между рабочими подходами — только если рабочих подходов больше одного.
const workRest = (ex) => ex.rest_sec && workSets(ex).length > 1 ? ex.rest_sec : 0;

// Плоский список упражнений плана: части суперсетов разворачиваются с меткой «5А», «5Б».
function flatExercises(plan) {
  const out = [];
  (plan.exercises || []).filter(ex => !isStage(ex)).forEach((ex, i) => {
    if (isSuperset(ex)) ex.parts.forEach((p, j) => out.push({ ex: { ...p, sets: ex.sets, rest_sec: p.rest_sec ?? ex.rest_sec }, tag: `${i + 1}${SS_LABELS[j]}`, ss: ex }));
    else out.push({ ex, tag: String(i + 1), ss: null });
  });
  return out;
}

// Схема подходов: разминочные одной строкой и рабочие крупно, у каждой группы — отдых между подходами.
function schemeHtml(ex, withRest = true) {
  const groups = groupSets(workSets(ex));
  const [main, ...rest] = groups.length ? groups : [{ n: ex.sets || 1, reps: ex.reps, weight: ex.weight }];
  const warm = warmupLine(ex), wr = withRest ? workRest(ex) : 0;
  const restTag = (sec) => sec ? ` <span class="rest">· отдых ${fmtRest(sec)}</span>` : '';
  return `${warm ? `<div class="grp"><div class="grp-h">Разминка${restTag(WARMUP_SET_REST)}</div><div class="grp-warm">${esc(warm)}</div></div>` : ''}
    <div class="grp">${warm || wr ? `<div class="grp-h">Рабочие${restTag(wr)}</div>` : ''}
    <div class="ex-scheme">${esc(main.n)} × ${esc(main.reps ?? '—')} <span class="unit">${unitLabel(ex.unit)}</span>
    <span class="unit">·</span> ${esc(fmtW(main.weight))}</div>
    ${rest.map(g => `<div class="small"><b>+ ${g.n} × ${esc(g.reps)}</b> · ${esc(fmtW(g.weight))}</div>`).join('')}</div>`;
}
function changeBadge(change) {
  if (!change) return '';
  const c = String(change).toLowerCase();
  let cls = 'accent';
  if (/^\+|нов|добав|увелич/.test(c)) cls = 'good';
  else if (/^[−-]|сниж|меньш|умень|облегч|разгруз/.test(c)) cls = 'warn';
  else if (/без изм/.test(c)) cls = '';
  return `<span class="badge ${cls}">${esc(change)}</span>`;
}

}

function metaLine(h) {

// «20кг×20 (разм.), 40кг×10 (разм.), 75кг×8 ×3» — одинаковые подряд подходы сворачиваются.
function setsLine(ex) {
  const u = ex.unit === 'sec' ? 'с' : '';
  const one = (s) => `${s.weight ? `${+s.weight}кг×` : ''}${s.reps ?? '?'}${u}${s.warmup ? ' (разм.)' : ''}${s.done === false ? ' (не вып.)' : ''}`;
  const out = [];
  for (const s of ex.sets) {
    const t = one(s), last = out[out.length - 1];
    if (last && last.t === t) last.n++; else out.push({ t, n: 1 });

  return out.map(x => x.n > 1 ? `${x.t} ×${x.n}` : x.t).join(', ');
}

function exerciseSeries(name) {
  return [...state.history].filter(h => h.status === 'done').sort((a, b) => a.date.localeCompare(b.date))
    .map(h => {
      const ex = (h.exercises || []).find(e => e.name === name); if (!ex) return null;
      const done = ex.sets.filter(isWork);
      if (!done.length) return null;
      const isSec = ex.unit === 'sec';
      const top = done.reduce((a, b) => ((b.weight || 0) > (a.weight || 0) || ((b.weight || 0) === (a.weight || 0) && (b.reps || 0) > (a.reps || 0))) ? b : a);
      const bw = !done.some(s => s.weight);
      return {
        date: h.date,
        value: (isSec || bw) ? Math.max(...done.map(s => s.reps || 0)) : top.weight,
        metric: isSec ? 'сек' : bw ? 'повт.' : 'кг',

}

function attendanceHtml(weeks) {

  for (let w = weeks - 1; w >= 0; w--) {

    html += `<div class="wk">${md.getDate()} ${MONTHS[md.getMonth()]}</div>`;
    for (let i = 0; i < 7; i++) {
      const day = addDays(mon, i);
      const st = byDate[day];
      const cls = ['c', st || '', day === today ? 'today' : '', day > today ? 'future' : ''].join(' ');
      html += `<div class="${cls}" title="${fmtDate(day)}${st ? ' — ' + STATUS[st].label : ''}">${st ? STATUS[st].glyph : ''}</div>`;

}

function mountChart() {
  const sel = $('#exSelect');
  if (sel) sel.onchange = () => { ui.progressEx = sel.value; saveUi(); render(); };
  const el = $('#chart'); if (!el) return;
  const data = seriesFor(ui.progressEx);
  if (data.length < 2) { el.innerHTML = `<p class="small muted">Для графика нужно минимум две записи${ui.progressEx === BODYWEIGHT ? ' с весом тела' : ' с этим упражнением'}.</p>`; return; }
  const W = Math.max(300, Math.round(el.clientWidth || 640)), H = Math.round(Math.min(260, Math.max(200, W * 0.45))), m = { l: 40, r: 14, t: 12, b: 26 };
  const t0 = parseIso(data[0].date).getTime(), t1 = parseIso(data[data.length - 1].date).getTime();
  const vals = data.map(d => d.value);
  let lo = Math.min(...vals), hi = Math.max(...vals);
  const padV = Math.max((hi - lo) * 0.15, 1); lo = Math.max(0, lo - padV); hi = hi + padV;
  const x = (d) => m.l + (t1 === t0 ? 0.5 : (parseIso(d).getTime() - t0) / (t1 - t0)) * (W - m.l - m.r);
  const y = (v) => m.t + (1 - (v - lo) / (hi - lo)) * (H - m.t - m.b);
  const ticks = niceTicks(lo, hi, 4);
  const pts = data.map(d => [x(d.date), y(d.value)]);
  const xIdx = data.length <= 6 ? data.map((_, i) => i) : [0, Math.floor(data.length / 3), Math.floor(2 * data.length / 3), data.length - 1];
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="График: ${esc(ui.progressEx)}">
    <g class="grid">${ticks.map(t => `<line x1="${m.l}" x2="${W - m.r}" y1="${y(t)}" y2="${y(t)}"/>`).join('')}</g>
    <g class="axis">${ticks.map(t => `<text x="${m.l - 6}" y="${y(t) + 4}" text-anchor="end">${+t.toFixed(1)}</text>`).join('')}
      ${xIdx.map(i => { const d = parseIso(data[i].date); return `<text x="${x(data[i].date)}" y="${H - 6}" text-anchor="middle">${d.getDate()} ${MONTHS[d.getMonth()]}</text>`; }).join('')}</g>
    <path class="line" d="${pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ')}"/>
    <line class="cross" id="cross" y1="${m.t}" y2="${H - m.b}" style="display:none"/>
    ${pts.map(p => `<circle class="pt" cx="${p[0]}" cy="${p[1]}" r="4.5"/>`).join('')}
    <rect id="hit" x="${m.l}" y="0" width="${W - m.l - m.r}" height="${H}" fill="transparent"/>
  </svg><div class="tip" id="tip"></div>`;
  const svg = el.querySelector('svg'), tip = $('#tip'), cross = $('#cross');
  const move = (clientX) => {
    const r = svg.getBoundingClientRect();
    const sx = (clientX - r.left) * (W / r.width);
    let bi = 0; pts.forEach((p, i) => { if (Math.abs(p[0] - sx) < Math.abs(pts[bi][0] - sx)) bi = i; });
    const p = pts[bi], d = data[bi];
    cross.setAttribute('x1', p[0]); cross.setAttribute('x2', p[0]); cross.style.display = '';
    tip.innerHTML = `<b>${fmtDate(d.date)}</b><br>${+d.value} ${d.metric}<br><span class="muted">${esc(d.detail)}</span>`;
    tip.style.display = 'block';
    const px = p[0] * r.width / W, py = p[1] * r.height / H;
    const tw = tip.offsetWidth;
    tip.style.left = Math.min(Math.max(0, px - tw / 2), r.width - tw) + 'px';
    tip.style.top = Math.max(0, py - tip.offsetHeight - 12) + 'px';
  };
  const hit = $('#hit');
  hit.addEventListener('mousemove', e => move(e.clientX));
  hit.addEventListener('touchstart', e => move(e.touches[0].clientX), { passive: true });
  hit.addEventListener('touchmove', e => move(e.touches[0].clientX), { passive: true });
  hit.addEventListener('mouseleave', () => { tip.style.display = 'none'; cross.style.display = 'none'; });
}
function niceTicks(lo, hi, n) {
  const span = hi - lo, raw = span / n, mag = Math.pow(10, Math.floor(Math.log10(raw)));

    // Номера те же, что на экране и в картинке плана: 1, 2…, части суперсета — 5А, 5Б.
    (plan.exercises || []).filter(ex => !isStage(ex)).forEach((ex, i) => {
      if (!isSuperset(ex)) return L.push(`${i + 1}. ${ex.name}: ${planLine(ex)}`);
      L.push(`${i + 1}. Суперсет${ex.name ? ` «${ex.name}»` : ''} (${supersetHead(ex)}):`);
      ex.parts.forEach((p, j) => L.push(`   ${i + 1}${SS_LABELS[j]}. ${p.name}: ${planLine({ ...p, sets: ex.sets, rest_sec: null })}`));
    });
    L.push('');
  }

  // Описание прошедшей тренировки свободным текстом — Claude разбирает его в completed_workout.
  const report = (ui.report || '').trim();
  if (report) {
    L.push(`## Как прошла тренировка (мой текст, как есть)`);
    L.push(`Пишу свободно. Номера упражнений — из последнего выданного плана выше (1, 2…, части суперсета 5А, 5Б).`);
    L.push('"""');
    L.push(report);
    L.push('"""');
    L.push('');
  }

  L.push(`## Последние записи: ${recent.length} (новые сверху)`);
  if (!recent.length) L.push('Записей пока нет — составь стартовый план.');
  for (const h of recent) {
    const st = STATUS[h.status];
    L.push(`### ${h.date} (${WEEKDAYS[parseIso(h.date).getDay()]}) — ${st.label}${h.title ? ` — «${h.title}»` : ''}`);
    const meta = [];
    if (h.wellbeing) meta.push(`самочувствие ${h.wellbeing}/5`);
    if (h.effort) meta.push(`общая тяжесть RPE ${fmtRpe(h.effort)}`);
    if (h.duration) meta.push(`длительность ${h.duration} мин`);
    if (h.sleep) meta.push(`сон ${h.sleep} ч`);
    if (h.bodyweight) meta.push(`вес тела ${h.bodyweight} кг`);
    if (meta.length) L.push(meta.join(', '));
    if (h.status === 'done') {
      for (const ex of h.exercises || []) {
        const pl = ex.planned ? `план ${ex.planned.text || `${ex.planned.sets}×${ex.planned.reps} @ ${fmtW(ex.planned.weight)}`} → ` : '';
        L.push(`- ${ex.superset ? `[суперсет ${ex.superset}] ` : ''}${ex.name}: ${pl}факт ${setsLine(ex)}${ex.rpe ? `; RPE ${fmtRpe(ex.rpe)}` : ''}${ex.notes ? ` | ${ex.notes}` : ''}`);
      }
    } else if (h.reason) L.push(`Причина: ${h.reason}`);
    if (h.notes) L.push(`Комментарий: ${h.notes}`);
    if (h.extras) L.push(`Уточнения: ${h.extras}`);
  }
  L.push('');

  // Сводка по всей истории — коротко, чтобы видеть тренд без лишних токенов.
  if (hist.length) {
    const first = hist[hist.length - 1].date;
    const c = (st) => hist.filter(h => h.status === st).length;
    L.push(`## Сводка по всей истории (с ${first})`);
    L.push(`- Всего записей: ${hist.length} (выполнено ${c('done')}, пропущено ${c('skipped')}, болезнь ${c('sick')})`);
    const mondayOffset = (parseIso(today).getDay() + 6) % 7;
    const thisMonday = addDays(today, -mondayOffset);
    const weeks = [];
    for (let w = 7; w >= 0; w--) {
      const mon = addDays(thisMonday, -7 * w), sun = addDays(mon, 6);
      const inW = hist.filter(h => h.date >= mon && h.date <= sun);
      if (sun < first) continue;
      const k = (st) => inW.filter(h => h.status === st).length;
      weeks.push(`${mon.slice(5)}: ${k('done')}✓${k('skipped') ? ` ${k('skipped')}пропуск` : ''}${k('sick') ? ` ${k('sick')}болезнь` : ''}`);
    }
    L.push(`- По неделям (пн, последние 8): ${weeks.join('; ')}`);
    L.push(`- Дней с последней записи: ${daysBetween(hist[0].date, today)}`);
    const bws = bodyweightSeries();
    if (bws.length) L.push(`- Вес тела: ${bws.map(x => `${x.date.slice(5)} ${x.value}`).slice(-8).join(', ')} кг`);
    const names = allExerciseNames();
    if (names.length) {
      L.push(`- Прогресс по упражнениям (лучший рабочий подход: первая → лучшая → последняя тренировка):`);
      for (const n of names) {
        const sr = exerciseSeries(n); if (!sr.length) continue;
        const best = sr.reduce((a, b) => b.value >= a.value ? b : a);
        L.push(`  - ${n}: ${sr[0].value} ${sr[0].metric} (${sr[0].date}) → ${best.value} ${best.metric} (${best.date}) → ${sr[sr.length - 1].value} ${sr[sr.length - 1].metric} (${sr[sr.length - 1].date}); раз выполнено: ${sr.length}`);
      }
    }
    if (older.length) L.push(`- Более старые записи (${older.length}) учтены только в этой сводке.`);
    L.push('');
  }

  // Пожелания: текущий запрос, пожелания из недавних записей и всё, на чём я настаивал раньше.
  const reqText = (ui.reqText || '').trim();
  // Новые — оставлены после выдачи текущего плана; уже учтённые без «настаиваю» больше не повторяем.
  const planAt = plan ? plan.createdAt || '' : '';
  const isNew = (h) => (h.createdAt || '') > planAt;
  const recentWishes = hist.filter(h => h.wishes && isNew(h));
  const insistedBefore = [
    ...hist.filter(h => h.wishes && h.insist && !isNew(h)).map(h => ({ date: h.date, text: h.wishes })),
    ...(state.requests || []).filter(r => r.insist).map(r => ({ date: r.date, text: r.text }))
  ].sort((a, b) => b.date.localeCompare(a.date)).slice(0, 10);
  L.push(`## Мои пожелания`);
  if (!reqText && !recentWishes.length && !insistedBefore.length) L.push('Особых пожеланий нет.');
  if (reqText) L.push(`- Сейчас ${ui.reqInsist ? '[НАСТАИВАЮ]' : '[пожелание]'}: ${reqText}`);
  recentWishes.forEach(h => L.push(`- После тренировки ${h.date} ${h.insist ? '[НАСТАИВАЮ]' : '[пожелание]'}: ${h.wishes}`));
  if (insistedBefore.length) {
    L.push(`- Ранее я настоял (действует, пока я не отменю):`);
    insistedBefore.forEach(x => L.push(`  - ${x.date}: ${x.text}`));
  }
  L.push('');

  L.push(`## Как принимать решения`);
  L.push(`Приоритеты по порядку:`);
  L.push(`1. Безопасность: поясница, восстановление, техника.`);
  L.push(`2. Эффективность для цели (масса): прогрессивная перегрузка, достаточный недельный объём на мышечную группу, частота ~2 раза в неделю, рабочие подходы близко к отказу (1–3 повтора в запасе), лимит времени.`);
  L.push(`3. Мои пожелания и ощущения.`);
  L.push(`Мои пожелания — это вводные, а не приказ. По каждому пожеланию:`);
  L.push(`- безопасно и не мешает прогрессу → примени;`);
  L.push(`- можно сделать лучше → примени в изменённом виде и объясни, что поменял и почему;`);
  L.push(`- неэффективно или небезопасно → НЕ применяй, прямо скажи об этом, объясни риск и предложи альтернативу;`);
  L.push(`- помечено [НАСТАИВАЮ] → примени, даже если не согласен, но обязательно предупреди о рисках и подскажи, как их снизить (вес, амплитуда, техника, замена части).`);
  L.push(`Не подстраивайся под мои ощущения в ущерб результату: если ощущения расходятся с цифрами (повторы, веса, RPE), опирайся на цифры и скажи об этом. Каждое пожелание отрази в wishes_review. Риски и важные замечания, которые видишь сам (даже если я не спрашивал), вынеси в warnings.`);
  L.push('');

  L.push(`## Что нужно от тебя`);
  if (report) L.push(`0. Разобрать мой текст «Как прошла тренировка» в запись completed_workout (см. формат ниже) и учесть её как последнюю тренировку во всём остальном ответе.`);
  L.push(`1. Короткий итог последней тренировки/периода: что получилось, что нет (2–4 предложения).`);
  L.push(`2. Короткую рекомендацию: что изменить и на что обратить внимание (2–4 предложения).`);
  L.push(`3. План следующей тренировки на ближайший тренировочный день (обычно вт или пт): упражнения, подходы, повторы, вес, отдых, целевое RPE, подсказки по технике.`);
  L.push(`Учитывай: цель — масса, у меня плато; прогрессию нагрузок (если все подходы выполнены с запасом — повышай вес или повторы, если не добраны — оставь или снизь); ограничения по пояснице (без осевой нагрузки); лимит ${P.sessionMaxMinutes} мин с учётом отдыха; после пропусков и болезни — плавный возврат; если сейчас болезнь — предложи отдых или восстановительную активность; вес тела и мои уточнения.`);
  L.push('');
  L.push(`## Формат ответа (строго)`);
  L.push(`Сначала можешь кратко написать текстом. Затем ОБЯЗАТЕЛЬНО один блок \`\`\`json со следующей структурой — я загружу его в приложение:`);
  L.push('```json');
  L.push(JSON.stringify({
    ...(report ? { completed_workout: {
      date: 'YYYY-MM-DD',
      status: 'done | skipped | sick',
      exercises: [
        { tag: '1', as_planned: true, rpe: 85, notes: '' },
        { tag: '2', rpe: 95, notes: 'последний подход тяжело', sets: [{ weight: 40, reps: 10, warmup: true }, { weight: 80, reps: 6 }, { weight: 80, reps: 6 }, { weight: 80, reps: 5 }] },
        { tag: '4', skipped: true, notes: 'не успел' },
        { tag: null, name: 'Упражнение не из плана', unit: 'reps', sets: [{ weight: 30, reps: 15 }, { weight: 30, reps: 15 }] }
      ],
      wellbeing: 4, effort: 85, duration: 65, sleep: 7, bodyweight: 76.4,
      notes: 'Ощущения за тренировку', extras: 'Питание, стресс, поясница', reason: '',
      wishes: 'Пожелания к следующей тренировке', insist: false,
      assumptions: ['Что пришлось додумать или что понял неоднозначно']
    } } : {}),
    summary: 'Итог прошедшей тренировки, 2–4 предложения',
    recommendation: 'Короткая рекомендация на следующую тренировку, 2–4 предложения',
    warnings: ['Риск или важное замечание, если есть (иначе пустой массив)'],
    wishes_review: [
      { wish: 'Что я просил (коротко)', decision: 'принято | изменено | не принято | принято по настоянию', reason: 'Почему; для «не принято» — альтернатива; для «по настоянию» — риски и как их снизить' }
    ],
    next_workout: {
      date: 'YYYY-MM-DD',
      title: 'Название, например «Вторник — грудь»',
      focus: 'Фокус тренировки',
      rest_between_exercises_sec: 180,
      exercises: [
        { kind: 'warmup', name: 'Разминка', duration_min: 5, notes: 'Что делать' },
        { name: 'Название упражнения', sets: 3, reps: '8-10', unit: 'reps', weight: 22, rest_sec: 120, rpe: 90, change: '+1 кг', notes: 'Подсказки по технике' },
        { name: 'Упражнение с разными подходами', sets: 4, reps: 6, unit: 'reps', weight: 77.5, rest_sec: 150, rpe: 90, change: '+2.5 кг',
          sets_detail: [{ weight: 40, reps: 10, warmup: true }, { weight: 77.5, reps: 6 }, { weight: 77.5, reps: 6 }, { weight: 77.5, reps: 6 }, { weight: 65, reps: 10 }],
          notes: '…' },
        { type: 'superset', name: 'Плечи + трапеция', rounds: 3, rest_sec: 90, change: '',
          parts: [
            { name: 'Первое упражнение суперсета', reps: '14-16', unit: 'reps', weight: 11, rpe: 90, change: '', notes: '…' },
            { name: 'Второе упражнение суперсета', reps: '12-15', unit: 'reps', weight: 24, rpe: 90, change: '', notes: '…' }

    }

  L.push('```');
  L.push(`Правила для JSON: weight — число в кг (0 = собственный вес, null = вес подобрать на месте; для гантелей — вес одной гантели); reps — число или строка-диапазон ("8-10"); unit — "reps" или "sec"; rpe — целевая тяжесть в процентах (50–100); rest_sec — отдых между подходами; суперсет — отдельный пункт с type "superset": rounds — число кругов, rest_sec — отдых после круга, parts — упражнения, которые делаются подряд без отдыха (в истории они помечены как «суперсет 5А/5Б»); sets_detail — необязательный полный список подходов, когда веса/повторы различаются или есть разминочные подходы (warmup: true), тогда sets = число рабочих подходов; change — коротко, что изменилось относительно прошлого раза ("+2.5 кг", "+1 повтор", "−1 подход", "новое", "без изменений"). Используй те же названия упражнений, что и в истории, чтобы я мог отслеживать прогресс. Разминка и заминка — первый и последний пункты exercises с kind "warmup"/"cooldown" и duration_min. Время тренировки приложение считает само: подход ≈ 3 сек на повтор + 10 сек (30–90 сек), разминочный подход + 1 мин отдыха, rest_sec между рабочими подходами, rest_between_exercises_sec между упражнениями, переход между частями суперсета 15 сек, плюс разминка и заминка. Подбирай подходы и отдых так, чтобы по этому расчёту тренировка укладывалась в лимит. wishes_review — по одному пункту на каждое моё пожелание (пустой массив, если пожеланий нет); decision — строго одно из четырёх значений.`);
  if (report) L.push(`Правила для completed_workout: это запись о тренировке из моего текста, приложение сохранит её в историю без ручной правки, поэтому ничего не выдумывай. date — дата тренировки (если не сказано, сегодня). status: "done" — тренировка была (хотя бы частично), "skipped" — пропуск, "sick" — болезнь; для skipped/sick причина в reason, exercises пустой. В exercises — каждое упражнение плана по номеру tag ("2", "5А"; у суперсета — каждая часть отдельно), название и план приложение подставит само по номеру. as_planned: true — сделано как в плане (и если я про упражнение ничего не сказал — тоже as_planned, но отметь это в assumptions). Если что-то отличалось — sets: полный список фактически сделанных подходов {weight, reps, warmup?, done?}, подходы, которые я не сделал, не включай. skipped: true — упражнение не делал. Упражнение не из плана — tag null и name (то же название, что в истории, если оно там есть). rpe — тяжесть упражнения в процентах, только если я её назвал или явно описал (например, «до отказа» = 100). wellbeing — самочувствие 1–5, effort — общая тяжесть тренировки в %, duration — минуты, sleep — часы сна, bodyweight — кг; чего нет в тексте — null. wishes — мои пожелания к следующей тренировке из текста, insist — true, только если я прямо настаиваю; эти пожелания тоже отрази в wishes_review. assumptions — всё, что пришлось додумать или что могло быть понято двояко (пустой массив, если всё ясно).`);
  return L.join('\n');
}

function extractJson(text) {
  const fences = [...text.matchAll(/```(?:json)?\s*([\s\S]*?)```/gi)].map(m => m[1]);
  const candidates = [...fences.reverse()];
  const a = text.indexOf('{'), b = text.lastIndexOf('}');
  if (a >= 0 && b > a) candidates.push(text.slice(a, b + 1));
  for (const c of candidates) {
    try { const o = JSON.parse(c.trim()); if (o && typeof o === 'object') return o; } catch (e) {}
  }
  return null;
}
function normalizePlan(o) {
  const nw = o.next_workout || o.nextWorkout || o.workout || (o.exercises ? o : null);
  if (!nw || !Array.isArray(nw.exercises) || !nw.exercises.length) throw new Error('В JSON нет next_workout.exercises');
  const weightOrNull = (v) => (v === null || v === undefined || v === '') ? null : num(v);
  return {
    id: uid(),
    createdAt: new Date().toISOString(),
    date: /^\d{4}-\d{2}-\d{2}$/.test(nw.date || '') ? nw.date : todayIso(),
    title: String(nw.title || 'Тренировка'),
    focus: nw.focus ? String(nw.focus) : '',
    duration_min: num(nw.duration_min),
    rest_between_exercises_sec: num(nw.rest_between_exercises_sec),
    summary: o.summary ? String(o.summary) : '',
    recommendation: o.recommendation ? String(o.recommendation) : '',
    warnings: Array.isArray(o.warnings) ? o.warnings.filter(Boolean).map(String) : (o.warnings ? [String(o.warnings)] : []),
    wishes_review: Array.isArray(o.wishes_review) ? o.wishes_review.filter(w => w && w.wish).map(w => ({ wish: String(w.wish), decision: String(w.decision || ''), reason: w.reason ? String(w.reason) : '' })) : [],
    notes: nw.notes ? String(nw.notes) : '',
    exercises: [
      ...(nw.warmup && !nw.exercises.some(e => e.kind === 'warmup') ? [{ kind: 'warmup', name: 'Разминка', duration_min: 5, notes: String(nw.warmup) }] : []),
      ...nw.exercises.map(function normEx(ex) {
      if (ex.kind === 'warmup' || ex.kind === 'cooldown') {
        return { kind: ex.kind, name: String(ex.name || (ex.kind === 'warmup' ? 'Разминка' : 'Заминка')), duration_min: num(ex.duration_min) || 5, notes: ex.notes ? String(ex.notes) : '' };
      }
      const parts = Array.isArray(ex.parts) ? ex.parts : Array.isArray(ex.superset) ? ex.superset : null;
      if (parts && parts.length) {
        const rounds = Math.max(1, parseInt(ex.rounds ?? ex.sets, 10) || 1);
        return {
          type: 'superset',
          name: ex.name ? String(ex.name) : '',
          sets: rounds,
          rest_sec: num(ex.rest_sec),
          change: ex.change ? String(ex.change) : '',
          notes: ex.notes ? String(ex.notes) : '',
          parts: parts.map(p => ({ ...normEx({ ...p, sets: rounds, sets_detail: null }), sets: rounds, rest_sec: null }))
        };
      }
      const detail = Array.isArray(ex.sets_detail) && ex.sets_detail.length
        ? ex.sets_detail.map(x => ({ weight: weightOrNull(x.weight), reps: x.reps ?? '', ...(x.warmup ? { warmup: true } : {}) }))
        : null;
      return {
        name: String(ex.name || 'Упражнение'),
        sets: detail ? Math.max(1, detail.filter(x => !x.warmup).length) : Math.max(1, parseInt(ex.sets, 10) || 1),
        reps: ex.reps ?? '',
        unit: ex.unit === 'sec' ? 'sec' : 'reps',
        weight: weightOrNull(ex.weight),
        rest_sec: num(ex.rest_sec),
        rpe: normRpe(ex.rpe),
        change: ex.change ? String(ex.change) : '',
        notes: ex.notes ? String(ex.notes) : '',
        ...(detail ? { sets_detail: detail } : {})
      };
    }),
      ...(nw.cooldown && !nw.exercises.some(e => e.kind === 'cooldown') ? [{ kind: 'cooldown', name: 'Заминка', duration_min: 5, notes: String(nw.cooldown) }] : [])
    ]
  };
}
// completed_workout из ответа Claude → запись истории. Упражнения плана находятся по номеру (tag),
// «как в плане» разворачивается в подходы плана, чтобы Claude не переписывал цифры.
function normalizeLog(c, plan) {
  const status = STATUS[c.status] ? c.status : 'done';
  const byTag = Object.fromEntries((plan ? flatExercises(plan) : []).map(f => [f.tag, f]));
  const tagKey = (t) => String(t ?? '').trim().toUpperCase().replace(/^(\d+)\s*/, '$1')
    .replace(/A/g, 'А').replace(/B/g, 'Б').replace(/V/g, 'В').replace(/G/g, 'Г');
  const plannedSets = (ex) => [...warmupSets(ex).map(w => ({ ...w, warmup: true })), ...workSets(ex)];
  const toSet = (x, done = true) => ({ reps: firstNum(x.reps), weight: num(x.weight) ?? 0, done: done && x.done !== false, ...(x.warmup ? { warmup: true } : {}) });
  // Номер целого суперсета («4») разворачиваем в его части (4А, 4Б) с теми же данными.
  const items = (Array.isArray(c.exercises) ? c.exercises : []).flatMap(e => {
    const k = tagKey(e.tag);
    if (!k || byTag[k] || !byTag[k + SS_LABELS[0]]) return [e];
    return SS_LABELS.filter(l => byTag[k + l]).map(l => ({ ...e, tag: k + l, sets: null }));
  });
  const exercises = status !== 'done' ? [] : items.map(e => {
    const base = byTag[tagKey(e.tag)] || null;
    const name = String((base && base.ex.name) || e.name || '').trim();
    if (!name) return null;
    const own = Array.isArray(e.sets) && e.sets.length ? e.sets : null;
    const sets = e.skipped ? (base ? plannedSets(base.ex).map(x => toSet(x, false)) : [])
      : own ? own.map(x => toSet(x)) : base ? plannedSets(base.ex).map(x => toSet(x)) : [];
    if (!sets.length) return null;
    return {
      name, unit: e.unit === 'sec' || (base && base.ex.unit === 'sec') ? 'sec' : 'reps',
      planned: base ? { text: planText(base.ex), rpe: base.ex.rpe ?? null } : null,
      ...(base && base.ss ? { superset: base.tag } : {}),
      rpe: normRpe(e.rpe), sets, notes: [e.skipped ? 'не выполнял' : '', e.notes ? String(e.notes).trim() : ''].filter(Boolean).join('; ')
    };
  }).filter(Boolean);
  if (status === 'done' && !exercises.length) throw new Error('В completed_workout нет упражнений');
  const wellbeing = num(c.wellbeing);
  const wishes = c.wishes ? String(c.wishes).trim() : '';
  return {
    id: uid(), createdAt: new Date().toISOString(),
    date: /^\d{4}-\d{2}-\d{2}$/.test(c.date || '') ? c.date : todayIso(),
    status, planId: plan ? plan.id : null, title: String(c.title || (plan && plan.title) || 'Тренировка'),
    wellbeing: wellbeing >= 1 && wellbeing <= 5 ? Math.round(wellbeing) : null,
    notes: c.notes ? String(c.notes).trim() : '', bodyweight: num(c.bodyweight), extras: c.extras ? String(c.extras).trim() : '',
    wishes, insist: !!(c.insist && wishes),
    ...(status === 'done'
      ? { exercises, effort: normRpe(c.effort), duration: num(c.duration), sleep: num(c.sleep) }
      : { reason: c.reason ? String(c.reason).trim() : '' }),
    report: (ui.report || '').trim(),
    assumptions: [...(Array.isArray(c.assumptions) ? c.assumptions : []), ...(Array.isArray(c.questions) ? c.questions : [])].filter(Boolean).map(String)
  };
}
function importPlan() {
  const text = $('#importText').value.trim();
  const msg = $('#importMsg');
  if (!text) { msg.textContent = 'Поле пустое'; return; }
  const o = extractJson(text);
  if (!o) { msg.textContent = 'Не нашёл корректный JSON в тексте. Попросите Claude вернуть блок ```json.'; return; }
  try {
    // Сначала тренировка: её номера относятся к плану, который был текущим до этого ответа.
    const c = o.completed_workout || o.completedWorkout;
    const entry = c ? normalizeLog(c, currentPlan()) : null;
    const plan = o.next_workout || o.nextWorkout || o.workout || o.exercises || !entry ? normalizePlan(o) : null;
    if (ui.lastImport === text && !confirm('Этот ответ уже загружен. Загрузить ещё раз? (Запись и план продублируются.)')) return;
    ui.lastImport = text;
    if (entry) { state.history.push(entry); ui.report = ''; }
    saveUi();
    if (!plan) {
      save();
      toast('Тренировка записана в историю');
      setTab('history');
      return;
    }
    const req = (ui.reqText || '').trim();
    if (req) {
      plan.request = { text: req, insist: !!ui.reqInsist };
      state.requests = [...(state.requests || []), { date: todayIso(), text: req, insist: !!ui.reqInsist }];
      ui.reqText = ''; ui.reqInsist = false; saveUi();
    }
    state.plans.push(plan); save();
    if (draft && !draft.id) { draft = null; saveDraft(); }
    toast(entry ? 'Тренировка записана, новый план загружен' : 'План загружен');
    setTab(entry && entry.assumptions.length ? 'history' : 'today');
  } catch (e) { msg.textContent = e.message; }
}

    notes: 'Жим гантелей сидя заменён шрагами: в жиме трапеция работает лишь как помощник, а шраги нагружают её напрямую. Передняя дельта и так много работает в двух жимах. Гиперэкстензия перенесена в разминку, а трицепс и пресс объединены в суперсет: так тренировка укладывается в 70 минут при отдыхе 3 мин между упражнениями. Время каждого упражнения указано в карточке; если отстаёте от графика, сократите отдых в суперсетах до 1 минуты. Пятница (ориентир, точный план — после этой тренировки): подтягивания, тяга верхнего блока, тяга нижнего блока к поясу (средняя часть трапеции), сгибания ног в тренажёре, жим в хаммере или отжимания на брусьях, разведения в стороны + шраги, бицепс, пресс. Подходов будет меньше, чтобы уложиться в 70 минут.'
  };
  return { version: 2, plans: [plan], history };
}

/* =====================================================================
   Экспорт плана на сегодня: PNG (canvas), печать/PDF, текст
   ===================================================================== */
const planFileName = (ext) => { const p = currentPlan(); return `workout-${p && p.date ? p.date : todayIso()}.${ext}`; };
function canShareFiles() {
  try { return !!(navigator.canShare && navigator.canShare({ files: [new File([''], 'x.png', { type: 'image/png' })] })); }
  catch (e) { return false; }
}
function planAsText(plan) {
  const { items, total } = planItems(plan);
  const L = [`🏋️ ${plan.title || 'Тренировка'}${plan.date ? ` — ${fmtDate(plan.date)}` : ''}`];
  L.push([plan.focus, `~${fmtMin(total)} мин`].filter(Boolean).join(' · '));
  if (plan.recommendation) L.push('', `💡 ${plan.recommendation}`);
  (plan.warnings || []).forEach((w, k) => { if (!k) L.push(''); L.push(`⚠ ${w}`); });
  for (const it of items) {
    const ex = it.ex, when = `[${fmtMin(it.start)}–${fmtMin(it.end)} мин]`;
    L.push('');
    if (isStage(ex)) {
      L.push(`${ex.kind === 'warmup' ? '🔥' : '🧘'} ${ex.name || (ex.kind === 'warmup' ? 'Разминка' : 'Заминка')} ${when}`);
      if (ex.notes) L.push(`   ${ex.notes}`);
      continue;
    }
    if (isSuperset(ex)) {
      L.push(`${it.num}. Суперсет${ex.name ? `: ${ex.name}` : ''} ${when}${ex.change ? ` [${ex.change}]` : ''}`);
      ex.parts.forEach((p, j) => {
        L.push(`   ${SS_LABELS[j]}) ${p.name}${p.change ? ` [${p.change}]` : ''}${p.rpe ? ` · RPE ${fmtRpe(p.rpe)}` : ''}`);
        if (p.notes) L.push(`      ${p.notes}`);
      });
      L.push(`   ${'☐'.repeat(ex.sets || 1)} ${supersetHead(ex)}`);
    } else {
      L.push(`${it.num}. ${ex.name} ${when}${ex.change ? ` [${ex.change}]` : ''}${ex.rpe ? ` · RPE ${fmtRpe(ex.rpe)}` : ''}`);
    }
    if (!isSuperset(ex)) {
      // Чекбокс на каждый подход, одинаковые подряд подходы — в одной строке: «☐☐☐ 77.5 кг × 6».
      const boxes = (g) => `${'☐'.repeat(g.n)} ${loadText(ex, g)}`;
      if (warmupSets(ex).length) L.push(`   Разминка (отдых ${fmtRest(WARMUP_SET_REST)}): ${groupSets(warmupSets(ex)).map(boxes).join(', ')}`);
      const wr = workRest(ex);
      L.push(`   ${warmupSets(ex).length || wr ? `Рабочие${wr ? ` (отдых ${fmtRest(wr)})` : ''}: ` : ''}${groupSets(workSets(ex)).map(boxes).join(', ')}`);
    }
    if (ex.notes) L.push(`   ${ex.notes}`);
    if (restAfter(it)) L.push(`   ⏸ Отдых ${fmtRest(restAfter(it))}`);
  }
  if (plan.notes) L.push('', `📝 ${plan.notes}`);
  return L.join('\n');
}

// Рисуем план на canvas вручную — без внешних библиотек, работает офлайн.
function planImageBlob(plan) {
  const timeline = planItems(plan);
  const W = 1080, PAD = 56, SCALE = 1;
  const C = { bg: '#f4f4f2', card: '#ffffff', border: '#dddcd7', text: '#0b0b0b', text2: '#52514e', muted: '#8a8984',
    accent: '#2a78d6', accentSoft: '#e3eefb', good: '#1f7a3a', goodSoft: '#e2f3e6', warn: '#9a6400', warnSoft: '#fbf0d9' };
  const FONT = 'system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d');
  const font = (size, weight = 400) => `${weight} ${size}px ${FONT}`;
  const wrap = (text, size, weight, maxW) => {
    ctx.font = font(size, weight);
    const out = [];
    for (const para of String(text).split('\n')) {
      let line = '';
      for (const word of para.split(/\s+/)) {
        const test = line ? `${line} ${word}` : word;
        if (ctx.measureText(test).width > maxW && line) { out.push(line); line = word; } else line = test;
      }
      out.push(line);
    }
    return out;
  };
  const roundRect = (x, y, w, h, r, fill, stroke) => {
    ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
    if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = 2; ctx.stroke(); }
  };
  const badgeColors = (change) => {
    const c = String(change).toLowerCase();
    if (/^\+|нов|добав|увелич/.test(c)) return [C.goodSoft, C.good];
    if (/^[−-]|сниж|меньш|умень|облегч|разгруз/.test(c)) return [C.warnSoft, C.warn];
    return [C.accentSoft, C.accent];
  };

  // Один проход раскладки: draw=false только считает высоту.
  const layout = (draw) => {
    let y = PAD;
    const inner = W - PAD * 2;
    const text = (str, size, weight, color, x, maxW, lh = 1.35) => {
      const lines = wrap(str, size, weight, maxW);
      if (draw) { ctx.font = font(size, weight); ctx.fillStyle = color; ctx.textBaseline = 'top'; lines.forEach((l, i) => ctx.fillText(l, x, y + i * size * lh)); }
      y += lines.length * size * lh;
    };
    // Заголовок
    text(plan.title || 'Тренировка', 54, 700, C.text, PAD, inner, 1.2);
    y += 8;
    const meta = [plan.date ? fmtDate(plan.date) : '', `~${fmtMin(timeline.total)} мин`,
      plan.rest_between_exercises_sec ? `${fmtRest(plan.rest_between_exercises_sec)} между упражнениями` : ''].filter(Boolean).join('  ·  ');
    if (meta) text(meta, 28, 500, C.accent, PAD, inner);
    if (plan.focus) { y += 4; text(plan.focus, 26, 400, C.text2, PAD, inner); }
    y += 28;
    // Блоки-подсказки
    const callout = (title, body, soft, line) => {
      const pad = 24, w = inner - pad * 2 - 8;
      const h = pad * 2 + 30 + wrap(body, 27, 400, w).length * 27 * 1.4;
      if (draw) { roundRect(PAD, y, inner, h, 18, soft); ctx.fillStyle = line; ctx.fillRect(PAD, y + 12, 6, h - 24); }
      const y0 = y; y += pad;
      text(title.toUpperCase(), 20, 700, C.text2, PAD + pad + 8, w);
      y += 6;
      text(body, 27, 400, C.text, PAD + pad + 8, w, 1.4);
      y = y0 + h + 18;
    };
    if (plan.recommendation) callout('Рекомендация', plan.recommendation, C.accentSoft, C.accent);
    if (plan.warnings && plan.warnings.length) callout('⚠ Важно', plan.warnings.map(w => `• ${w}`).join('\n'), C.warnSoft, C.warn);
    // «Перо»: рисует (d=true) или только меряет (d=false) блоки, начиная с высоты startY.
    const pen = (d, startY) => {
      const P = { y: startY };
      P.T = (str, size, weight, color, tx, maxW, lh = 1.35) => {
        const lines = wrap(str, size, weight, maxW);
        if (d) { ctx.font = font(size, weight); ctx.fillStyle = color; ctx.textBaseline = 'top'; lines.forEach((l, k) => ctx.fillText(l, tx, P.y + k * size * lh)); }
        P.y += lines.length * size * lh;
      };
      P.badge = (change, right) => {
        if (!change) return 0;
        ctx.font = font(22, 600); const bw = ctx.measureText(change).width + 32;
        if (d) { const [bg, fg] = badgeColors(change); roundRect(right - bw, P.y, bw, 38, 19, bg); ctx.font = font(22, 600); ctx.fillStyle = fg; ctx.textBaseline = 'middle'; ctx.fillText(change, right - bw + 16, P.y + 20); }
        return bw;
      };
      P.scheme = (e, tx, maxW, withRest = true) => {
        const warm = warmupLine(e), wr = withRest ? workRest(e) : 0;
        const head = (label, sec) => {
          if (d) {
            ctx.textBaseline = 'top'; ctx.font = font(19, 700); ctx.fillStyle = C.muted; ctx.fillText(label, tx, P.y + 3);
            if (sec) { const lw = ctx.measureText(label).width; ctx.font = font(22, 500); ctx.fillStyle = C.text2; ctx.fillText(` · отдых ${fmtRest(sec)}`, tx + lw, P.y); }
          }
          P.y += 32;
        };
        if (warm) { head('РАЗМИНКА', WARMUP_SET_REST); P.T(warm, 25, 500, C.text2, tx, maxW); P.y += 8; }
        if (warm || wr) head('РАБОЧИЕ', wr);
        groupSets(workSets(e)).forEach((g, gi) => {
          const big = gi === 0;
          const main = `${big ? '' : '+ '}${g.n} × ${g.reps}`, unit = ` ${unitLabel(e.unit)} · `, wt = fmtW(g.weight);
          if (d) {
            ctx.textBaseline = 'top'; let cx = tx;
            ctx.font = font(big ? 40 : 28, 700); ctx.fillStyle = C.text; ctx.fillText(main, cx, P.y); cx += ctx.measureText(main).width;
            ctx.font = font(big ? 25 : 22, 500); ctx.fillStyle = C.text2; ctx.fillText(unit, cx, P.y + (big ? 11 : 4)); cx += ctx.measureText(unit).width;
            ctx.font = font(big ? 40 : 28, 700); ctx.fillStyle = C.text; ctx.fillText(wt, cx, P.y);
          }
          P.y += big ? 48 : 36;
        });
      };
      // Плашка «Отдых N мин» после последнего подхода/круга.
      P.rest = (it, tx, maxW) => {
        const sec = restAfter(it);
        if (!sec) return;
        P.y += 12;
        if (d) {
          roundRect(tx, P.y, maxW, 48, 12, '#efefec');
          ctx.textBaseline = 'middle'; ctx.font = font(24, 500); ctx.fillStyle = C.text2; const lbl = '⏸ Отдых ';
          ctx.fillText(lbl, tx + 16, P.y + 25); const lw = ctx.measureText(lbl).width;
          ctx.font = font(24, 700); ctx.fillStyle = C.text; ctx.fillText(fmtRest(sec), tx + 16 + lw, P.y + 25);
        }
        P.y += 48;
      };
      P.meta = (str, tx) => {
        if (!str) return;
        if (d) { ctx.font = font(23, 500); ctx.fillStyle = C.muted; ctx.textBaseline = 'top'; ctx.fillText(str, tx, P.y + 2); }
        P.y += 34;
      };
      return P;
    };
    // Упражнения
    timeline.items.forEach((it) => {
      const ex = it.ex;
      const pad = 28, x = PAD + pad + 70, w = inner - pad * 2 - 70, right = PAD + inner - pad;
      const y0 = y;
      const when = `⏱ ${fmtMin(it.start)}–${fmtMin(it.end)} мин`;
      const card = (d) => {
        const P = pen(d, y0 + pad);
        if (isStage(ex)) {
          P.T(`${ex.name || (ex.kind === 'warmup' ? 'Разминка' : 'Заминка')} · ${num(ex.duration_min) || 5} мин`, 34, 700, C.text, x, w, 1.25); P.y += 4;
          P.T(when, 23, 600, C.accent, x, w); P.y += 6;
          if (ex.notes) P.T(ex.notes, 24, 400, C.text2, x, w, 1.4);
          return P.y + pad;
        }
        if (!isSuperset(ex)) {
          const bw = P.badge(ex.change, right);
          P.T(ex.name, 34, 700, C.text, x, w - bw - 12, 1.25); P.y += 4;
          P.T(when + (ex.rpe ? `  ·  RPE ${fmtRpe(ex.rpe)}` : ''), 23, 600, C.accent, x, w); P.y += 8;
          P.scheme(ex, x, w);
          if (ex.notes) { P.y += 8; P.T(ex.notes, 24, 400, C.text2, x, w, 1.4); }
          P.rest(it, x, w);
          return P.y + pad;
        }
        const bw = P.badge(ex.change, right);
        P.T(`Суперсет${ex.name ? `: ${ex.name}` : ''}`, 34, 700, C.text, x, w - bw - 12, 1.25); P.y += 4;
        P.T(when, 23, 600, C.accent, x, w); P.y += 4;
        P.T(`↻ ${supersetHead(ex)}`, 23, 600, C.accent, x, w); P.y += 10;
        ex.parts.forEach((part, j) => {
          if (j) { P.y += 4; P.T('↓ сразу, без отдыха', 22, 600, C.accent, x + 14, w); P.y += 4; }
          const px = x + 66, pw = w - 66 - 18;
          const partBox = (dd, sy) => {
            const Q = pen(dd, sy + 18);
            const pbw = Q.badge(part.change, x + w - 18);
            Q.T(part.name, 29, 700, C.text, px, pw - pbw - 10, 1.25); Q.y += 6;
            Q.scheme({ ...part, sets: ex.sets }, px, pw, false);
            Q.meta(part.rpe ? `RPE ${fmtRpe(part.rpe)}` : '', px);
            if (part.notes) { Q.y += 4; Q.T(part.notes, 23, 400, C.text2, px, pw, 1.4); }
            return Q.y + 18;
          };
          const sy = P.y, end = partBox(false, sy);
          if (d) {
            roundRect(x, sy, w, end - sy, 14, '#efefec');
            ctx.fillStyle = C.accent; ctx.fillRect(x, sy + 10, 6, end - sy - 20);
            roundRect(x + 18, sy + 18, 34, 34, 8, C.accent);
            ctx.font = font(22, 700); ctx.fillStyle = '#ffffff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText(SS_LABELS[j], x + 35, sy + 36); ctx.textAlign = 'left';
            partBox(true, sy);
          }
          P.y = end;
        });
        if (ex.notes) { P.y += 8; P.T(ex.notes, 24, 400, C.text2, x, w, 1.4); }
        P.rest(it, x, w);
        return P.y + pad;
      };
      const h = card(false) - y0;
      if (draw) {
        roundRect(PAD, y0, inner, h, 20, C.card, C.border);
        ctx.beginPath(); ctx.arc(PAD + pad + 26, y0 + pad + 24, 26, 0, Math.PI * 2); ctx.fillStyle = C.accentSoft; ctx.fill();
        ctx.font = font(26, 700); ctx.fillStyle = C.accent; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(it.num ? String(it.num) : ex.kind === 'warmup' ? '🔥' : '🧘', PAD + pad + 26, y0 + pad + 25); ctx.textAlign = 'left';
        card(true);
      }
      y = y0 + h + 16;
    });
    y += 6;
    if (plan.notes) callout('Заметки', plan.notes, '#efefec', C.muted);
    text(`Дневник тренировок · ${todayIso()}`, 20, 400, C.muted, PAD, inner);
    return y + PAD;
  };

  canvas.width = W; canvas.height = 100;
  const H = Math.ceil(layout(false));
  canvas.width = W * SCALE; canvas.height = H * SCALE;
  ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);
  layout(true);
  return new Promise(res => canvas.toBlob(res, 'image/png'));
}

/* =====================================================================
   Обработчики событий (делегирование)
   ===================================================================== */
document.addEventListener('click', async (e) => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act;
  const i = b.dataset.ex !== undefined ? +b.dataset.ex : null;
  const j = b.dataset.set !== undefined ? +b.dataset.set : null;
  switch (act) {
    case 'goto': setTab(b.dataset.tab); break;
    case 'set-status':
      draft.status = b.dataset.status;
      if (draft.status === 'done' && !draft.exercises.length) {
        const fresh = newDraftFromPlan('done'); draft.exercises = fresh.exercises;
      }
      saveDraft(); render(); break;
    case 'scale': { const v = +b.dataset.v; draft[b.dataset.f] = draft[b.dataset.f] === v ? null : v; saveDraft(); render(); break; }
    case 'add-ex': draft.exercises.push({ name: '', unit: 'reps', planned: null, sets: [{ reps: null, weight: 0, done: true }], notes: '' }); saveDraft(); render(); break;
    case 'del-ex': draft.exercises.splice(i, 1); saveDraft(); render(); break;
    case 'add-set': { const s = draft.exercises[i].sets; const last = s[s.length - 1] || { reps: null, weight: 0 }; s.push({ reps: last.reps, weight: last.weight, done: true, warmup: false }); saveDraft(); render(); break; }
    case 'del-set': draft.exercises[i].sets.splice(j, 1); if (!draft.exercises[i].sets.length) draft.exercises.splice(i, 1); saveDraft(); render(); break;
    case 'save-log': saveLog(); break;
    case 'reset-draft':
      draft = null; saveDraft(); setTab('history'); break;
    case 'edit-entry': {
      const h = state.history.find(x => x.id === b.dataset.id); if (!h) break;
      draft = JSON.parse(JSON.stringify({ exercises: [], wellbeing: null, effort: null, duration: '', sleep: '', bodyweight: '', notes: '', extras: '', wishes: '', insist: false, reason: '', ...h }));
      saveDraft(); setTab('log'); break;
    }
    case 'del-entry':
      if (confirm('Удалить запись?')) { state.history = state.history.filter(x => x.id !== b.dataset.id); save(); render(); }
      break;
    case 'copy-prompt': toast(await copyText(buildPrompt(ui.promptCount)) ? 'Prompt скопирован — вставьте его в чат Claude' : 'Не удалось скопировать — выделите текст вручную'); break;
    case 'dl-prompt': download(`workout-prompt-${todayIso()}.md`, buildPrompt(ui.promptCount), 'text/markdown'); break;
    case 'import-plan': importPlan(); break;
    case 'cancel-insist': {
      if (b.dataset.kind === 'entry') { const h = state.history.find(x => x.id === b.dataset.id); if (h) h.insist = false; }
      else { const r = (state.requests || [])[+b.dataset.id]; if (r) r.insist = false; }
      save(); toast('Требование отменено'); render(); break;
    }
    case 'plan-png': {
      const blob = await planImageBlob(currentPlan());
      download(planFileName('png'), blob); toast('Картинка сохранена'); break;
    }
    case 'plan-pdf': {
      const prevTitle = document.title; document.title = planFileName('').replace(/\.$/, '');
      window.print(); document.title = prevTitle; break;
    }
    case 'plan-text': toast(await copyText(planAsText(currentPlan())) ? 'План скопирован текстом' : 'Не удалось скопировать'); break;
    case 'plan-share': {
      const blob = await planImageBlob(currentPlan());
      const file = new File([blob], planFileName('png'), { type: 'image/png' });
      try { await navigator.share({ files: [file], title: currentPlan().title, text: planAsText(currentPlan()) }); } catch (err) {}
      break;
    }
    case 'export-json': download(`workout-backup-${todayIso()}.json`, JSON.stringify(state, null, 2), 'application/json'); break;
    case 'import-json': $('#fileInput').click(); break;
    case 'load-seed':
      if (state.history.length && !confirm('Стартовые данные заменят текущие. Продолжить? (Сначала можно скачать бэкап.)')) break;
      state = buildSeed(); save(); draft = null; saveDraft(); toast('Стартовые данные загружены'); setTab('today'); break;
    case 'wipe':
      if (confirm('Удалить все тренировки, планы и профиль? Это нельзя отменить.')) { state = emptyState(); save(); draft = null; saveDraft(); setTab('today'); }
      break;
  }
});

document.addEventListener('input', (e) => {
  const el = e.target;
  if (el.id === 'reqText' || el.id === 'reqInsist' || el.id === 'reportText') {
    ui.reqText = $('#reqText').value; ui.reqInsist = $('#reqInsist').checked; ui.report = $('#reportText').value; saveUi();
    const pr = buildPrompt(ui.promptCount);
    $('#promptText').textContent = pr; $('#promptSize').textContent = `~${Math.round(pr.length / 100) / 10}k символов`;
    return;
  }
  if (!draft || ui.tab !== 'log') return;
  if (el.dataset.f) { draft[el.dataset.f] = el.type === 'checkbox' ? el.checked : el.value; saveDraft(); return; }
  if (el.dataset.ex !== undefined) {
    const ex = draft.exercises[+el.dataset.ex]; if (!ex) return;
    const k = el.dataset.k;
    if (el.dataset.set !== undefined) {
      const s = ex.sets[+el.dataset.set];
      s[k] = (k === 'done' || k === 'warmup') ? el.checked : (el.value === '' ? null : num(el.value));
    } else ex[k] = el.value;
    saveDraft();
  }
});
document.addEventListener('change', (e) => {
  const el = e.target;
  if (el.id === 'promptCount') { ui.promptCount = +el.value; saveUi(); render(); }
  if (ui.tab === 'log' && (el.dataset.k === 'unit' || el.dataset.k === 'warmup')) render();
});

$('#fileInput').addEventListener('change', async (e) => {
  const file = e.target.files[0]; e.target.value = '';
  if (!file) return;
  try {
    const data = JSON.parse(await file.text());
    if (!Array.isArray(data.history) || !Array.isArray(data.plans)) throw new Error();
    if (!confirm(`Восстановить ${data.history.length} записей и ${data.plans.length} планов? Текущие данные будут заменены.`)) return;
    delete data.profile;
    state = { ...emptyState(), ...data };
    save(); toast('Данные восстановлены'); render();
  } catch (err) { toast('Файл не похож на бэкап этого приложения'); }
});

let resizeT; window.addEventListener('resize', () => { clearTimeout(resizeT); resizeT = setTimeout(() => { if (ui.tab === 'progress') mountChart(); }, 150); });
